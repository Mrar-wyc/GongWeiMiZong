e":null,"trust":[],"unlock":null},"key":"::取铜药匙 · 就着灯嗅一嗅","label":"取铜药匙 · 就着灯嗅一嗅","locked_hint":"","locked_if":null,"repeatable":false,"suspect":"","tag":"","to":"","visible_if":["any",[["not",["clue","aconite_smell"]],["not",["clue","store_key"]]]],"wants":""},{"detail":"对一对账面余量","effect":{"add_clues":["aconite_gap"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":"附子格里只剩小半格。你把药粉拨平，对着账页上昨日的余量看——少了三钱，缺口处的粉印还是新的。\n三钱。刚好是能让人死、又不至于立刻倒下的分量。","time":null,"trust":[],"unlock":null},"key":"::拉开药柜第三层 · 附子格","label":"拉开药柜第三层 · 附子格","locked_hint":"","locked_if":null,"repeatable":false,"suspect":"","tag":"","to":"","visible_if":["all",[["clue","aconite_smell"],["not",["clue","aconite_gap"]]]],"wants":""},{"detail":"他到底死在什么时候","effect":{"add_clues":["gy_time","night_roster2"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":"尸僵已经过了肩，尸温摸上去和地砖差不多。他死在子时之前。\n你翻案上的值夜簿：末一行「丑时初，巡库」，签的是他自己的名。\n写下这一行的时候，他已经死了。有人替他签了字，还比他本人写得像。","time":null,"trust":[],"unlock":null},"key":"::验尸僵与尸温 · 推定死亡时辰","label":"验尸僵与尸温 · 推定死亡时辰","locked_hint":"","locked_if":null,"repeatable":false,"suspect":"","tag":"","to":"","visible_if":["any",[["not",["clue","gy_time"]],["not",["clue","night_roster2"]]]],"wants":""},{"detail":"门是怎么合上的","effect":{"add_clues":["bolt_thread"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":"闩是好的，栓槽里卡着一小截青丝线，线头有拉断的毛边。\n线从外头穿进来，套住闩尾一拉——门就在屋里没人的情况下，从外面栓上了。\n和凤仪殿那扇窗棂上的撬痕，是同一种手法。","time":null,"trust":[],"unlock":null},"key":"::查看门闩 · 栓槽里卡着什么","label":"查看门闩 · 栓槽里卡着什么","locked_hint":"","locked_if":null,"repeatable":false,"suspect":"","tag":"","to":"","visible_if":["any",[["not",["clue","bolt_thread"]]]],"wants":""},{"detail":"值夜的人在哪儿","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"key":"night_room::前往 · 药局值房","label":"前往 · 药局值房","locked_hint":"","locked_if":null,"repeatable":true,"suspect":"","tag":"","to":"night_room","visible_if":null,"wants":""},{"detail":"附子入库的日子","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"key":"drug_office::前往 · 尚药局账房","label":"前往 · 尚药局账房","locked_hint":"","locked_if":null,"repeatable":true,"suspect":"","tag":"","to":"drug_office","visible_if":null,"wants":""},{"detail":"把证物摊开，开始问人","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"key":"case2_hall::移步 · 药局前厅","label":"移步 · 药局前厅","locked_hint":"勘验未毕：请调阅档目，把第六幕的几份格目读全（尸格、药匙、门闩、尸僵、领用簿）","locked_if":["missing_dossier","06-YK-END"],"repeatable":true,"suspect":"","tag":"","to":"case2_hall","visible_if":null,"wants":""},{"detail":"回到案① 的结案陈词","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"key":"accuse_hall::回凤仪殿正殿 · 先把第一案的名字写上","label":"回凤仪殿正殿 · 先把第一案的名字写上","locked_hint":"","locked_if":null,"repeatable":true,"suspect":"","tag":"","to":"accuse_hall","visible_if":null,"wants":""}],"hall":"","id":"drug_store","interlocutor":"","kind":"scene","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"尚药局 · 药库","time":"寅时","title":"第六幕 · 药库"},"ending2_lightout":{"act":8,"body":"你说出「内官监少监冯保」。\n他没有生气，甚至笑了一下，然后做了一件你没想到的事：他转身走到廊下，把前厅的灯一盏一盏吹灭了。\n天还没亮透。黑暗里你听见他的声音，很近：\n「沈仵作，你查的是两具尸首。内官监管的是——谁的名字能留在纸上。」\n灯重新点起来的时候，他还在原地。底稿不见了。\n当日的文书写的是一场雪，冻死了两个当值的。\n三个月后，大理寺的档架少了一格。你被调去管义庄，在那里你验的每一具尸首，都没有名字。\n「你说出了最该说的那句话，然后就没有然后了。」","case":2,"choices":[],"hall":"","id":"ending2_lightout","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 灯灭"},"ending2_pressed":{"act":8,"body":"你报了郑守拙的名字，把青丝线、值夜簿和那本私账摆上案。\n他没有喊冤。他只是一直看着冯保。\n冯保接过底稿，从头到尾读了一遍，读到「附子三钱」四个字的时候停了一下，然后拿起笔，把「附子」改成了「寒疾」。\n「两具尸首，一个典药、一个书吏，一夜之间。」他说，「写出去，尚药局从上到下都要换人。这不合内官监的意思。」\n你想说什么，他先抬手拦住了：「沈仵作，你的名字咱家会写上去，功劳是你的。」\n底稿发下来的时候，你看了很久。上面写着：尚药局典药高延年、书吏蒋九，俱因寒疾暴卒。\n「你写的名字是真的，可送出去的纸是假的。」","case":2,"choices":[],"hall":"","id":"ending2_pressed","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 又是暴病"},"ending2_quiet":{"act":8,"body":"你把笔搁下，没有写凶手。你写的是两行事实：\n尚药局典药高延年，卒于药库，口唇麻色；书吏蒋九，卒于值房，口唇麻色。\n附子三钱，值夜簿一行，门闩上的一截线。\n「臣只能写到这儿。」你说，「再往下的名字，臣没有证据。」\n冯保看了很久，然后把底稿折起来收进袖里。\n「这也是一份结案。」他说，「只可惜——不知是谁以后要替它写下去。」\n开春以后，尚药局换了新的封条，药库的钥匙换了人拿。\n蒋九案上那盏灯，没有人再去点。\n「两具尸首，一个不肯说的名字。」","case":2,"choices":[],"hall":"","id":"ending2_quiet","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 只写两个名字"},"ending2_thin":{"act":8,"body":"你把郑守拙的话原样誊了下来。\n他承认字是他描的，承认七次取用里有三次是他签的押——可他始终没说那页纸是从哪儿来的。\n「药出有主。」你把私账翻到最后一页，「主是谁？」\n他抬眼看你，没有答。\n内官监当天就把底稿收走了。冯保读得比上一回慢，读到「描」字的时候停了一下，什么也没改。\n结案文书上写的是：尚药局掌局郑守拙，私刻药引、伪造簿册，两案并发，拟定绞。\n「药是同一双手下的」——这一句你没写进去。写不进去：你手上没有那一页。\n三个月后经卷阁封了。你托人问过那半箱账册，回话是「搬运时落水，字都泡了」。\n只有你自己还记得：那一横，起笔很重。","case":2,"choices":[],"hall":"","id":"ending2_thin","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 一页之差"},"ending2_truth":{"act":8,"body":"你把两案的纸摊在同一张案上。\n左边是凤仪殿：半盏安神茶、一炉朱砂、窗棂上的撬痕。右边是药库：三钱生附子、一截青丝线、值夜簿上描出来的那一行字。\n然后你摆出第三样东西：一本私账，每笔只写四个字——「药出有主」。七次取用，前六次在景和五年到十二年之间，第七次在贤妃薨的前一日。\n「同一个人写的字。」你说，「都是照着别人的手描的。凤仪殿的茶是一支，尚药局的附子是一支，写字的只有一支。」\n郑守拙跪下了。他说的第一句话不是求饶：「咱家十二岁进宫，认字是别人教的。教咱家写字的人说：你这一手字，能换一条命。」\n「换了几条？」你问。\n「三条。」他说，「采薇一条。高延年一条。蒋九一条。」\n他还说了第四件事：景和五年，药是从经卷阁出的，经手的人里有一个名字被水浸过，谁也看不清——但那一横起笔很重。\n冯保在门外站了很久。天亮的时候，他进来把两份底稿都收走了，一句话没说。\n三个月后你听说，经卷阁闭了。又过了半年，东宫废址的墙塌了一角，有人在里面挖出半箱账册。\n「两案并作一案：药是同一双手下的，名字也写在同一页纸上。」","case":2,"choices":[],"hall":"","id":"ending2_truth","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 两案同钉"},"ending2_wrong":{"act":8,"body":"你报了那个手上有黄渍的姑娘，或者那个十六岁、不肯熄灯的小监。\n结案文书发得很快，快到你都来不及再问一句。\n柳青被送进掖庭的时候，把自己称过的附子一笔一笔报给了记档的人：「每日三钱，一共四十七两六钱。你们可以称。」\n四十七两六钱，分毫不差。\n贺小五什么也没说。他只是把灯罩留在了值房——那是他娘留给他的东西。\n案子结了，你升了。尚药局换了掌局，药库换了封条。\n第二年冬天，又有一位娘娘在夜里薨了，口角有黑血。\n「你报了一个方便的名字，真正的写字人还坐在案前。」","case":2,"choices":[],"hall":"","id":"ending2_wrong","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 错的药方"},"ending3_byorder":{"act":11,"body":"「凶手是内官监掌印曹淳。」你说，「他封的库，他写的档。」\n曹淳没有辩。他跪下来，把袖中的封泥模子放在阶上。\n「是咱家封的门。」他说，「内官监的规矩，先封后验。」\n「炭是谁添的？」\n「咱家不知道。」他答得极稳，「咱家只知道有一扇窗要糊。」\n案子结了。写进档的是：内官监掌印曹淳，擅封宫库，致掌籍女史谢云屏毙于炭气。\n半个月后，冯保升了掌印。\n经卷阁丙字库换了新锁，钥匙收在内官监值房，领钥匙簿上从此不再出现空的销号。\n「奉旨」两个字，写得下一切。","case":3,"choices":[],"hall":"","id":"ending3_byorder","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 奉旨"},"ending3_orig":{"act":11,"body":"你把那张折了四折的纸摊在案上，连同翻模的封泥、气窗上的蜡。\n景和五年，经卷阁领炭一千二百斤，收炭一千二百斤。账目平整。唯有末尾三个朱字，写得极随意：知道了。\n「这一页是抄本。」你说，「原页在丙字库，抄本在她袖子里。抄本上少了第十七行——因为第十七行上有一个人。」\n「名录上的采薇，是后来入宫的贤妃。景和五年，她被从这一页上抹掉，本该死在掖庭——十二年后，这一页上那剂苦杏仁油，送回了凤仪殿。」\n「封门的是冯保，教他封门的人在内官监。臣要写的那个名字写不出来——臣只写这三个字。」\n天子伸出手指，在「知道了」上按了很久。\n「烧了。」他说，「连抄本一起。」\n殿前点起火盆。三桩案子的底稿一份一份送进去，纸上的字先亮起来，然后暗下去。\n——只是那天夜里，经卷阁的书案上多了一本日课簿，皮面写着景和五年，翻开那一格，字还在。","case":3,"choices":[],"hall":"","id":"ending3_orig","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 原页"},"ending3_quiet":{"act":11,"body":"你把笔搁下。\n案上摊着三桩案子：凤仪殿的茶，尚药局的附子，经卷阁的炭。三具尸首，三个说法。\n你写下的只有事实：经卷阁掌籍女史谢云屏，卒于丙字库，尸斑樱红，银针不黑；门从外锁，封泥为翻模；气窗有蜡。\n「臣只能写到这儿。」你说，「再往下，臣要写一个不能写的名字。」\n天子把那三页纸收起来，放进一个木匣。\n「合上吧。」他说。\n你合上卷宗，退出去。经卷阁的书案上，日课簿还摊在景和五年那一格——\n这一格，以后再没有人添过字。\n——三桩案子，一个不肯说的名字。","case":3,"choices":[],"hall":"","id":"ending3_quiet","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 合上卷宗"},"ending3_sealed":{"act":11,"body":"「凶手是内官监少监冯保。」你说，「他领的钥匙，他糊的窗。」\n你把领钥匙簿呈上去：前日寅时，钥匙领出去了，没有还。\n冯保跪在阶下，一句话没说。天子看完了案卷，搁下笔。\n「留中。」\n留中的意思是：不发，不抄，不议。\n案卷被收进内廷，从此没有人再见过它。\n你回到经卷阁时，丙字库的门开着：炭盆、气窗、封泥都收拾干净了。\n门上新换了一道封条，封泥是今年的年号，按得规规矩矩。\n那一枚翻模的旧印，从此谁也没有再提起。\n「名字是真的，纸是留中的。」","case":3,"choices":[],"hall":"","id":"ending3_sealed","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 留中"},"ending3_unspeakable":{"act":11,"body":"「臣要对质的是——」你抬起头，「御笔。」\n阶上没有人说话。曹淳闭上了眼，冯保把额头贴在地上。\n天子看着你，看了很久，然后笑了一下。\n「知道了。」他说，「你退下吧。」\n第二天，你被调去管义庄。第三年，你的名字从刑部的名册上消失了。\n有说你在任上病死的，有说你夜半出城往南去了的。\n景和五年那一页还在经卷阁的书案上，末尾三个字是今上的笔。\n它没有被人抄过，也没有被人烧过。\n它只是没有被人念出来。","case":3,"choices":[],"hall":"","id":"ending3_unspeakable","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 不可说"},"ending3_wrong":{"act":11,"body":"「是陆文昭。」你说，「她抄的最后一页，她袖子里那张纸。」\n「是常安。」你说，「他搬的炭，他糊的窗。」\n审问那天，常安才十六岁。他一直在抖，说不清是听了谁的话去糊窗。\n陆文昭把袖子翻过来给你看：里面空了——那张纸她烧了，火盆里还剩一角没烧尽的边。\n结案文书上写的是：候补书吏陆文昭，因争掌籍之职，谋害其师。或者是：看阁小监常安，失职致人死亡。\n三日后，常安被送去做苦役。九日后，他在工地上死了，仵作说是摔的。\n经卷阁照着旧例换了封条。丙字库的钥匙，还是内官监的人拿。\n你写完最后一行，墨还没干。","case":3,"choices":[],"hall":"","id":"ending3_wrong","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 替罪的人"},"ending_bystander":{"act":5,"body":"你把记事簿合上：「此案暂无确证，臣请再查。」\n皇帝没有让你再查。他让你把簿子留下。\n贤妃以「薨于旧疾」下葬，丧仪如制。王德海照旧当他的总管，只是从此见了你便绕道走。三个月后，小顺子被调去了皇陵，说是「他自己求的」。\n你在记事簿的最后一页写过一句话，交上去之前，你把它撕了下来，投进了烛火里：「我知道是谁。我知道我为什么不说。」\n「你交出了簿子。这座宫城照旧运转，一点声音也没有。」","case":1,"choices":[],"hall":"","id":"ending_bystander","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 查不出来"},"ending_dangerous":{"act":5,"body":"你报了皇后的名字，然后把那枚玉扳指的事端了出来——先帝所赐，本该在太子手上。\n皇后的脸在灯下白了一层。她看着皇帝，一个字都没说。\n殿上安静了很久。皇帝说：「沈墨白，你查的是贤妃的死。」\n「臣查的是贤妃的死因。」你说，「她死前见的是皇后娘娘。」\n然后你被请了出去。当晚你被挪进大理寺的值房，门口多了一个人守着。\n三日后结案：太监总管王德海「因账目亏空、谋害主位」，杖毙——是皇帝自己下的旨。你知道那是对的，也知道那不是全部。\n你保住了命，保住了官，也从此被记在了那本不该记的册子上。\n「你说出了更危险的那半截真相。它没有杀死你，但也再没有第二个人听见。」","case":1,"choices":[],"hall":"","id":"ending_dangerous","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 玉扳指"},"ending_false":{"act":5,"body":"你报出的名字，不是那个把茶端进去的人。\n证据被一条条驳了回来。贵妃当堂冷笑：「汤碗还在厨下，大人不妨去验；倒是那盏茶——是谁端进去的？」\n皇帝看着你，看了很久，然后说：「沈墨白，你验了四十七具尸首，今日这一具，你验坏了。」\n结案如你所请。三日后，那人被处死。\n又过了七日，御膳房的小顺子在掖庭的井里被捞了上来。仵作验的是溺水——你去看过那个井口，井沿上有一道新鲜的血痕。\n你从此不再接宫里的差事。夜里偶尔会想起王德海跪在门槛外那副肩膀一抽一抽的样子，然后想起他抬头看你的那一眼。\n「错的人死了，对的人还在。这桩案子从此没有人再敢查。」","case":1,"choices":[],"hall":"","id":"ending_false","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 替罪的人"},"ending_pressured":{"act":5,"body":"皇帝在你开口之前先开了口。\n「贤妃久病，痰壅气绝。」他说，「仵作验过了。」\n你验过了。你验出的是一根变黑的银针、一盏有苦杏仁味的冷茶，和一张没写完的笺纸。这些话在你喉咙里滚了一圈，最后你低头：「……是。」\n案子就这样收了。王德海被调去守陵，三日后在陵上自缢。皇后那枚玉扳指没人再提。采薇的名字依旧不在名册上。\n你走出宫门的时候天亮了。你把记事簿收进袖子，觉得它比来时重。\n「你活着，且升了官。只是从此以后，你再没有验过一具宫里的尸首。」","case":1,"choices":[],"hall":"","id":"ending_pressured","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 按下"},"ending_quiet":{"act":5,"body":"你把簿子放进火盆，看着它烧完，然后解了腰牌。\n「臣验不出来。」你说，「臣请辞。」\n皇帝盯着你看了很久，最后摆了摆手。\n三个月后，京城西市开了一家小药铺，掌柜的姓沈，验尸的手艺改成了看脉。偶尔有官差上门求验伤，他都推了。\n只有一个夜里，一个裹着斗篷的女人来买安神的药，付钱时掉出一枚玉扳指，骨碌碌滚到柜台底下。\n「客官的东西。」\n「不是我的。」她说，「扔了吧。」\n「你把扳指扔进了井里。从此再没有谁提起贤妃。」","case":1,"choices":[],"hall":"","id":"ending_quiet","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 辞官"},"ending_restitution":{"act":5,"body":"你把每一件都摆了出来：银针变黑是七日积毒而非即刻鸩杀；香炉里的朱砂只会叫人昏沉，那是布给你看的障眼法；窗棂上的撬痕、栓下的木屑，说明门是从外头拨上的；尚药局簿上七次支取苦杏仁油，记的都是王德海的名，字迹却各不相同——有人替他写，那笔迹和十二年前采薇案卷里的供词一模一样。\n最后你念出贤妃那张没写完的笺纸，念到「王德海经手，账目有亏」时，王德海的肩膀塌了下去。\n「她……她查了三个月。」他说，「她要翻十二年前的事。老奴这条命，是从那时候活到现在的。」\n他又抬起头，眼睛红着：「皇后娘娘也恨她。可是娘娘没动手。是老奴动的手。茶是亥时初送的，她喝了半盏，问老奴为什么手抖。」\n皇帝没有立刻说话。他先问：「她走的时候，疼么。」\n「不疼。」你说，「苦杏仁油是慢慢走的，人会先睡过去。」\n那句话像一块石头落进水里。皇帝闭了一下眼，才开口：「杖毙。同罪者，一并查。」\n——同罪者。你抬起头，看见皇后在手心里攥紧了那枚玉扳指。\n三个月后，掖庭重修名册，采薇的名字被添回了一笔。你升了大理寺丞，从此再没人敢在你验尸的时候说话。\n「真相大白，且未曾被任何人按下。」","case":1,"choices":[],"hall":"","id":"ending_restitution","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 铁证如山"},"ending_standard":{"act":5,"body":"你摆出了茶盏、苦杏仁油、香炉灰与窗棂上的刮痕，把王德海按在了案上。\n他招了：茶是亥时初送的，他本来只想让她昏睡几日，好把账目上的窟窿填平。可他没算准分量——或者说，他算准了。\n「杖毙。」皇帝说。\n王德海被拖出去的时候，回头看了你一眼，像是要说什么，最后什么也没说。\n案子结了，结得很干净。只是你总觉得，还有些东西没有摆到案上——比如那枚不该出现在皇后手上的玉扳指，比如采薇。\n皇帝赏了你二十两银、一件狐裘，还有一句话：「此案，不必再提。」\n「凶手伏法，但水面下的东西，你没有捞完。」","case":1,"choices":[],"hall":"","id":"ending_standard","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 尘埃落定"},"ending_treason":{"act":5,"body":"「陛下。」\n这两个字在殿上落地的时候，你就已经知道后面会发生什么了。\n皇帝没有怒。他只是很轻地叹了口气，像是终于等到一件早知道会来的事。\n「沈墨白，你验尸验得久了，把活人也当成了死物。」\n当夜，大理寺的档案房走水，烧了三间屋。仵作沈墨白「殉于火」。\n贤妃以「薨于旧疾」入陵。王德海守陵三年，未死。小顺子后来补进了尚药局，做事很稳，只是从不碰茶。\n「在这座宫里，天子没有案子。」","case":1,"choices":[],"hall":"","id":"ending_treason","interlocutor":"","kind":"ending","on_enter":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"place":"结案","time":"卯时","title":"结局 · 天子无案"},"interrogate_hall":{"act":3,"body":"侧殿比正殿冷。你在案上摊开记事簿，把今夜要问的人一个个传进来。\n窗纸透出更鼓的影，你写下第一行字：「戌时遣人、亥时送茶、亥时末破门」。\n三个人有这个空档：掌殿起居的王德海、私访过凤仪殿的皇后、送过汤的贵妃。皇帝则在殿外站着，站了很久。\n（问对人、出示对证物，才能撬开他们的嘴。）","case":1,"choices":[{"detail":"最清楚凤仪殿今夜一切的人","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"key":"talk_wdh::传唤 · 太监总管王德海","label":"传唤 · 太监总管王德海","locked_hint":"","locked_if":null,"repeatable":true,"suspect":"","tag":"","to":"talk_wdh","visible_if":null,"wants":"WDH"},{"detail":"今夜的茶是谁送进去的","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"key":"talk_xse::传唤 · 御膳房小监小顺子   function nowStamp() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
      " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  // ------------------------------------------------------------------
  // 引擎
  // ------------------------------------------------------------------

  function Game(pack) {
    this.content = pack;
    this.time_order = pack.time_order || ["子时三刻"];
    this.topics_by_char = {};
    for (var i = 0; i < pack.topics.length; i++) {
      var t = pack.topics[i];
      (this.topics_by_char[t.owner] = this.topics_by_char[t.owner] || []).push(t);
    }
    ENGINE = this;
    this.state = this.newGame();
  }

  Game.prototype.timeIndex = function (t) {
    var i = this.time_order.indexOf(t);
    return i < 0 ? 0 : i;
  };

  // -- 新局 -----------------------------------------------------------
  Game.prototype.newGame = function () {
    var c = this.content;
    var st = {
      scene: c.start_scene, chapter: 1, case: 1, time: "", place: "",
      clues: [], items_owned: [], trust: {}, flags: [], visited: [],
      seen_choices: [], topics_asked: [], log: [], accused: "",
      score: 0, hurt: 0, ending: "", turn: 0, interrogating: "",
      dossiers: {}, notes: [], dossier_titles: {}, act_titles: {},
      open_dossier: ""
    };
    for (var cid in c.characters) { st.trust[cid] = c.characters[cid].trust; }
    for (var k = 0; k < (c.starter_dossiers || []).length; k++) {
      var did = c.starter_dossiers[k];
      if (c.dossiers[did]) { st.dossiers[did] = [false, false]; }
    }
    this.state = st;
    this.goTo(c.start_scene, null);
    return st;
  };

  // -- 存档（与 GameState.to_save 逐字对齐） ---------------------------
  Game.prototype.toSave = function () {
    var st = this.state;
    var dossiers = {}, did;
    var keys = Object.keys(st.dossiers).sort();
    for (var i = 0; i < keys.length; i++) {
      did = keys[i];
      dossiers[did] = [!!st.dossiers[did][0], !!st.dossiers[did][1]];
    }
    var titles = {}, tkeys = Object.keys(st.dossier_titles).sort();
    for (var j = 0; j < tkeys.length; j++) { titles[tkeys[j]] = st.dossier_titles[tkeys[j]]; }
    var acts = {}, akeys = Object.keys(st.act_titles).sort();
    for (var k = 0; k < akeys.length; k++) { acts[akeys[k]] = st.act_titles[akeys[k]]; }
    return {
      scene: st.scene, chapter: st.chapter, case: st.case, time: st.time, place: st.place,
      clues: st.clues.slice(), items_owned: st.items_owned.slice(),
      trust: Object.assign({}, st.trust),
      flags: st.flags.slice().sort(),
      visited: st.visited.slice().sort(),
      seen_choices: st.seen_choices.slice().sort(),
      topics_asked: st.topics_asked.slice(),
      log: st.log.slice(-160).map(function (e) { return [e[0], e[1]]; }),
      accused: st.accused, score: st.score, hurt: st.hurt,
      ending: st.ending, turn: st.turn, interrogating: st.interrogating,
      dossiers: dossiers, notes: st.notes.slice(),
      dossier_titles: titles, act_titles: acts,
      open_dossier: st.open_dossier
    };
  };

  Game.prototype.save = function () {
    return { v: 1, state: this.toSave(), title: this.content.title, stamp: nowStamp() };
  };

  Game.prototype.fromSave = function (payload) {
    var data = (payload && payload.state) ? payload.state : payload;
    var c = this.content;
    var st = this.newGame();
    st.scene = data.scene || c.start_scene;
    st.chapter = parseInt(data.chapter || 1, 10);
    st.case = parseInt(data.case || 1, 10);
    st.time = data.time === undefined ? st.time : data.time;
    st.place = data.place === undefined ? st.place : data.place;
    st.clues = (data.clues || []).slice();
    st.items_owned = (data.items_owned || []).slice();
    st.trust = {};
    var t = data.trust || {};
    for (var cid in t) { st.trust[cid] = parseInt(t[cid], 10); }
    st.flags = (data.flags || []).slice();
    st.visited = (data.visited || []).slice();
    st.seen_choices = (data.seen_choices || []).slice();
    st.topics_asked = (data.topics_asked || []).slice();
    st.log = (data.log || []).map(function (e) { return [e[0], e[1]]; });
    st.accused = data.accused || "";
    st.score = parseInt(data.score || 0, 10);
    st.hurt = parseInt(data.hurt || 0, 10);
    st.ending = data.ending || "";
    st.turn = parseInt(data.turn || 0, 10);
    st.interrogating = data.interrogating || "";
    st.dossiers = {};
    var ds = data.dossiers || {};
    for (var did in ds) {
      var pair = ds[did] || [false, false];
      st.dossiers[did] = [!!pair[0], !!pair[1]];
    }
    st.notes = (data.notes || []).slice();
    st.dossier_titles = Object.assign({}, data.dossier_titles || {});
    st.act_titles = Object.assign({}, data.act_titles || {});
    st.open_dossier = data.open_dossier || "";
    this.state = st;
    return st;
  };

  // -- 场景 -----------------------------------------------------------
  Game.prototype.scene = function (id) {
    return this.content.scenes[id || this.state.scene];
  };

  // -- 档案 -----------------------------------------------------------
  Game.prototype.dossierExists = function (did) {
    return !!this.content.dossiers[did];
  };

  // 这份档案属于第几案（按它的幕号查内容包里的 act_case 表）。
  Game.prototype.dossierCase = function (did) {
    var d = this.content.dossiers[did];
    if (!d) { return 0; }
    var m = this.content.act_case || {};
    return m[String(d.act)] || 1;
  };

  Game.prototype.canReadDossier = function (did) {
    var d = this.content.dossiers[did];
    if (!d) { return false; }
    if (dossierKnown(this.state, did)) { return true; }
    var open = (d.requires === null || d.requires === undefined)
      || !!evalAst(d.requires, this.state);
    if (open) { return true; }
    // 剧情锁：还没走到的案子，档号拼对了也调不到。
    if (this.dossierCase(did) > this.state.case) { return false; }
    return d.requires === null || d.requires === undefined;
  };

  Game.prototype.collectDossier = function (did, upd, guessed) {
    var c = this.content;
    if (!c.dossiers[did]) { return false; }
    if (!(did in this.state.dossiers)) {
      this.state.dossiers[did] = [false, !!guessed];
      if (upd && !guessed) { upd.new_dossiers.push(did); }
      return true;
    }
    return false;
  };

  Game.prototype.readDossier = function (did) {
    var upd = newUpdate();
    var d = this.content.dossiers[did];
    if (!d) { throw new Error("剧本缺少档案: " + did); }
    if (!this.canReadDossier(did)) { throw new Error("这份档案还不能调阅: " + did); }
    var first = !dossierRead(this.state, did);
    var guessed = false;
    if (!(did in this.state.dossiers)) {
      guessed = true;
      this.collectDossier(did, upd, true);
    }
    var st = this.state.dossiers[did];
    st[0] = true;
    this.state.open_dossier = did;
    this.state.turn += 1;
    if (first) {
      upd.new_dossiers.push(did);
      upd.toasts.push(d.found_msg || "//得到新档案——收录至档目//");
      var body = d.body;
      if (guessed) {
        body = body + "\n\n——这份档案不在册上。是你自己把档号拼出来的。";
      }
      this.state.log.push(["dossier", body]);
      upd.narration.push(body);
      // 与 Python 引擎同构：效果只在第一次打开时结算。
      this.applyEffect(d.effect, upd);
    } else {
      this.state.log.push(["system", "重阅 " + did + " · " + this.titleOfDossier(did)]);
    }
    for (var i = 0; i < (d.links || []).length; i++) {
      this.collectDossier(d.links[i], upd, false);
    }
    return upd;
  };

  Game.prototype.closeDossier = function () {
    this.state.open_dossier = "";
  };

  Game.prototype.dossierHints = function (did) {
    var d = this.content.dossiers[did];
    if (!d) { return 0; }
    var missing = 0;
    for (var i = 0; i < (d.links || []).length; i++) {
      var link = d.links[i];
      if (!this.content.dossiers[link]) { continue; }
      if (!dossierKnown(this.state, link)) { missing += 1; }
    }
    return missing;
  };

  Game.prototype.knownDossiers = function () {
    var out = [];
    for (var did in this.state.dossiers) {
      if (!this.state.dossiers[did][1]) { out.push(did); }
    }
    return out.sort();
  };

  Game.prototype.titleOfDossier = function (did) {
    var custom = this.state.dossier_titles[did];
    if (custom) { return custom; }
    var d = this.content.dossiers[did];
    return d ? d.title : did;
  };

  Game.prototype.actTitleOf = function (act) {
    var custom = this.state.act_titles[String(act)];
    if (custom) { return custom; }
    return this.content.act_titles[String(act)] || String(act);
  };

  /**
   * 顶栏那个「幕」该印第几幕：手上正读着档案，就印那份档案的幕（读第二幕的账目
   * 时别让人以为还停在第一幕）；没在读档案，就印当前的进度。
   *
   * 传的是**界面此刻正在显示的那一份**，不要改成直接看 `state.open_dossier`：
   * 那是引擎替存档记着的「上次读到哪儿」，读完退回卷宗、或读一份旧存档之后
   * 它仍然指着旧档，顶栏就会印错幕 —— 案① 已经结案、人站在第六幕的药库前，
   * 顶栏却写着「第一幕 · 贤妃薨（勘验）」。
   */
  Game.prototype.headAct = function (readingDossierId) {
    var d = readingDossierId ? this.content.dossiers[readingDossierId] : null;
    if (d && d.act) { return d.act; }
    return this.state.chapter;
  };

  Game.prototype.dossierIndex = function () {
    var out = [];
    var acts = this.content.act_numbers || [];
    var known = this.knownDossiers();
    for (var i = 0; i < acts.length; i++) {
      var act = acts[i], rows = [];
      for (var j = 0; j < known.length; j++) {
        var did = known[j], d = this.content.dossiers[did];
        if (!d || d.act !== act) { continue; }
        rows.push([did, this.titleOfDossier(did), this.dossierHints(did),
                   dossierRead(this.state, did)]);
      }
      if (rows.length) { out.push([act, rows]); }
    }
    return out;
  };

  Game.prototype.searchDossiers = function (term, limit) {
    limit = limit || 40;
    var t = (term || "").trim();
    if (!t) { return []; }
    var out = [];
    var keys = Object.keys(this.state.dossiers).sort();
    for (var i = 0; i < keys.length; i++) {
      var did = keys[i];
      if (!dossierRead(this.state, did)) { continue; }
      var d = this.content.dossiers[did];
      if (!d) { continue; }
      var hay = d.title + "\n" + d.body;
      var idx = hay.indexOf(t);
      if (idx < 0) { continue; }
      var lo = Math.max(0, idx - 18);
      var hi = Math.min(hay.length, idx + t.length + 22);
      var snippet = hay.slice(lo, hi).split("\n").join(" ");
      if (lo > 0) { snippet = "…" + snippet; }
      if (hi < hay.length) { snippet = snippet + "…"; }
      out.push([did, this.titleOfDossier(did), snippet]);
      if (out.length >= limit) { break; }
    }
    return out;
  };

  Game.prototype.dossierMeta = function (d) {
    var bits = [];
    if (d.time_code) { bits.push(d.time_code); }
    if (d.place_code) { bits.push(d.place_code); }
    if (d.people && d.people.length) {
      var names = [];
      for (var i = 0; i < d.people.length; i++) {
        var ch = this.content.characters[d.people[i]];
        names.push(ch ? ch.name : d.people[i]);
      }
      bits.push(names.join("、"));
    }
    return bits.join(" · ");
  };

  Game.prototype.dossierView = function (did, width) {
    width = width || 74;
    var d = this.content.dossiers[did];
    if (!d) { return ["找不到档案：" + did]; }
    var lines = [did + " · " + this.titleOfDossier(did)];
    var meta = this.dossierMeta(d);
    if (meta) { lines.push(meta); }
    lines.push("");
    var paras = (d.body || "").split("\n");
    for (var i = 0; i < paras.length; i++) {
      if (!paras[i].trim()) { lines.push(""); continue; }
      lines = lines.concat(wrapCjk(paras[i], width));
    }
    var hints = this.dossierHints(did);
    if (hints) {
      lines.push("");
      lines.push("——这份档案还牵着 " + hints + " 份未收集的档。");
    }
    return lines;
  };

  // -- 选项 -----------------------------------------------------------
  Game.prototype.options = function () {
    var scene = this.scene(), st = this.state;
    if (scene.kind === "ending") { return []; }
    var raw = scene.choices.map(function (ch) { return [ch, null]; });
    if (scene.interlocutor) {
      raw = raw.concat(this.interrogationChoices(scene.interlocutor));
    }
    var options = [];
    for (var i = 0; i < raw.length; i++) {
      var choice = raw[i][0], topicId = raw[i][1];
      var vis = choice.visible_if, lock = choice.locked_if || choice.locked_by;
      if (vis && !evalAst(vis, st)) { continue; }
      if (!choice.repeatable && st.seen_choices.indexOf(choice.key) >= 0) { continue; }
      var enabled = true, hint = "";
      if (lock && evalAst(lock, st)) {
        enabled = false;
        hint = choice.locked_hint || "条件不足";
      }
      options.push({
        index: 0, label: choice.label, detail: choice.detail || "",
        enabled: enabled, hint: hint, wants: choice.wants || "",
        tag: choice.tag || "", gated: !!(vis || lock),
        asked: st.seen_choices.indexOf(choice.key) >= 0,
        choice: choice, topic_id: topicId, engine: this
      });
    }
    for (var k = 0; k < options.length; k++) { options[k].index = k + 1; }
    return options;
  };

  Game.prototype.topicsFor = function (cid) {
    return this.topics_by_char[cid] || [];
  };

  Game.prototype.interrogationChoices = function (cid) {
    var out = [], st = this.state;
    var topics = this.topicsFor(cid);
    for (var i = 0; i < topics.length; i++) {
      var topic = topics[i];
      var enabled = true, hint = "";
      if (topic.gate && !evalAst(topic.gate, st)) {
        enabled = false;
        hint = topic.gate_hint || "尚不可问";
      }
      var asked = st.seen_choices.indexOf("topic::" + topic.id) >= 0;
      if (asked && enabled) { continue; }
      out.push([{
        // 与 Python 侧一致：问题选项自带 key = `"{to}::{label}"`，而这里的 to 是空串，
        // 所以 key 就是 `"::" + label`；`topic::<id>` 是另外记的一条（见 choose）。
        key: "::" + topic.label, label: topic.label,
        detail: topic.present ? "出示证物" : "", to: "",
        effect: topic.effect,
        locked_if: enabled ? null : ["always"], locked_hint: hint,
        wants: cid, tag: "interrogate", repeatable: false
      }, topic.id]);
    }
    var ch = this.content.characters[cid];
    // 与 Python 侧一致：问询场景可以自带退场去处（案② 回自己的前厅）
    var hall = this.scene().hall || this.content.interrogate_hall;
    out.push([{
      key: hall + "::" + "作揖告退 · 结束对「" +
        (ch ? ch.name : cid) + "」的问询",
      label: "作揖告退 · 结束对「" + (ch ? ch.name : cid) + "」的问询",
      detail: "", to: hall, effect: emptyEffect(),
      wants: cid, tag: "interrogate", repeatable: true
    }, null]);
    return out;
  };

  // -- 选择与效果 -----------------------------------------------------
  Game.prototype.choose = function (choice, topicId) {
    var upd = newUpdate();
    var st = this.state;
    if (st.seen_choices.indexOf(choice.key) < 0) { st.seen_choices.push(choice.key); }
    if (choice.suspect) {
      st.accused = choice.suspect;
      if (st.flags.indexOf("accused") < 0) { st.flags.push("accused"); }
    }
    if (topicId) {
      var tkey = "topic::" + topicId;
      if (st.seen_choices.indexOf(tkey) < 0) { st.seen_choices.push(tkey); }
      if (st.topics_asked.indexOf(topicId) < 0) { st.topics_asked.push(topicId); }
      var topic = this.topicById(topicId);
      var said = topic ? topic.response : "";
      if (said) {
        st.log.push(["narration", said]);
        upd.narration.push(said);
      }
    }
    this.applyEffect(choice.effect, upd);
    st.turn += 1;
    var target = (choice.effect && choice.effect.scene) || choice.to;
    if (target) {
      this.goTo(target, upd);
    } else if (!topicId) {
      st.log.push(["choice", choice.label]);
    }
    return upd;
  };

  Game.prototype.topicById = function (tid) {
    for (var i = 0; i < this.content.topics.length; i++) {
      if (this.content.topics[i].id === tid) { return this.content.topics[i]; }
    }
    return null;
  };

  Game.prototype.applyEffect = function (eff, upd) {
    upd = upd || newUpdate();
    if (!eff) { return upd; }
    var st = this.state, c = this.content, i;
    for (i = 0; i < (eff.add_clues || []).length; i++) {
      var cid = eff.add_clues[i];
      if (st.clues.indexOf(cid) >= 0 || st.items_owned.indexOf(cid) >= 0) { continue; }
      st.clues.push(cid);
      var item = c.items[cid];
      var name = item ? item.name : cid;
      upd.new_clues.push(name);
      upd.toasts.push("得到线索 · " + name);
      st.log.push(["clue", "【线索】" + name + " —— " + (item ? item.desc : "")]);
    }
    for (i = 0; i < (eff.add_items || []).length; i++) {
      var iid = eff.add_items[i];
      if (st.items_owned.indexOf(iid) >= 0 || st.clues.indexOf(iid) >= 0) { continue; }
      st.items_owned.push(iid);
      var it = c.items[iid];
      var iname = it ? it.name : iid;
      upd.new_items.push(iname);
      upd.toasts.push("收入行囊 · " + iname);
      st.log.push(["clue", "【物证】" + iname + " —— " + (it ? it.desc : "")]);
    }
    for (i = 0; i < (eff.trust || []).length; i++) {
      var pair = eff.trust[i], who = pair[0], delta = pair[1];
      if (!c.characters[who]) { continue; }
      var before = trustOf(st, who);
      var after = Math.max(0, Math.min(100, before + delta));
      st.trust[who] = after;
      if (after !== before) { upd.trust_changes.push([who, after - before]); }
    }
    for (i = 0; i < (eff.flags || []).length; i++) {
      if (st.flags.indexOf(eff.flags[i]) < 0) { st.flags.push(eff.flags[i]); }
    }
    for (i = 0; i < (eff.add_dossiers || []).length; i++) {
      this.collectDossier(eff.add_dossiers[i], upd, false);
    }
    if (eff.time && this.timeIndex(eff.time) >= this.timeIndex(st.time)) {
      st.time = eff.time;
    }
    st.score += eff.score || 0;
    st.hurt += eff.hurt || 0;
    if (eff.text) {
      st.log.push(["narration", eff.text]);
      upd.narration.push(eff.text);
    }
    return upd;
  };

  // -- 场景切换 -------------------------------------------------------
  Game.prototype.goTo = function (sceneId, upd) {
    upd = upd || newUpdate();
    var scene = this.content.scenes[sceneId];
    if (!scene) { throw new Error("剧本缺少场景: " + sceneId); }
    var st = this.state;
    st.scene = sceneId;
    var firstVisit = st.visited.indexOf(sceneId) < 0;
    if (firstVisit) { st.visited.push(sceneId); }
    if (scene.time && this.timeIndex(scene.time) >= this.timeIndex(st.time)) {
      st.time = scene.time;
    }
    if (scene.place) { st.place = scene.place; }
    if (scene.act) { st.chapter = scene.act; }
    if (scene.case) { st.case = scene.case; }
    st.interrogating = scene.interlocutor || "";
    upd.scene_changed = true;
    if (scene.body && firstVisit) { st.log.push(["scene", scene.body]); }
    if (scene.on_enter) { this.applyEffect(scene.on_enter, upd); }
    if (scene.kind === "ending") {
      st.ending = sceneId;
      upd.ended = true;
    }
    return upd;
  };

  // -- 结案 -----------------------------------------------------------
  Game.prototype.atVerdict = function () {
    return (this.content.verdict_scenes || []).indexOf(this.state.scene) >= 0;
  };

  Game.prototype.accuse = function (suspectId) {
    var upd = newUpdate();
    this.state.accused = suspectId;
    if (this.state.flags.indexOf("accused") < 0) { this.state.flags.push("accused"); }
    var row = this.content.verdicts[suspectId];
    if (row && row[0]) { this.goTo(row[0], upd); }
    return upd;
  };

  Game.prototype.pickEnding = function () {
    var all = this.content.endings, fallback = "ending_bystander";
    var list = [], i;
    for (i = 0; i < all.length; i++) {
      if ((all[i].case || 1) === this.state.case) { list.push(all[i]); }
    }
    if (!list.length) { list = all.slice(); }
    var preferred = fallback, found = false;
    for (i = 0; i < list.length; i++) {
      if (list[i].id === fallback) { found = true; }
    }
    if (!found) { preferred = list[list.length - 1].id; }
    for (var j = 0; j < list.length; j++) {
      var rule = list[j].rule;
      if (!rule || evalAst(rule, this.state)) { return list[j].id; }
    }
    return preferred;
  };

  Game.prototype.finalize = function () {
    var eid = this.pickEnding();
    this.goTo(eid, null);
    this.state.ending = eid;
    return eid;
  };

  Game.prototype.endingInfo = function () {
    var eid = this.state.ending, list = this.content.endings;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === eid) { return list[i]; }
    }
    return null;
  };

  // -- 查询 -----------------------------------------------------------
  Game.prototype.clueName = function (cid) {
    var item = this.content.items[cid];
    return item ? item.name : cid;
  };

  Game.prototype.coreTotal = function () {
    var n = 0;
    for (var id in this.content.items) {
      if (this.content.items[id].core) { n += 1; }
    }
    return n;
  };

  function newUpdate() {
    return {
      toasts: [], new_clues: [], new_items: [], new_dossiers: [],
      trust_changes: [], narration: [], scene_changed: false, ended: false
    };
  }

  function emptyEffect() {
    return {
      text: null, add_clues: [], add_items: [], add_dossiers: [],
      trust: [], flags: [], time: null, scene: null, unlock: null,
      score: 0, hurt: 0
    };
  }

  return {
    Game: Game,
    evalAst: evalAst,
    cmp: cmp,
    charWidth: charWidth,
    displayWidth: displayWidth,
    wrapCjk: wrapCjk,
    newUpdate: newUpdate
  };
});

</script>

<!-- 界面 -->
<script>
/* 宫闱迷踪 · 网页端界面
 *
 * 两种操作方式**并存**（与终端版同一套设计）：
 *   1. 在 › 后面敲档号或指令 —— 「查案」的主要动作（阅档、检索、记事）
 *   2. 点/选下面的动作列表 —— 对话与抉择
 *
 * 手机上按「卷宗 / 档目 / 记事 / 检索」分页；宽屏自动三栏铺开（纯 CSS 判断）。
 * 存档写 localStorage，形状与终端版逐字相同，可「导出/导入」在两端之间搬。
 */
"use strict";

(function () {
  var PACK = window.__GONGWEI_PACK__;
  if (!PACK) {
    document.body.innerHTML = "<p style='padding:20px'>内容包没带上：请用 tools/build_web.py 重新生成。</p>";
    return;
  }

  var SAVE_KEY = "gongwei_save";
  var Engine = window.GongweiGame;
  var game = new Engine.Game(PACK);

  var ui = {
    screen: "title",        // title | game
    read: "log",            // log | dossier | index | search
    dossier: "",            // 正在看的档号（read === "dossier" 时有意义）
    searchTerm: "",
    hits: [],
    cursor: 0,
    toasts: [],
    overlay: null,          // null | {kind:"help"|"save"|"load"|"restart"|"about"}
    tab: "log",
    history: [],
    histAt: -1,
    draft: ""
  };

  // ------------------------------------------------------------------
  // 小工具
  // ------------------------------------------------------------------

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) { node.className = cls; }
    if (text !== undefined && text !== null) { node.textContent = text; }
    return node;
  }

  function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }

  function esc(text) { return text === undefined || text === null ? "" : String(text); }

  function toast(message, kind) {
    ui.toasts.push({ text: message, kind: kind || "" });
    while (ui.toasts.length > 3) { ui.toasts.shift(); }
    renderToasts();
    setTimeout(function () {
      ui.toasts.shift();
      renderToasts();
    }, 2400);
  }

  function nowStamp() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
      " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function hasSave() {
    try { return !!window.localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  }

  function readSave() {
    try {
      var raw = window.localStorage.getItem(SAVE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function writeSave() {
    try {
      var payload = game.save();
      payload.stamp = nowStamp();
      window.localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
      return true;
    } catch (e) {
      toast("存档写不进去：" + e.message, "error");
      return false;
    }
  }

  // ------------------------------------------------------------------
  // 命令行
  // ------------------------------------------------------------------

  var DOSSIER_RE = /^\d{2}-[A-Za-z]{2,4}(?:-[A-Za-z0-9]+)*$/;

  function canonDossier(text) {
    // 与终端侧的 `command.py: canon_dossier_id` 对齐：NFKC 折全角（０１－ＦＹ）、
    // 各种分隔符一律折成连字符（01_fy_wdh）、合并连续连字符、去掉首尾连字符。
    return String(text).normalize("NFKC").toUpperCase()
      .replace(/[-_—–~·\s]+/g, "-")
      .replace(/-{2,}/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  function looksLikeDossier(text) {
    if (DOSSIER_RE.test(canonDossier(text))) { return true; }
    return game.dossierExists(canonDossier(text));
  }

  /** 网页端支持的敲法（终端版还多几样，见「关于」里的说明）。 */
  function runCommand(raw) {
    var text = raw.trim();
    if (!text) { return; }
    ui.history.push(text);
    if (ui.history.length > 100) { ui.history.shift(); }
    ui.histAt = -1;

    if (/^\d+$/.test(text)) {          // 纯数字 = 选第 N 项
      var n = parseInt(text, 10);
      var opts = game.options();
      if (n >= 1 && n <= opts.length) { runOption(opts[n - 1]); return; }
      toast("没有第 " + n + " 项。", "error");
      return;
    }

    if (looksLikeDossier(text)) { readDossier(canonDossier(text)); return; }

    // 系统指令必须排在「阅档」正则**之前**：`读档` / `读取` 都以读取动词开头，
    // 先跑 READ 就会被吃成「阅 档」→ readDossier("档")，网页端读档入口直接废掉。
    // 终端侧的 command.py 一向按「长别名优先」匹配，所以只有网页中招。
    if (/^(档目|目录|档案|卷宗|目|list|ls)$/i.test(text)) { showIndex(); return; }
    if (/^(帮助|说明|help|\?|？)$/i.test(text)) { ui.overlay = { kind: "help" }; renderOverlay(); return; }
    if (/^(关于|about)$/i.test(text)) { ui.overlay = { kind: "about" }; renderOverlay(); return; }
    if (/^(存档|保存|save|s)$/i.test(text)) { doSave(); return; }
    if (/^(读档|读取|load|l)$/i.test(text)) { ui.overlay = { kind: "save" }; renderOverlay(); return; }
    if (/^(重来|重开|重新开始|restart)$/i.test(text)) { ui.overlay = { kind: "restart" }; renderOverlay(); return; }
    if (/^(离开|退出|返回标题|quit|q)$/i.test(text)) { backToTitle(); return; }

    var m = /^(?:读|看|阅|调阅|打开|启|read|open|cat)\s*(.+)$/i.exec(text);
    if (m) { readDossier(canonDossier(m[1])); return; }

    m = /^(?:搜|查|找|检索|search)\s*(.+)$/i.exec(text);
    if (m) { doSearch(m[1]); return; }

    m = /^(?:记|记事|写下|note)\s*(.+)$/i.exec(text);
    if (m) {
      game.state.notes.push(m[1].trim());
      toast("已记下。");
      ui.tab = "notes";
      render();
      return;
    }

    m = /^(?:改|修改|改写|edit)\s*(\d+)\s+(.+)$/i.exec(text);
    if (m) {
      var ei = parseInt(m[1], 10) - 1;
      if (ei >= 0 && ei < game.state.notes.length) {
        game.state.notes[ei] = m[2].trim();
        toast("改好了。");
        ui.tab = "notes";
        render();
      } else {
        toast("记事簿上没有第 " + m[1] + " 条。", "error");
      }
      return;
    }

    m = /^(?:删|划掉|del)\s*(\d+)$/i.exec(text);
    if (m) {
      var idx = parseInt(m[1], 10) - 1;
      if (idx >= 0 && idx < game.state.notes.length) {
        game.state.notes.splice(idx, 1);
        toast("划掉了。");
        render();
      } else {
        toast("记事簿上没有第 " + m[1] + " 条。", "error");
      }
      return;
    }

    // 最后退到「敲选项」：与脚本化通关同一套前缀匹配规则
    var hits = game.options().filter(function (o) {
      return o.label.indexOf(text) === 0;
    });
    if (hits.length === 1) { runOption(hits[0]); return; }
    if (hits.length > 1) {
      toast("「" + text + "」对上好几项，再多写两个字。", "error");
      return;
    }
    toast("看不明白：「" + text + "」。敲「帮助」看能敲什么。", "error");
  }

  function readDossier(did) {
    if (!game.dossierExists(did)) {
      var near = suggest(did);
      toast(near.length
        ? "档目里没有 " + did + "。相近的档号：" + near.join("、")
        : "档目里没有 " + did + "。", "error");
      return;
    }
    if (!game.canReadDossier(did)) {
      var lockedCase = game.dossierCase(did);
      toast(lockedCase > game.state.case
        ? did + " 是第 " + lockedCase + " 案的档 —— 你还没走到那一案。"
        : did + " 还没到能看的时候。", "error");
      return;
    }
    try {
      var upd = game.readDossier(did);
    } catch (err) {
      toast("读不了这份档：" + err.message, "error");
      return;
    }
    ui.read = "dossier";
    ui.dossier = did;
    ui.tab = "log";
    toastUpd(upd);
    render();
    scrollReading(0);
  }

  /** 近似档号提示：先找同前缀，再按编辑距离。 */
  function suggest(text, limit) {
    limit = limit || 3;
    var ids = Object.keys(PACK.dossiers);
    var near = ids.filter(function (id) {
      return id.indexOf(text.slice(0, 5)) === 0 && id !== text;
    });
    if (near.length) { return near.slice(0, limit); }
    function dist(a, b) {
      var m = a.length, n = b.length, prev = [], cur = [], i, j;
      for (j = 0; j <= n; j++) { prev[j] = j; }
      for (i = 1; i <= m; i++) {
        cur[0] = i;
        for (j = 1; j <= n; j++) {
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
                            prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        }
        prev = cur.slice();
      }
      return prev[n];
    }
    return ids.filter(function (id) { return dist(id, text) <= 3; }).slice(0, limit);
  }

  function toastUpd(upd) {
    (upd.toasts || []).forEach(function (t, i) {
      setTimeout(function () { toast(t, /^\/\//.test(t) ? "dossier" : ""); }, i * 260);
    });
  }

  function showIndex() {
    ui.read = "index";
    ui.tab = "index";
    render();
  }

  function doSearch(term) {
    var t = (term || "").trim();
    if (!t) { toast("要搜什么？写成「搜 银针」这样。", "error"); return; }
    ui.searchTerm = t;
    ui.hits = game.searchDossiers(t, 40);
    ui.read = "search";
    ui.tab = "search";
    if (!ui.hits.length) { toast("已阅的档案里没有「" + t + "」。", ""); }
    render();
  }

  function doSave() {
    if (writeSave()) { toast("已存入本机（存于 " + nowStamp() + "）。"); }
  }

  function doLoad() {
    var data = readSave();
    if (!data) { toast("本机没有存档。", "error"); return; }
    try {
      game.fromSave(data);
    } catch (err) {
      toast("读档失败：" + err.message, "error");
      return;
    }
    if (game.atVerdict() && !game.state.ending) { game.finalize(); }
    ui.screen = "game";
    ui.read = "log";
    ui.dossier = "";
    ui.cursor = 0;
    toast("读档完成（存于 " + (data.stamp || "——") + "）。");
    render();
  }

  function backToTitle() {
    ui.screen = "title";
    ui.overlay = null;
    ui.read = "log";
    ui.dossier = "";
    render();
  }

  // ------------------------------------------------------------------
  // 动作
  // ------------------------------------------------------------------

  function runOption(opt) {
    if (!opt) { return; }
    if (!opt.enabled) {
      toast("「" + opt.label + "」现在做不了：" + (opt.hint || "条件不足"), "error");
      return;
    }
    var upd = opt.choice
      ? game.choose(opt.choice, opt.topic_id)
      : { toasts: [], new_clues: [], new_items: [], new_dossiers: [] };
    if (game.atVerdict() && !game.state.ending) { game.finalize(); }
    ui.read = "log";
    ui.dossier = "";
    toastUpd(upd);
    var opts = game.options();
    ui.cursor = Math.min(ui.cursor, Math.max(0, opts.length - 1));
    render();
    scrollReading(1e9);
  }

  function moveCursor(step) {
    var opts = game.options();
    if (!opts.length) { return; }
    ui.cursor = (ui.cursor + step + opts.length) % opts.length;
    refreshOptions();
  }

  function scrollReading(where) {
    var body = document.getElementById("reading-body");
    if (!body) { return; }
    body.scrollTop = where > 1000 ? body.scrollHeight : where;
  }

  // ------------------------------------------------------------------
  // 渲染
  // ------------------------------------------------------------------

  var root = document.getElementById("app");

  function render() {
    document.body.setAttribute("data-tab", ui.tab);
    clear(root);
    if (ui.screen === "title") { renderTitle(); }
    else { renderGame(); }
    renderOverlay();
    renderToasts();
  }

  function renderTitle() {
    var box = el("div", "center-screen");
    box.appendChild(el("div", "brand", PACK.title));
    box.appendChild(el("div", "brand-sub", PACK.subtitle + " · 网页版"));
    box.appendChild(el("div", "rule"));
    var quote = el("div", "quote", PACK.prologue);
    box.appendChild(quote);

    var menu = el("div", "menu");
    var entries = [["新案", function () {
      game.newGame();
      ui.screen = "game";
      ui.read = "log";
      ui.cursor = 0;
      toast("//新案开卷——" + PACK.title + "//", "dossier");
      render();
      scrollReading(0);
    }]];
    if (hasSave()) {
      entries.push(["续前案（读档）", doLoad]);
    }
    entries.push(["玩法说明", function () { ui.overlay = { kind: "help" }; renderOverlay(); }]);
    entries.push(["关于本作", function () { ui.overlay = { kind: "about" }; renderOverlay(); }]);

    entries.forEach(function (pair, i) {
      var btn = el("button", "opt");
      btn.appendChild(el("span", "num", String(i + 1)));
      btn.appendChild(el("span", "label", pair[0]));
      btn.addEventListener("click", pair[1]);
      menu.appendChild(btn);
    });
    box.appendChild(menu);
    root.appendChild(box);
    renderFooter(root);
  }

  function renderGame() {
    var st = game.state;

    // -- 顶栏
    var top = el("div", "topbar");
    var row = el("div", "topbar-row");
    row.appendChild(el("span", "brand", PACK.title));
    row.appendChild(el("span", "brand-sub", PACK.subtitle));
    var seal = el("span", "seal", st.ending ? "已结案" : "第 " + st.chapter + " 幕");
    row.appendChild(seal);
    top.appendChild(row);

    var meta = el("div", "topbar-meta");
    // 「幕」跟着**眼前这一屏**走：正在读某份档案时印那份档案的幕（读第二幕的账目
    // 时别让人以为还在第一幕），否则印当前进度。不能直接看 st.open_dossier ——
    // 那是引擎替存档记着的「上次读到哪儿」，读完退回卷宗、或读一份旧存档之后
    // 它仍然指着旧档，顶栏就会印错幕（案① 已结案、人站在第六幕，却写着第一幕）。
    var headAct = game.headAct(ui.read === "dossier" ? ui.dossier : "");
    [["幕", game.actTitleOf(headAct)],
     ["时辰", st.time], ["所在", st.place], ["回合", String(st.turn)],
     ["评分", String(st.score)], ["行囊", String(st.items_owned.length)],
     ["线索", st.clues.length + "/" + Object.keys(PACK.items).filter(function (k) { return PACK.items[k].core; }).length]
    ].forEach(function (pair) {
      var span = el("span");
      span.appendChild(document.createTextNode(pair[0] + " "));
      span.appendChild(el("b", null, esc(pair[1])));
      meta.appendChild(span);
    });
    if (st.hurt) {
      var hurt = el("span");
      hurt.appendChild(document.createTextNode("心绪 "));
      hurt.appendChild(el("b", null, String(st.hurt)));
      meta.appendChild(hurt);
    }
    top.appendChild(meta);

    var tabs = el("div", "tabs");
    [["log", "卷宗"], ["index", "档目"], ["notes", "记事"], ["search", "检索"]].forEach(function (pair) {
      var b = el("button", "tab" + (ui.tab === pair[0] ? " on" : ""), pair[1]);
      b.addEventListener("click", function () {
        ui.tab = pair[0];
        if (pair[0] === "index") { ui.read = "index"; }
        if (pair[0] === "log") { ui.read = ui.dossier ? "dossier" : "log"; }
        render();
      });
      tabs.appendChild(b);
    });
    top.appendChild(tabs);
    root.appendChild(top);

    var main = el("div", "main");
    var left = el("div", "col-left");
    var right = el("div", "col-right");

    left.appendChild(renderReading());
    if (!game.state.ending) { left.appendChild(renderOptions()); }
    left.appendChild(renderCommand());

    // 窄屏靠分页切：宽屏时左栏已经在显示档目/检索的话，右栏那份由 CSS 收起来
    right.appendChild(renderIndex());
    right.appendChild(renderNotes());
    right.appendChild(renderSearchHits());
    right.appendChild(renderButtons());
    main.appendChild(left);
    main.appendChild(right);
    root.appendChild(main);
    renderFooter(root);
  }

  function renderReading() {
    var panel = el("div", "panel reading page page-log");
    var head = el("div", "panel-head");
    var titles = { log: "卷宗", dossier: "档案", index: "档目", search: "检索" };
    head.appendChild(el("span", null, titles[ui.read] || "卷宗"));
    var acts = el("span", "count");
    if (ui.read === "dossier" && ui.dossier) {
      acts.textContent = ui.dossier;
      var close = el("button", "btn small bare", "收档");
      close.addEventListener("click", function () {
        game.closeDossier();
        ui.dossier = "";
        ui.read = "log";
        render();
      });
      head.appendChild(close);
    } else {
      acts.textContent = "已收 " + game.knownDossiers().length + " 份";
    }
    panel.appendChild(head);

    var body = el("div", "panel-body");
    body.id = "reading-body";

    if (ui.read === "dossier" && ui.dossier) {
      body.appendChild(dossierCard(ui.dossier));
    } else if (ui.read === "index") {
      body.appendChild(indexTree());
    } else if (ui.read === "search") {
      body.appendChild(hitList());
    } else {
      body.appendChild(logList());
    }
    panel.appendChild(body);
    return panel;
  }

  /** 档案正文排几列：中文一格算两列，量不到就用窗口宽度估。 */
  function dossierColumns() {
    var host = document.getElementById("reading-body");
    var em = 16;
    var w = Math.min(window.innerWidth - 40, 48 * 16);
    if (host && host.clientWidth > 60) {
      em = parseFloat(window.getComputedStyle(host).fontSize) || 16;
      w = Math.min(host.clientWidth, 48 * em) - 28;
    }
    return Math.max(24, Math.floor(w / (em / 2)));
  }

  function dossierCard(did) {
    var card = el("div", "dossier-card");
    var d = PACK.dossiers[did];
    card.appendChild(el("div", "doc-head", did + " · " + game.titleOfDossier(did)));
    var meta = game.dossierMeta(d);
    if (meta) { card.appendChild(el("div", "doc-meta", meta)); }
    var body = el("pre");
    // 与终端版同一套排版：把卡片宽度折成「列数」，中文按两格算
    body.textContent = game.dossierView(did, dossierColumns()).slice(2).join("\n");
    card.appendChild(body);
    var links = (d.links || []).filter(function (x) { return PACK.dossiers[x]; });
    if (links.length) {
      var row = el("div", "doc-hint");
      row.appendChild(document.createTextNode("顺链可查："));
      links.forEach(function (x, i) {
        if (i) { row.appendChild(document.createTextNode("　")); }
        var b = el("button", "btn small bare", x);
        b.title = game.titleOfDossier(x) + (game.state.dossiers[x] ? "" : "（未收集）");
        b.addEventListener("click", function () { readDossier(x); });
        row.appendChild(b);
      });
      card.appendChild(row);
    }
    return card;
  }

  function logList() {
    var wrap = el("div");
    var entries = game.state.log;
    if (!entries.length) {
      wrap.appendChild(el("p", "empty", "案上还空着。先在 › 后面敲「档目」看看手上有哪些卷宗。"));
      return wrap;
    }
    var limit = entries.length > 120 ? entries.slice(-120) : entries;
    limit.forEach(function (entry) {
      var kind = entry[0], text = entry[1];
      var box = el("div", "log-entry log-" + kind);
      if (kind === "scene") {
        var scene = PACK.scenes[game.state.scene];
        if (scene) { box.appendChild(el("span", "scene-title", scene.title + " · " + scene.place)); }
      }
      box.appendChild(el("p", null, text));
      wrap.appendChild(box);
    });
    return wrap;
  }

  function indexTree() {
    var wrap = el("div");
    var groups = game.dossierIndex();
    if (!groups.length) {
      wrap.appendChild(el("p", "empty", "档目还空着。"));
      return wrap;
    }
    groups.forEach(function (pair) {
      var act = pair[0], rows = pair[1];
      var box = el("div", "index-act");
      box.appendChild(el("h4", null, game.actTitleOf(act)));
      rows.forEach(function (row) {
        var did = row[0], title = row[1], hint = row[2], read = row[3];
        var b = el("button", "doc-row" + (read ? "" : " unread"));
        b.appendChild(el("span", "did", did));
        b.appendChild(el("span", "title", title));
        if (hint) { b.appendChild(el("span", "hint", "还牵着 " + hint + " 份")); }
        b.addEventListener("click", function () { readDossier(did); });
        box.appendChild(b);
      });
      wrap.appendChild(box);
    });
    return wrap;
  }

  function hitList() {
    var wrap = el("div", "hits");
    if (!ui.hits.length) {
      wrap.appendChild(el("p", "empty",
        "已阅的档案里没找到「" + ui.searchTerm + "」。"));
      return wrap;
    }
    ui.hits.forEach(function (hit) {
      var b = el("button", "hit");
      b.appendChild(el("span", "did", hit[0] + " · " + hit[1]));
      b.appendChild(el("span", "snippet", hit[2]));
      b.addEventListener("click", function () { readDossier(hit[0]); });
      wrap.appendChild(b);
    });
    return wrap;
  }

  function renderOptions() {
    var panel = el("div", "panel options page page-log");
    var head = el("div", "panel-head");
    head.appendChild(el("span", null, "可以做的事"));
    head.appendChild(el("span", "count", "↑↓ 移动 · 回车确认 · 也可直接敲下面的字"));
    panel.appendChild(head);
    var body = el("div", "panel-body");
    body.id = "options-body";
    panel.appendChild(body);
    fillOptions(body);
    return panel;
  }

  function fillOptions(body) {
    var opts = game.options();
    if (!opts.length) {
      body.appendChild(el("p", "empty", "此刻没有可做的事。"));
      return;
    }
    opts.forEach(function (opt, i) {
      var b = el("button", "opt" + (opt.enabled ? "" : " locked") +
        (i === ui.cursor ? " focus" : ""));
      b.appendChild(el("span", "num", String(opt.index)));
      var label = el("span", "label", opt.label);
      if (opt.detail) { label.appendChild(el("span", "detail", opt.detail)); }
      if (!opt.enabled && opt.hint) { label.appendChild(el("span", "hint", "条件不足：" + opt.hint)); }
      if (opt.asked) { label.appendChild(el("span", "asked", "（已经问过）")); }
      b.appendChild(label);
      b.addEventListener("click", function () { runOption(opt); });
      body.appendChild(b);
    });
  }

  /** 只重画选项区（移动光标时用，免得整页重排把输入框的焦点弄丢）。 */
  function refreshOptions() {
    var body = document.getElementById("options-body");
    if (!body) { return; }
    clear(body);
    fillOptions(body);
  }

  function renderCommand() {
    var panel = el("div", "panel page page-log");
    var body = el("div", "panel-body command");
    body.appendChild(el("span", "prompt", "›"));
    var input = el("input");
    input.id = "cmd";
    input.type = "text";
    input.autocomplete = "off";
    input.autocapitalize = "off";
    input.spellcheck = false;
    input.placeholder = "输入档号或指令（如 01-FY-XFE / 档目 / 搜 银针 / 记 一句话）";
    input.value = ui.draft;
    input.addEventListener("input", function () { ui.draft = input.value; });
    input.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") {
        ev.preventDefault();
        var text = input.value;
        ui.draft = "";
        input.value = "";
        runCommand(text);
      } else if (ev.key === "Escape") {
        ui.draft = "";
        input.value = "";
      } else if (ev.key === "ArrowUp") {
        ev.preventDefault();
        if (!ui.history.length) { return; }
        if (ui.histAt < 0) { ui.draft = input.value; ui.histAt = ui.history.length; }
        ui.histAt = Math.max(0, ui.histAt - 1);
        input.value = ui.history[ui.histAt] || "";
      } else if (ev.key === "ArrowDown") {
        ev.preventDefault();
        if (ui.histAt < 0) { return; }
        ui.histAt += 1;
        if (ui.histAt >= ui.history.length) { ui.histAt = -1; input.value = ui.draft; }
        else { input.value = ui.history[ui.histAt] || ""; }
      }
    });
    body.appendChild(input);
    var go = el("button", "btn", "执行");
    go.addEventListener("click", function () {
      var text = input.value;
      ui.draft = "";
      input.value = "";
      runCommand(text);
      input.focus();
    });
    body.appendChild(go);
    var head = el("div", "panel-head");
    head.appendChild(el("span", null, "案前问话"));
    head.appendChild(el("span", "count", "回车执行"));
    panel.appendChild(head);
    panel.appendChild(body);
    return panel;
  }

  function renderIndex() {
    var panel = el("div", "panel page page-index" + (ui.read === "index" ? " mirror" : ""));
    var head = el("div", "panel-head");
    head.appendChild(el("span", null, "档目"));
    head.appendChild(el("span", "count", game.knownDossiers().length + " / " + Object.keys(PACK.dossiers).length));
    panel.appendChild(head);
    var body = el("div", "panel-body");
    body.appendChild(indexTree());
    panel.appendChild(body);
    return panel;
  }

  function renderNotes() {
    var panel = el("div", "panel notes page page-notes");
    var head = el("div", "panel-head");
    head.appendChild(el("span", null, "记事簿"));
    head.appendChild(el("span", "count", game.state.notes.length + " 条"));
    panel.appendChild(head);
    var body = el("div", "panel-body");
    if (!game.state.notes.length) {
      body.appendChild(el("p", "empty", "用「记 一句话」把想到的写下来。"));
    } else {
      var list = el("ul");
      game.state.notes.forEach(function (note, i) {
        var li = el("li");
        li.appendChild(el("span", null, (i + 1) + ". " + note));
        var del = el("button", "btn small bare del", "划掉");
        del.addEventListener("click", function () {
          game.state.notes.splice(i, 1);
          render();
        });
        li.appendChild(del);
        list.appendChild(li);
      });
      body.appendChild(list);
    }
    panel.appendChild(body);
    return panel;
  }

  function renderSearchHits() {
    var panel = el("div", "panel page page-search" + (ui.read === "search" ? " mirror" : ""));
    var head = el("div", "panel-head");
    head.appendChild(el("span", null, "检索已阅档案"));
    head.appendChild(el("span", "count", ui.searchTerm ? "「" + ui.searchTerm + "」" : ""));
    panel.appendChild(head);
    var body = el("div", "panel-body");
    if (!ui.searchTerm) {
      body.appendChild(el("p", "empty", "用「搜 银针」这样找已读过的档案。"));
    } else {
      body.appendChild(hitList());
    }
    panel.appendChild(body);
    return panel;
  }

  function renderButtons() {
    var panel = el("div", "panel page page-index page-notes page-search");
    var body = el("div", "panel-body");
    var row = el("div", "tabs");
    [["存档", doSave], ["读档/搬档", function () { ui.overlay = { kind: "save" }; renderOverlay(); }],
     ["帮助", function () { ui.overlay = { kind: "help" }; renderOverlay(); }],
     ["重来", function () { ui.overlay = { kind: "restart" }; renderOverlay(); }],
     ["回到标题", backToTitle]].forEach(function (pair) {
      var b = el("button", "btn small", pair[0]);
      b.addEventListener("click", pair[1]);
      row.appendChild(b);
    });
    body.appendChild(row);
    var info = el("p", "empty");
    info.textContent = "存档写在本机浏览器里，形状与终端版完全一样；" +
      "用「读档/搬档」把 JSON 抄出来贴到另一台机器（或 " +
      "%USERPROFILE%\\.gongwei\\save.json）就接着玩。";
    body.appendChild(info);
    panel.appendChild(body);
    return panel;
  }

  function renderFooter(target) {
    var foot = el("div", "footer");
    [["1-9", "选项"], ["↑↓", "移动"], ["回车", "确认"], ["Esc", "清空"]].forEach(function (pair, i) {
      if (i) { foot.appendChild(document.createTextNode(" · ")); }
      foot.appendChild(el("kbd", null, pair[0]));
      foot.appendChild(document.createTextNode(" " + pair[1]));
    });
    foot.appendChild(el("span", "only-narrow", "　点选项、敲档号即可。"));
    target.appendChild(foot);
  }

  // ------------------------------------------------------------------
  // 浮层与提示
  // ------------------------------------------------------------------

  function renderOverlay() {
    var old = document.getElementById("overlay");
    if (old) { old.remove(); }
    if (!ui.overlay) { return; }
    var wrap = el("div", "overlay");
    wrap.id = "overlay";
    var sheet = el("div", "sheet");
    var kind = ui.overlay.kind;

    function closeRow(extra) {
      var row = el("div", "sheet-actions");
      if (extra) { row.appendChild(extra); }
      var b = el("button", "btn", "合上");
      b.addEventListener("click", function () { ui.overlay = null; renderOverlay(); });
      row.appendChild(b);
      return row;
    }

    if (kind === "help") {
      sheet.appendChild(el("h3", null, "怎么玩"));
      sheet.appendChild(el("p", null, "这是一桩宫里的案子。你是仵作沈墨白。" +
        "查案靠两件事：在现场与侧殿里做事（点下面的动作列表，或敲它的字），" +
        "以及调阅档案（在 › 后面敲档号，如 01-FY-XFE）。"));
      sheet.appendChild(el("p", null, "档号的样子是「幕码-地点码-在场人」，" +
        "例如 01-FY-XFE 就是第一幕、凤仪殿、贤妃的尸格。" +
        "手上有的档在「档目」里，读完一份，它牵着的下一份会自动进档目——" +
        "但有几份没写在前面的档里，要你自己把号子拼出来。"));
      sheet.appendChild(el("div", "rule"));
      sheet.appendChild(el("h4", null, "网页版可以敲的"));
      var table = el("table");
      [["01-FY-XFE", "敲档号阅档（也可以敲 读 01-FY-XFE）"],
       ["档目", "列出已收的档案与各自还牵着几份"],
       ["搜 银针", "在已读过的档案里找字"],
       ["记 皇后在说谎", "在记事簿上记一条"],
       ["删 2", "划掉记事簿第 2 条"],
       ["存档 / 读档", "存到本机 / 读回本机（也可搬档）"],
       ["重来 / 离开", "重开一卷 / 回到标题"],
       ["直接敲选项上的字", "与点它一样；敲「移步」就能迈步"],
       ["数字 1-9", "选第 N 项动作"]].forEach(function (pair) {
        var tr = el("tr");
        tr.appendChild(el("td", "k", pair[0]));
        tr.appendChild(el("td", null, pair[1]));
        table.appendChild(tr);
      });
      sheet.appendChild(table);
      sheet.appendChild(el("div", "rule"));
      sheet.appendChild(el("h4", null, "终端版还多这些敲法"));
      (PACK.help_sections || []).forEach(function (sec) {
        sheet.appendChild(el("h4", null, "【" + sec.title + "】"));
        var t = el("table");
        (sec.rows || []).forEach(function (row) {
          var tr = el("tr");
          tr.appendChild(el("td", "k", row[0]));
          tr.appendChild(el("td", null, row[1]));
          t.appendChild(tr);
        });
        sheet.appendChild(t);
      });
      sheet.appendChild(closeRow());
    } else if (kind === "about") {
      sheet.appendChild(el("h3", null, "关于本作"));
      sheet.appendChild(el("p", null, PACK.title + " · " + PACK.subtitle));
      sheet.appendChild(el("p", null, "一桩密室毒杀，牵出十二年前的旧案；三案十一幕，" +
        "卷宗靠你自己一份份调出来。"));
      var stat = el("table");
      [["档案", Object.keys(PACK.dossiers).length + " 份"],
       ["场景", Object.keys(PACK.scenes).length + " 个"],
       ["线索/物证", Object.keys(PACK.items).length + " 条（核心 " + PACK.core_total + "）"],
       ["结局", PACK.endings.length + " 种"],
       ["幕", PACK.act_numbers.length + " 幕"]].forEach(function (pair) {
        var tr = el("tr");
        tr.appendChild(el("td", "k", pair[0]));
        tr.appendChild(el("td", null, pair[1]));
        tableRow(stat, pair[0], pair[1]);
      });
      sheet.appendChild(stat);
      sheet.appendChild(el("p", "empty", "终端与网页共用同一套剧本、同一份存档形状；" +
        "两端行为由 tools/audit_web.py 逐步比对把关。"));
      sheet.appendChild(closeRow());
    } else if (kind === "restart") {
      sheet.appendChild(el("h3", null, "重开这一卷？"));
      sheet.appendChild(el("p", null, "手上的卷宗、记事簿与进度都会重来。想留着就先「存档」。"));
      var redo = el("button", "btn", "重来");
      redo.addEventListener("click", function () {
        game.newGame();
        ui.overlay = null;
        ui.read = "log";
        ui.dossier = "";
        ui.cursor = 0;
        ui.tab = "log";
        toast("//新案开卷//", "dossier");
        render();
      });
      sheet.appendChild(closeRow(redo));
    } else if (kind === "save") {
      sheet.appendChild(el("h3", null, "存档 · 搬档"));
      sheet.appendChild(el("p", null, "「存档」写在本机浏览器里；下面的 JSON 可以直接抄走，" +
        "贴到手机、平板或终端版（终端用 " + "%USERPROFILE%\\.gongwei\\save.json" + "）。"));
      var area = el("textarea");
      area.spellcheck = false;
      var current = readSave();
      area.value = current ? JSON.stringify(current) : "";
      area.placeholder = "把存档 JSON 贴到这里，再点「导入」";
      sheet.appendChild(area);
      var actions = el("div", "sheet-actions");
      var doExport = el("button", "btn small", "导出本机存档");
      doExport.addEventListener("click", function () {
        var payload = game.save();
        payload.stamp = nowStamp();
        area.value = JSON.stringify(payload);
        toast("已抄到上面的框里。");
      });
      var doImport = el("button", "btn small", "导入");
      doImport.addEventListener("click", function () {
        var text = area.value.trim();
        if (!text) { toast("框里还没有东西。", "error"); return; }
        var data;
        try { data = JSON.parse(text); }
        catch (e) { toast("这段不是合法存档：" + e.message, "error"); return; }
        try { game.fromSave(data); }
        catch (e2) { toast("这份存档读不了：" + e2.message, "error"); return; }
        if (game.atVerdict() && !game.state.ending) { game.finalize(); }
        ui.screen = "game";
        ui.overlay = null;
        ui.read = "log";
        ui.dossier = "";
        toast("导入完成。");
        render();
      });
      var doStore = el("button", "btn small", "存入本机");
      doStore.addEventListener("click", function () { doSave(); });
      var doLoadLocal = el("button", "btn small", "读本机存档");
      doLoadLocal.addEventListener("click", function () { ui.overlay = null; doLoad(); });
      actions.appendChild(doExport);
      actions.appendChild(doStore);
      actions.appendChild(doLoadLocal);
      actions.appendChild(doImport);
      var close = el("button", "btn", "合上");
      close.addEventListener("click", function () { ui.overlay = null; renderOverlay(); });
      actions.appendChild(close);
      sheet.appendChild(actions);
    }
    wrap.appendChild(sheet);
    wrap.addEventListener("click", function (ev) {
      if (ev.target === wrap) { ui.overlay = null; renderOverlay(); }
    });
    document.body.appendChild(wrap);
  }

  function tableRow(table, key, value) {
    var tr = el("tr");
    tr.appendChild(el("td", "k", key));
    tr.appendChild(el("td", null, value));
    table.appendChild(tr);
  }

  function renderToasts() {
    var box = document.getElementById("toasts");
    if (!box) {
      box = el("div", "toasts");
      box.id = "toasts";
      document.body.appendChild(box);
    }
    clear(box);
    ui.toasts.forEach(function (t) {
      box.appendChild(el("div", "toast " + t.kind, t.text));
    });
  }

  // ------------------------------------------------------------------
  // 键盘（不在输入框里时）
  // ------------------------------------------------------------------

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && ui.overlay) {
      ui.overlay = null;
      renderOverlay();
      return;
    }
    var target = ev.target;
    if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA")) { return; }
    if (ui.overlay) { return; }
    if (ui.screen === "title") {
      if (/^[1-9]$/.test(ev.key)) {
        var btns = root.querySelectorAll(".menu .opt");
        var idx = parseInt(ev.key, 10) - 1;
        if (btns[idx]) { btns[idx].click(); }
      }
      return;
    }
    if (ev.key === "ArrowUp") { ev.preventDefault(); moveCursor(-1); return; }
    if (ev.key === "ArrowDown") { ev.preventDefault(); moveCursor(1); return; }
    if (/^[1-9]$/.test(ev.key)) {
      var opts = game.options();
      var n = parseInt(ev.key, 10);
      if (opts[n - 1]) { runOption(opts[n - 1]); }
      return;
    }
    if (ev.key === "Enter") {
      var list = game.options();
      if (list[ui.cursor]) { runOption(list[ui.cursor]); }
      return;
    }
    if (ev.key.length === 1 && ev.key >= " ") {
      var input = document.getElementById("cmd");
      if (input) { input.focus(); }
    }
  });

  // 起手：先看标题屏
  render();
})();

</script>
</body>
</html>
