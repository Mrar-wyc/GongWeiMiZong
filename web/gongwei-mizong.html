居","trust":45},"XF":{"case":[1],"confide_at":999,"desc":"死者在凤仪殿榻上，嘴角黑色血迹。","name":"贤妃苏氏","role":"已故 · 六妃之一","trust":0},"XFE":{"case":[1],"confide_at":999,"desc":"死者在凤仪殿榻上，嘴角黑色血迹。","name":"贤妃苏氏","role":"已故 · 六妃之一","trust":0},"XSE":{"case":[1],"confide_at":50,"desc":"瘦小、机灵、怕事。袖口总是沾着炭灰。","name":"小顺子","role":"御膳房小监 · 十五岁","trust":35},"XYP":{"case":[3],"confide_at":999,"desc":"在阁二十九年，认得出先帝的墨、今上的朱。死在丙字库里，门是从外封的。","name":"谢云屏","role":"经卷阁掌籍女史 · 已故","trust":0},"ZZZ":{"case":[2],"confide_at":55,"desc":"谨慎到近乎迟钝。他从不自己写账，也从不自己开锁。","name":"郑守拙","role":"尚药局掌局太监","trust":35}},"core_total":65,"dossiers":{"01-DL-GJ":{"act":1,"body":"景和五年，宫人采薇以「窃内库珠玉」论罪，杖毙于掖庭。\n      卷内三物：一为赃物清单，二为同案宫人供词，三为验伤单。\n      供词三份，笔迹相同；验伤单一份，笔迹与供词同出一手。\n      杖毙之人，本该有仵作当场验伤画押。此卷无押。\n      摘要末尾一行小字，是掌卷书吏添的：「此卷不合式，姑存。」\n\n      //十二年前死了一个宫人。十二年后贤妃在查这件事。\n      中间隔着的，是一个至今还在宫里走动的人。\n      //份档号：04-YC-CW、01-DL-NJ","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"01-DL-GJ","links":["04-YC-CW","01-DL-NJ"],"people":["XFE"],"place_code":"DL","requires":null,"time_code":"01","title":"旧案摘要 · 景和五年采薇"},"01-DL-NJ":{"act":1,"body":"本寺年记：景和五年至十七年，宫中命案画押仵作共四人。\n      景和五年采薇案——画押处空白。\n      景和九年、十一年、十四年各一案，三人画押，皆已病故或告老。\n      十七年，贤妃案，画押处写着你的名字：沈墨白。\n\n      //十二年里验过宫里尸首的人，一个接一个不在了。\n      轮到你了。你把这一页抄进记事簿的时候，手是稳的。\n      //份档号：01-DL-GJ、04-DL-SMB","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"01-DL-NJ","links":["01-DL-GJ","04-DL-SMB"],"people":["SMB"],"place_code":"DL","requires":null,"time_code":"01","title":"仵作年记 · 十二年里谁验过宫里的尸首"},"01-DL-SMB":{"act":1,"body":"大理寺问案，先立格目。格目不全，供词不录。\n      一曰尸格：验其色、其息、其伤、其毒。\n      二曰地格：验其门户、其锁钥、其足迹、其弃物。\n      三曰人格：验其起居、其饮食、其往来、其怨仇。\n      格目之外，另有一条不成文的规矩：仵作的嘴，只在堂上说。\n\n      //本格目为问案底册，随案附卷，不必另调。","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":1,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//调取问案底册——收录至档目//","id":"01-DL-SMB","links":["01-FY-XFE","01-FY-WDH"],"people":["SMB"],"place_code":"DL","requires":null,"time_code":"00","title":"勘验程式 · 大理寺仵作格目"},"01-FY-CEN":{"act":1,"body":"案上宣德炉一具，龙涎香灰尚温，指捻发涩。\n      灰中混细末，色微红，捻之如砂，不与香灰相融。\n      以银针挑出少许置烛上——不燃，不化，微有腥气。\n      朱砂入炉，只令人昏沉目眩、口干舌燥，不至死，亦不为银针所验。\n      这一味是摆给人看的：让人先疑到「宫中秘药」，再疑到用药的人。\n\n      //布障眼法的人，心里有数：他知道会有人来验，\n      所以他要的不是毒死，是让你验错。\n      //份档号：01-FY-LET、02-SY-BOOK","effect":{"add_clues":["censer_red"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"01-FY-CEN","links":["01-FY-LET","02-SY-BOOK"],"people":["SMB"],"place_code":"FY","requires":null,"time_code":"01","title":"炉格 · 香灰里的红末"},"01-FY-DOR":{"act":1,"body":"正殿门：双扇内开，栓槽在里侧，铁栓横死其中，栓头落槽极紧。\n      细看栓下木面——有一道新鲜摩擦印，自外向内，木屑外翻。\n      若是屋内人自己落的栓，木屑该在槽内。这道印是外头用薄刃拨进去的。\n      左窗：插销完好，未能由外开启；窗棂内侧有一道刮痕，自外而内，刃口极薄。\n      窗下青砖：半只湿脚印，脚尖朝外——那人不是进来的，是退出去的。\n      殿后雪泥里另有一双小些的草鞋印，绕向廊下。\n\n      //密室是假的。门是被人从外头拨上的，人退出去以后，\n      这间殿才「锁」了起来。\n      //份档号：01-FY-CEN、01-YC-XSE","effect":{"add_clues":["doors_bolted","window_scratch","ground_print"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"01-FY-DOR","links":["01-FY-CEN","01-YC-XSE"],"people":["SMB"],"place_code":"FY","requires":null,"time_code":"01","title":"门户格 · 铁栓与窗棂"},"01-FY-END":{"act":1,"body":"你把第一幕验到的东西在案上排开：一根黑了的银针，一线干血，\n      半盏有苦杏仁味的冷茶，一炉掺了朱砂的香灰，一道自外向内拨栓的木痕，\n      半只朝外的湿脚印，一双小两寸的草鞋印，一张没写完的笺纸，\n      还有一份只有一个人签押的值夜单。\n\n      格目已齐。从这一刻起，每个走进侧殿的人，\n      都要在你已经知道的事情面前说话。\n\n      //份档号：02-SY-BOOK、02-YC-JC、03-CE-WDH","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//勘验格目齐全——收录至档目//","id":"01-FY-END","links":["02-SY-BOOK","02-YC-JC","03-CE-WDH"],"people":["SMB"],"place_code":"FY","requires":["all",[["dossier","01-FY-XFE"],["dossier","01-FY-XFE-2"],["dossier","01-FY-DOR"],["dossier","01-FY-CEN"],["dossier","01-FY-LET"],["dossier","01-FY-WDH"],["dossier","01-YC-XSE"]]],"time_code":"01","title":"勘验总录 · 第一幕结"},"01-FY-LET":{"act":1,"body":"枕下压笺纸一张。笔迹与尸格所记的握笔茧相符，是贤妃亲笔。\n      墨迹收尾处顿了一下，纸上留了一点墨团——写到那里，有人进来了。\n      字只有一行半：\n\n          采薇之死，疑非杖毙。王德海经手，账目有亏。\n\n      采薇。这个名字不在本朝的宫人名册上，也不在近三年任何一卷里。\n      「账目有亏」四字写得比别的重，笔锋压破了纸。\n\n      //贤妃查的不是自己的病。她在查一笔十二年前的旧账，\n      查到今夜，被人截住了。\n      //份档号：02-YC-JC、01-FY-WDH","effect":{"add_clues":["pillow_letter"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//拾得枕下笺纸——收录至档目//","id":"01-FY-LET","links":["02-YC-JC","01-FY-WDH"],"people":["XFE","WDH"],"place_code":"FY","requires":null,"time_code":"01","title":"枕下笺纸 · 未写完的一行"},"01-FY-SY":{"act":1,"body":"尚药局《药性册》：苦杏仁油，出北地山杏，味苦，入肺、入大肠。\n      用之法：凡安神定喘之剂，滴一二滴于丸散，取其降气。\n      用之人：须本局掌籍记名，逐次签押，退瓶验封。\n      用之后果：一二滴安神。半盏之量，能令人三日不醒。\n      日日饮之，则两三月间，其人日渐倦怠、形销骨立，终以「久病」殁。\n      宫中死人，最不缺的就是「久病」二字。\n\n      //这一味药杀人，杀得极慢，慢到可以在名册上写「病殁」。\n      它的名字会出现在领用簿上，而领用簿，是要签押的。\n      //份档号：02-SY-BOOK、02-SY-TYS","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"01-FY-SY","links":["02-SY-BOOK","02-SY-TYS"],"people":["TYS"],"place_code":"SY","requires":null,"time_code":"01","title":"药引 · 苦杏仁油入药之例"},"01-FY-WDH":{"act":1,"body":"凤仪殿值夜单，掌殿起居王德海手书。\n      戌时初：遣退宫人九名，各有签押，笔迹不一，皆在。\n      戌时以后：外殿值夜一人——王德海。\n      亥时初：御膳房小顺子送茶入殿，签「入，即出」。\n      亥时末：王德海报「敲门不应」，破门。\n      单上「亥时末」三字描过一次，墨色比别处新。\n\n      //九个人都有签押。唯独值夜这一栏，只有一个人的名字。\n      而这个名字，描过。\n      //份档号：01-YC-XSE、01-FY-LET、01-FY-DOR、01-FY-END","effect":{"add_clues":["dismissal_roll","timeline_testimony"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"01-FY-WDH","links":["01-YC-XSE","01-FY-LET","01-FY-DOR","01-FY-END"],"people":["WDH"],"place_code":"FY","requires":null,"time_code":"01","title":"值夜单 · 戌时以后谁在外殿"},"01-FY-XFE":{"act":1,"body":"苏氏，年二十有七，六妃之一，居凤仪殿。\n      仰卧榻上，衣饰齐整，无挣扎痕。口角黑血一线，沿下颌至耳下，已干。\n      颈无勒痕，胸无外伤，十指甲缝内无皮屑、无丝缕。\n      银针刺指尖，针色转黑；血色不凝，口鼻无沫，指甲未青。\n      ——这不是鸩酒那类当场夺命的东西。鸩酒入口即喉肿气闭，人会抓喉、\n      会翻覆，榻上该是乱的。她的榻太齐整了，齐整得像睡着。\n      毒是在两三个时辰里慢慢耗进去的。\n\n      //另有一事记在尸格末尾：她右手食、中二指内侧有薄茧，\n      是常年握笔磨出来的。贤妃在写字。写什么，榻上没找见。\n      //份档号：01-FY-XFE-2、01-FY-WDH","effect":{"add_clues":["si_needle","black_blood"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"01-FY-XFE","links":["01-FY-XFE-2","01-FY-WDH"],"people":["XFE"],"place_code":"FY","requires":null,"time_code":"01","title":"尸格 · 贤妃苏氏"},"01-FY-XFE-2":{"act":1,"body":"榻边案上残茶半盏。茶色褐，已冷，盏底沉一层薄白粉末，已干成壳。\n      凑近有苦杏仁味，被武夷茶的厚重压着——寻常人闻不出来。\n      银针探入茶汤，须浸七日才转黑；一次两次，针不变色。\n      要紧的是这一条：苦杏仁油味冲，一滴落进清水里都藏不住。\n      能把味道压下去的，只有一样东西——惯饮的、味厚的茶。\n\n      //她这半盏茶能入口而不知，是因为她一直在喝这一路。\n      喝了多久、是谁让她这么喝的——尸格答不出来。这一条要你自己想。\n      //份档号：01-FY-SY、02-SY-TYS","effect":{"add_clues":["tea_almond"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"01-FY-XFE-2","links":["01-FY-SY","02-SY-TYS"],"people":["XFE","SMB"],"place_code":"FY","requires":null,"time_code":"01","title":"尸格补遗 · 那半盏茶"},"01-YC-ML":{"act":1,"body":"掖庭掌籍册，按年号捆。景和十一年至十七年，共七卷，卷卷齐全。\n      逐名对照尸格、值夜单、遣退名录，皆能对上。\n      唯独少一个人：采薇。\n      名册上景和五年有一处挖补痕，纸背透光可见原字被刮去，\n      补写的名字是「苏采薇」——那是后来入宫的贤妃的本名。\n      一个宫人的名字被刮掉，一个妃子的名字被补上，在同一个位置。\n\n      //不是两个人的名字写错了。是有人把一个人的去处，\n      改成了另一个人的来路。\n      //份档号：02-YC-JC、04-YC-CW","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"01-YC-ML","links":["02-YC-JC","04-YC-CW"],"people":["XFE"],"place_code":"YC","requires":null,"time_code":"01","title":"宫人名册 · 景和十一年至十七年"},"01-YC-XSE":{"act":1,"body":"小顺子，年十五，御膳房小监，袖口终年沾炭灰。\n      问：今夜可曾入凤仪殿。\n      答：亥时初送茶。门未上栓，是推开的。进屋听见娘娘在里间问了一句\n      「你来做什么」。小的把茶放下就退出来了，没敢往里看。\n      问：你可曾绕到殿后。\n      答（低头，很久）：……小的去看了看后窗。前几日后窗响过，小的怕有贼。\n      雪泥里那半只草鞋印，比窗下那道湿印小两寸。是他的。\n\n      //他说「门未上栓」时没有犹豫。一个怕事的孩子，\n      慌起来会连着撒三个谎，却记不住该在哪里犹豫。这一句像是真的。\n      小顺子还有一样东西没说出来。他的手指一直在抠袖口的炭灰。\n      //份档号：01-YS-XSE、02-YC-XSE","effect":{"add_clues":["xse_testimony","xse_footprint"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[["XSE",5]],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"01-YC-XSE","links":["01-YS-XSE","02-YC-XSE"],"people":["XSE"],"place_code":"YC","requires":null,"time_code":"01","title":"问供 · 御膳房小监小顺子"},"01-YS-XSE":{"act":1,"body":"御膳房茶档：妃位以上，茶由本房专送，一炉一壶，签出入。\n      查近一月送凤仪殿的记录：共二十九次，二十一次由小顺子送。\n      茶品一律武夷正岩，无一例外——这是贤妃自己定的份例，\n      她只饮这一味，说是「味厚，喝了像有人陪着」。\n      苦杏仁油味极冲，任谁偷加一滴，进嘴就该察觉。\n      除非加的人知道她喝什么，也知道她喝不出来。\n\n      //下毒的人不必进殿。他只要知道她喝哪一炉茶，\n      再让那个送茶的孩子，把茶送进去。\n      //份档号：01-YC-XSE、02-SY-TYS","effect":{"add_clues":["almond_habit"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"01-YS-XSE","links":["01-YC-XSE","02-SY-TYS"],"people":["XSE"],"place_code":"YS","requires":null,"time_code":"01","title":"茶档 · 御膳房的送茶规矩"},"02-DL-END":{"act":2,"body":"第二幕的账，你算清了：\n      苦杏仁油七次支取，一名七手；批条上那枚私印；\n      尚药局掌籍四十年里唯一一次「说了没用」；\n      出了宫、没到家的书吏「周德」；\n      贤妃茶里掺了很久、掺得很少的油；\n      换炉那日她自己缓了一缓，然后照旧喝尽；\n      还有那把不登记的便钥——它让「密室」这件事从一开始就不成立。\n\n      从现在起，你手上有的不是怀疑，是七笔签押、一枚印、\n      一张缺掉的行刑单，和一个不肯回话的孩子。\n      侧殿里那些人开口之前，得先看见这些纸。\n\n      //份档号：03-CE-WDH、03-CE-HHX、04-YC-CW","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//账目核毕——收录至档目//","id":"02-DL-END","links":["03-CE-WDH","03-CE-HHX","04-YC-CW"],"people":["SMB"],"place_code":"DL","requires":null,"time_code":"02","title":"账目总录 · 第二幕结"},"02-NW-KEY":{"act":2,"body":"内务府钥匙房簿，凤仪殿正门钥匙一把，掌殿起居保管。\n      每夜落锁、每晨启锁，皆登记。\n      十七年十月二十四日（贤妃薨夜）：「亥时末，王德海启锁。」\n      其上一条是：「戌时初，王德海落锁。」\n      戌时落锁，亥时末启锁。中间这两个时辰，那把钥匙在他身上。\n      另：钥匙房备有「便钥」一副，专供总管夜巡，不登记。\n\n      //便钥不登记，是最要紧的一条。\n      门是从里面拨上栓的——除非有人根本不必进门。\n      //份档号：01-FY-DOR、03-CE-WDH","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"02-NW-KEY","links":["01-FY-DOR","03-CE-WDH"],"people":["WDH"],"place_code":"NW","requires":null,"time_code":"02","title":"钥匙房簿 · 凤仪殿那一把"},"02-NW-TEA":{"act":2,"body":"御膳房轮值簿，十月二十四日：值夜二人，一为看炉老太监，\n      一为小监小顺子。\n      查炉口出入：亥时初，出茶一壶，签「凤仪殿」。押签者：王德海。\n      押签不是本房的规矩——茶出房由本房掌签，总管只须验。\n      那一夜他亲自押了这一签。\n      另记：同日戌时，凤仪殿曾送出一只汤碗，碗已洗净，账上记「损」。\n\n      //「损」是洗掉了。\n      一个把汤送出去的人，和一个把碗洗掉的人，是两拨人。\n      //份档号：03-CE-GFL、01-YS-XSE","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"02-NW-TEA","links":["03-CE-GFL","01-YS-XSE"],"people":["WDH","XSE"],"place_code":"NW","requires":null,"time_code":"02","title":"御膳房轮值 · 送茶那一路"},"02-SY-BOOK":{"act":2,"body":"尚药局《油药领用簿》，景和十四年至十七年，苦杏仁油项下共七笔：\n      十四年三月，支二两，签「王德海」。\n      十四年九月，支一两半，签「王德海」。\n      十五年二月，支二两，签「王德海」。\n      十五年冬，支三两，签「王德海」。\n      十六年四月，支二两，签「王德海」。\n      十六年冬，支二两，签「王德海」。\n      十七年十月，支三两，签「王德海」。\n      七笔的字迹，没有两笔是同一个人写的。\n      其中十六年冬那一笔，笔锋起收与《采薇案》卷内三份供词完全一致。\n\n      //七笔药，一个名字，七只手。有一个人替别人签了很多年的名，\n      而那个人写字的样子，被十二年前的卷宗留了下来。\n      //份档号：02-SY-TYS、04-YC-CW","effect":{"add_clues":["almond_oil","ledger_gap"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"02-SY-BOOK","links":["02-SY-TYS","04-YC-CW"],"people":["WDH","TYS"],"place_code":"SY","requires":null,"time_code":"02","title":"领用簿 · 苦杏仁油七次支取"},"02-SY-CE":{"act":2,"body":"凤仪殿药囊一具，内有：人参养荣丸二、朱砂丸一、安神散一包。\n      安神散包纸为尚药局制式，纸角有本局朱记，真。\n      以银针探散：针不变色。\n      以水化之，味苦，无杏仁气。\n      倾于纸上看沉淀：细末分两层，上层轻白（茯神、远志），\n      下层微黄结块——结块处尝之，苦杏仁味极淡，但不是没有。\n\n      //散里掺过东西，掺得不多。\n      一包安神散里的量不够杀人；药囊是每旬换的，换了几旬，账上会有。\n      //份档号：02-SY-BOOK、01-FY-XFE-2","effect":{"add_clues":["tea_almond"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"02-SY-CE","links":["02-SY-BOOK","01-FY-XFE-2"],"people":["XFE"],"place_code":"SY","requires":null,"time_code":"02","title":"药囊检验 · 凤仪殿药囊"},"02-SY-HAB":{"act":2,"body":"凤仪殿起居注，景和十七年十月下旬，逐日一条。\n      十七日：晨起，茶一盏，尽。午后称倦。亥初歇。\n      十八日：晨起，茶一盏，尽。午后称倦。口苦。亥初歇。\n      十九日：晨起，茶一盏，余半。午后称倦。目眩。亥初二刻歇。\n      二十日：晨起，茶一盏，余半。倦甚，未进午膳。\n      二十一日：晨起，茶一盏，余大半。称苦，换了茶炉。\n      二十二日：「换了茶炉」四字后，茶又尽。\n      二十三日：茶一盏，尽。午后不称倦。\n      二十四日：茶一盏，尽。脉迟。\n\n      //换炉那天她缓了一日，然后照旧喝尽。\n      换炉是她自己的主意——她比谁都早知道茶里有东西。\n      //份档号：01-YS-XSE、02-SY-BOOK","effect":{"add_clues":["almond_habit","contradiction"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"02-SY-HAB","links":["01-YS-XSE","02-SY-BOOK"],"people":["XFE","XSE"],"place_code":"SY","requires":null,"time_code":"02","title":"饮茶起居注 · 凤仪殿一旬之茶"},"02-SY-PILL":{"act":2,"body":"尚药局丸散簿：朱砂丸，镇惊安神，妃位以上可请。\n      景和十七年八月起，凤仪殿请朱砂丸共五次，签「贤妃苏氏自服」。\n      但取丸的签押是小顺子的名字——一个不认字的小监，\n      签押处的「顺」字写得极流利。\n      朱砂丸每次一丸，丸重二分，五次共一钱。\n      药性所载：此量令人目眩口干，不至死。\n\n      //五丸朱砂，是给外人看的剂量。\n      真正要紧的是那三笔苦杏仁油——它不在丸里，在茶里。\n      //份档号：02-SY-BOOK、01-FY-CEN","effect":{"add_clues":["cinnabar_note"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"02-SY-PILL","links":["02-SY-BOOK","01-FY-CEN"],"people":["XSE","XFE"],"place_code":"SY","requires":null,"time_code":"02","title":"丸散簿 · 朱砂丸的去向"},"02-SY-PT":{"act":2,"body":"景和十四年，尚药局呈《请严油药验封疏》，掌籍太监具名。\n      疏上批语一行，字迹端整：「旧例可行，无须更张。」\n      落款处没有官衔，只有一方小印，印文「德海」。\n      内务府的规矩：书吏不得用私印批文。这一枚印，后来刻成了总管的印样。\n      疏纸右下角有折痕，被人反复折起又展开过——掌籍说不是他折的。\n\n      //十二年前他替人写供词，十二年后他替人批公文。\n      这支笔一直没换手。\n      //份档号：04-YC-CW、04-DL-SMB","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"02-SY-PT","links":["04-YC-CW","04-DL-SMB"],"people":["WDH"],"place_code":"SY","requires":null,"time_code":"02","title":"批条 · 驳回验封的那一行字"},"02-SY-TYS":{"act":2,"body":"掌籍太监，年六十一，本局四十年，眼已花。\n      问：苦杏仁油支取，可否代签。\n      答：签押是为追责，代签便无责可追。老奴说过一回，被驳了。\n      回话的人当时是内务府的书吏，如今是太监总管。\n      问：油出局时，可验瓶封。\n      答：验。退瓶时若封口湿、或油面低过记号，本局要报。\n      近三年，七次支取，七次都不曾退瓶——报的无一回，老奴也就没再报。\n\n      //「说了没用」四个字，比「同谋」更常见，也更难定罪。\n      但掌籍手里还有一样东西：当年驳回他那一句的批条。\n      //份档号：02-SY-PT、02-SY-BOOK","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"02-SY-TYS","links":["02-SY-PT","02-SY-BOOK"],"people":["TYS","WDH"],"place_code":"SY","requires":null,"time_code":"02","title":"尚药局掌籍问供 · 退瓶验封的规矩"},"02-YC-DL":{"act":2,"body":"掖庭月册，景和十七年十月：掖庭旧档库书吏一人告病出宫。\n      姓名栏写着「周德」，原籍潞州。\n      查景和五年至十七年名册，无此人——他是十二年里唯一一个\n      不在旧册、却在月册上有名字的宫人。\n      出宫之日签押人：太监总管王德海。\n      出宫的赏银数目被涂改过一次，看不出原数。\n\n      //一个不存在的人，在一个晚上出宫了。\n      带走的是一封信，还是那张缺掉的行刑单？\n      //份档号：02-YC-JC、02-YC-LU","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"02-YC-DL","links":["02-YC-JC","02-YC-LU"],"people":["WDH"],"place_code":"YC","requires":null,"time_code":"02","title":"出宫名录 · 景和十七年十月"},"02-YC-JC":{"act":2,"body":"掖庭旧档库，景和五年一卷，捆绳封泥已被拆过——泥上是指痕，不是刀痕。\n      卷内清单：赃物清单一件、同案宫人供词三件、验伤单一件、杖毙行刑单一件。\n      卷内实存：赃物清单一件、同案宫人供词三件、验伤单一件。\n      杖毙行刑单不在卷内。\n      行刑单本该有行刑人签押、监刑人签押、仵作画押三栏。\n      缺了它，这一卷就永远证明不了「谁看着人死的」。\n\n      //有人拆过封泥，取走了一张纸。\n      取走的那张纸上，写着三个人的名字。\n      //份档号：04-YC-CW、01-DL-GJ","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"02-YC-JC","links":["04-YC-CW","01-DL-GJ"],"people":["XFE"],"place_code":"YC","requires":null,"time_code":"02","title":"旧档索引 · 景和五年卷宗清单"},"02-YC-LU":{"act":2,"body":"潞州府回文（以大理寺关文调取，九日到）：\n      州境无「周德」其人。景和十七年十月，亦无人自京回籍。\n      唯景和五年冬，有客死旅舍者一人，无名，行囊中有一枚宫中木腰牌，\n      牌上刻字被磨去，只余「掖」字半边。\n      尸身由旅舍主人草葬于城外乱岗，无碑。\n      回文末附一句：「本州无从核其官身，谨据实回报。」\n\n      //他没能到家。\n      有人比他的脚程快，也有人比那封信更早到。\n      //份档号：04-YC-CW、04-DL-SMB","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"02-YC-LU","links":["04-YC-CW","04-DL-SMB"],"people":["XSE"],"place_code":"YC","requires":null,"time_code":"02","title":"潞州回文 · 周德其人"},"02-YC-XSE":{"act":2,"body":"小顺子第二次进来时，跪得比上次远了一点。\n      问：贤妃娘娘平日待你如何。\n      答：娘娘赏过小的两次饽饽。小的头一回吃那么细的面。\n      问：她近日可曾叫你送过别的东西。\n      答（摇头，又停住）：……娘娘叫小的送过一封信。送给掖庭库的一个老书吏。\n      问：信里写什么。\n      答：小的不认字。娘娘说「送出去就别回头看」。\n      那封信送出三日之内，老书吏告病出宫，回了原籍。\n\n      //贤妃不是一个人查。\n      她也怕。她怕的时候，第一反应是把东西送出去，而不是交给宫里任何人。\n      //份档号：02-YC-JC、04-YC-CW","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[["XSE",5]],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"02-YC-XSE","links":["02-YC-JC","04-YC-CW"],"people":["XSE"],"place_code":"YC","requires":null,"time_code":"02","title":"小顺子再问 · 那三日他看见了什么"},"03-CE-END":{"act":3,"body":"三份对质录并排摊开，纸色不一样，墨也不一样。\n      王德海改过三次口，每一次都更往里一步。\n      皇后不问自答，答的是「讨一样东西」。\n      贵妃把手炉托高了半寸——那一寸里全是药渣。\n      小顺子抄过一页纸，然后那页纸不见了。\n\n      你把这些抄进自己的簿子。抄完才发现：\n      今夜每一个开口的人，都在替十二年前那个人说话。\n      而十二年前那件事，也还没有人替死者说过一句话。\n\n      //份档号：04-DL-SMB、05-CE-END","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//对质录齐——收录至档目//","id":"03-CE-END","links":["04-DL-SMB","05-CE-END"],"people":["SMB"],"place_code":"CE","requires":["all",[["dossier","03-CE-WDH"],["dossier","03-CE-HHX"],["dossier","03-CE-GFL"]]],"time_code":"03","title":"对质总录 · 第三幕结"},"03-CE-GFL":{"act":3,"body":"贵妃进来先看案上，后看人。\n      问：娘娘送的那碗汤。\n      　答：她没喝。她要是真敢喝，本宫倒要看她能撑到几时。\n      问：娘娘的手炉，今夜的炭换过么。\n      　答：本宫的炉子，不劳大人过问。\n\n      她把手炉往上托了半寸。就这半寸——\n      炉底的灰里有一层细白的药渣，不是安胎药的颜色。\n      录末：\n      　「妃出，行至阶下，回头看了一眼殿门。」\n\n      //她不怕你问，她怕你不问。\n      //份档号：02-NW-TEA、02-SY-PILL、03-CE-END","effect":{"add_clues":["gf_handstove"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":2,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"03-CE-GFL","links":["02-NW-TEA","02-SY-PILL","03-CE-END"],"people":["GF"],"place_code":"CE","requires":["clue","consort_soup"],"time_code":"03","title":"对质录 · 贵妃柳氏"},"03-CE-HD":{"act":3,"body":"皇帝在廊下站了半个时辰，没有进来。\n      「三日。」他说，「三日之后，无论你查出什么，这件事都要有个名字。」\n      问：陛下想听什么。\n      　答：朕想听真的。\n      问：若是真的不好听。\n      　（他没有答。他看着殿门。）\n      录末：\n      　「上问：她走的时候，可疼。」\n\n      //他要的不是凶手，是一个能写进起居注的句子。\n      //份档号：03-CE-END、05-DL-VERDICT","effect":{"add_clues":["hd_three_days"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":2,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"03-CE-HD","links":["03-CE-END","05-DL-VERDICT"],"people":["HD"],"place_code":"CE","requires":["any",[["clue","emperor_care"],["clue","emperor_scold"]]],"time_code":"03","title":"御前 · 三日之限"},"03-CE-HHX":{"act":3,"body":"皇后不坐。灯影在东，她在西。\n      问：戌时三刻，娘娘为何在凤仪殿。\n      　答：本宫来讨一样东西。\n      问：什么东西。\n      　答：她写给别人看的那张纸。\n\n      她说话时，左手拇指一直在转一枚玉扳指。玉色旧，环口磨得极薄。\n      ——先帝赐物的规制，女子不得佩。\n      录末有一行小字，是笔吏添的：\n      　「后出殿时，雪未落。廊下无脚印。」\n      可她走的是廊下。\n\n      //她不承认来过，也懒得否认。她只是不说那枚扳指为什么在她手上。\n      //份档号：03-CE-END、04-YC-CW、05-CE-END","effect":{"add_clues":["hh_night_visit"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[["HH",2]],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"03-CE-HHX","links":["03-CE-END","04-YC-CW","05-CE-END"],"people":["HH"],"place_code":"CE","requires":["clue","empress_last_word"],"time_code":"03","title":"对质录 · 皇后萧氏"},"03-CE-WDH":{"act":3,"body":"王德海，太监总管，掌凤仪殿起居十二年。\n      第一问：今夜几时入殿。\n      　答：亥时末，敲门七八声不应，唤人撞门。栓自内落。\n      第二问：殿内可曾入过。\n      　答：未曾。只在门外看见娘娘面色如生，还饮着茶。\n      第三问：那盏茶是谁送进去的。\n      　答：老奴。娘娘夜饮安神茶，惯是武夷。\n\n      录到这里，笔停了一下。\n      「面色如生，还饮着茶」——茶盏在门内是碎的，碎在榻边，裂纹朝里。\n      没进过那道门的人，说不出裂纹朝哪一边。\n\n      //三问三答，一答比一答更往里一步。最后一步是他自己迈的。\n      //份档号：03-CE-XSE、03-CE-END、04-YC-CW","effect":{"add_clues":["wdh_slips"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":2,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"03-CE-WDH","links":["03-CE-XSE","03-CE-END","04-YC-CW"],"people":["WDH"],"place_code":"CE","requires":["clue","contradiction"],"time_code":"03","title":"对质录 · 王德海三改其口"},"03-CE-XSE":{"act":3,"body":"小顺子第二次进来的时候，袖子被人扯过一角，线头还翘着。\n      问：你在怕谁。\n      　答（很久）：大人，小的爹娘还在宫外。\n      问：你抄过领用簿上的字，那页纸呢。\n      　答：总管说……说小孩子不要留这种东西。\n\n      他抄过一页。他知道自己抄的是什么，所以更怕。\n      录末你自己添了一句：\n      　「此人可保。保他的法子，是本官先把名字写对。」\n\n      //十五岁的孩子，手上已经有了一个能要命的秘密。\n      //份档号：02-SY-BOOK、02-YC-DL、03-CE-END","effect":{"add_clues":["xse_fear_note"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":2,"text":null,"time":null,"trust":[["XSE",5]],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"03-CE-XSE","links":["02-SY-BOOK","02-YC-DL","03-CE-END"],"people":["XSE"],"place_code":"CE","requires":["flag","xse_told"],"time_code":"03","title":"对质录 · 小顺子（再问）"},"04-DL-SMB":{"act":4,"body":"大理寺仵作年记，沈墨白，自记。\n      第一年：验尸，代笔，习格目。\n      第三年：第一次独自填尸格，手抖，写了两个时辰。\n      第七年：验四十七具。其中九具死于「狱中疾病」，三具死于「杖毙」。\n      （这一页的边角上有折痕，被人反复折过。）\n\n      景和五年冬，掖庭宫人采薇，罪「窃」，杖二十。\n      行刑单的批注栏里，有一行不是行刑人写的字：\n\n          不足以致死，再杖。\n\n      那是仵作验看的常用语。写这一行的笔锋起笔重、收笔轻——\n      和这本年记里每一页的字，一模一样。\n\n      //十二年前你十九岁，第一次替人验伤。\n      //你不知道那一行之后还有几杖。你从来不知道。\n      //份档号：04-YC-CW、05-CE-END","effect":{"add_clues":["coroner_count","smb_hand"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//调取仵作年记——收录至档目//","id":"04-DL-SMB","links":["04-YC-CW","05-CE-END"],"people":["SMB"],"place_code":"DL","requires":["clue","old_record"],"time_code":"04","title":"仵作年记 · 沈墨白自记"},"04-YC-CW":{"act":4,"body":"这一页是行刑单的下半幅。上半幅连同三个签押栏一起被裁掉了。\n      留下的部分只有两行：\n\n          杖二十，讫。\n          尸交掖庭，着人收殓。\n\n      「杖二十」三字旁有一道细批，墨色不同：「不足以致死，再杖。」\n      再杖的数目没有写。写这道批的人，落笔时手腕很稳。\n      纸背透出一个印痕，是私印的一角，只剩两笔——像「德」字的上半。\n\n      //下半幅在案上，上半幅在别人手里。\n      一张纸被裁成两半，就是两个人各自揣着一半的命。\n      //份档号：01-DL-GJ、02-SY-PT、04-DL-SMB","effect":{"add_clues":["old_record","caiwei_death"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//得到新档案——收录至档目//","id":"04-YC-CW","links":["01-DL-GJ","02-SY-PT","04-DL-SMB"],"people":["WDH"],"place_code":"YC","requires":null,"time_code":"04","title":"采薇案 · 行刑单（残）"},"05-CE-END":{"act":5,"body":"大理寺结案，先写底稿，再誊正本。底稿不存档，写完即销。\n      你摊开纸，写下第一行：\n      　「景和十七年冬，凤仪殿贤妃苏氏薨。」\n      第二行就写不下去了。\n\n      这个名字一落纸，就有人要死。区别只在死谁。\n      一个人的死可以在卷宗里写成四种：\n      　邪祟所侵、急症暴卒、自戕、为人所害。\n      而为人所害又可以写成两种：写成凶手，或者写成别人。\n\n      //底稿是给自己看的。写完这一页，就没有回头路了。\n      //份档号：05-DL-VERDICT","effect":{"add_clues":["yamen_draft"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//提笔写底稿——收录至档目//","id":"05-CE-END","links":["05-DL-VERDICT"],"people":["SMB"],"place_code":"CE","requires":["all",[["dossier","03-CE-END"],["dossier","04-DL-SMB"]]],"time_code":"05","title":"结案陈词 · 底稿"},"05-DL-VERDICT":{"act":5,"body":"大理寺的旧卷里翻出一张抄本，纸边有裁过的痕。\n      上面写着同一个案子的八种收尾：\n\n          一、铁证如山。二、尘埃落定。三、玉扳指。四、替罪的人。\n          五、查不出来。六、按下。七、天子无案。八、辞官。\n\n      八种写法都合法，都会被归卷，都会有人签字。\n      抄本的最后一行留空着——抄的人不敢写，或者不愿写。\n\n      //落笔之前看一遍这一页，是提醒，也是警告：\n      //你写的不是案情，是八种活法里谁活下去。","effect":{"add_clues":["eight_verdicts"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":2,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//翻出判决抄本——收录至档目//","id":"05-DL-VERDICT","links":["05-CE-END","01-DL-SMB"],"people":["SMB"],"place_code":"DL","requires":["dossier","05-CE-END"],"time_code":"05","title":"判决录 · 八种写法"},"06-DL-PAIR":{"act":6,"body":"你把两张纸并排摊开。\n\n      左：凤仪殿。慢药入茶，亥时送、亥时末破门；窗棂自内拨合，留刮痕。\n      右：尚药局。生附子入汤，戌时末已无声；门闩自外拉合，留丝线。\n\n      共同点三条：\n      一、药都是慢的——不让人当场死，好留出时间；\n      二、门都是从外面合上的——做出「密室」；\n      三、动手的人不是写字的人。\n\n      第三条是你在这张纸上第一次写下来的。写完之后你盯着它看了很久：\n      当年采薇案的验伤单和供词，也是两个人经手，一个人签名。\n\n      //份档号：06-YK-END","effect":{"add_clues":["two_cases_method"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":6,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//摆出两案对照卷——收录至档目//","id":"06-DL-PAIR","links":["06-YK-END"],"people":["SMB"],"place_code":"DL","requires":["all",[["dossier","06-YK-DOR"],["dossier","06-SY-LEDGER"],["dossier","01-FY-END"]]],"time_code":"06","title":"两案同法 · 对照卷"},"06-DL-SMB":{"act":6,"body":"第二册第一页，你写的是凤仪殿。\n      第二页起，是尚药局。\n\n      你写下三行：\n      　高延年，五十七岁，典药，掌药库钥匙二十三年。\n      　死处：药库第三层柜下。门闩自内栓合，栓槽内有丝线一截。\n      　同夜：书吏蒋九死于值房灯下，死状相同。\n\n      最后一行你留了空——「同状」两个字，你写过四十七次，\n      每一次最后都变成了另一种写法。\n\n      //第二册要写完，得先有第一具尸首的尸格。\n      //份档号：06-YK-GYN","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":0,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//取出仵作年记 · 第二册——收录至档目//","id":"06-DL-SMB","links":["06-YK-GYN"],"people":["SMB"],"place_code":"DL","requires":null,"time_code":"06","title":"仵作年记 · 第二册"},"06-SY-LEDGER":{"act":6,"body":"附子入库：本月十一日，二斤四两，来源「内库拨付」。\n      次日，苦杏仁油第七次支取，取用人署「王德海」。\n\n      你翻出案① 的那一册领用簿抄本，把这七次并排抄在一张纸上：\n      第一次，景和五年，二两；\n      第二次至第六次，景和六年至十二年，每次二两；\n      第七次，本月十二日，二两。\n\n      间隔很有规律——像每年都要用一回。\n      中间隔了十二年。十二年里没有人来查过这本簿子。\n\n      //份档号：06-DL-PAIR、06-YK-END","effect":{"add_clues":["aconite_nature","aconite_intake","ledger_seventh"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//核完领用簿——收录至档目//","id":"06-SY-LEDGER","links":["06-DL-PAIR","06-YK-END"],"people":["ZZZ"],"place_code":"SY","requires":["all",[["dossier","06-YK-KEY"],["dossier","06-SY-SEAL"]]],"time_code":"06","title":"附子入库与领用簿"},"06-SY-SEAL":{"act":6,"body":"药库封条为前一日更换，末尾署名「高延年」。\n      比对笔迹：起笔重、收笔轻，形似而神不似——不是他写的。\n\n      封条换过，签名不是本人——换封条的人有钥匙，也有理由让封条看起来很新。\n      封条上还有半个指印，被纸浆洇开了。指印很浅，像是拿笔的人按的。\n\n      //份档号：06-SY-LEDGER","effect":{"add_clues":["seal_changed"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//比对封条笔迹——收录至档目//","id":"06-SY-SEAL","links":["06-SY-LEDGER"],"people":["ZZZ"],"place_code":"SY","requires":["dossier","06-YK-KEY"],"time_code":"06","title":"药库封条"},"06-SY-ZZZ":{"act":6,"body":"问：今夜高延年几时巡库？\n      答：丑时初。簿子上有他的押，咱家是看簿子才知道的。\n\n      问：您看的是哪一本簿子？\n      答：值夜簿。就压在他案上那一本。\n\n      问：谁开的药库？\n      答：钥匙在他手里。咱家不管钥匙。\n\n      ——他答得太快了。三个问题，答得像是提前背过。\n      而且他知道簿子压在案上：那本簿子，只有进过药库的人才知道在哪。\n\n      //份档号：06-YK-END","effect":{"add_clues":["zzz_pressure"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[["ZZZ",-5]],"unlock":null},"found_msg":"//录下掌局口供——收录至档目//","id":"06-SY-ZZZ","links":["06-YK-END"],"people":["ZZZ"],"place_code":"SY","requires":["dossier","06-YK-GYN"],"time_code":"06","title":"口供 · 掌局郑守拙"},"06-YK-DOR":{"act":6,"body":"单扇木门，门闩自内横栓。栓槽窄，槽底卡着一截青丝线，长约二寸。\n      线头断口呈毛边，是被人从外面拉断的。\n      闩尾有极细的磨痕，方向朝外。\n\n      做法：线从门缝穿入，套住闩尾，人在门外一拉，闩就落了。\n      之后抽线，线断在槽里——这一步，做的人手生。\n      或者：他不在乎被发现。\n\n      凤仪殿的窗棂上有撬痕。这里的门闩上有丝线。\n      同一个人的手法：让屋里看着像没人进过。\n\n      //份档号：06-DL-PAIR","effect":{"add_clues":["bolt_thread"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//验完门闩——收录至档目//","id":"06-YK-DOR","links":["06-DL-PAIR","06-YK-END"],"people":["GYN"],"place_code":"YK","requires":["dossier","06-YK-GYN"],"time_code":"06","title":"药库的门闩"},"06-YK-END":{"act":6,"body":"第六幕收手。你把这一夜在药库查到的东西列成一册：\n\n      　一、尸格：口唇麻色、瞳仁不散，银针不验。（06-YK-GYN）\n      　二、药匙：附子白霜，药柜第三层缺三钱。（06-YK-KEY）\n      　三、门闩：栓槽里的青丝线，门是外头合上的。（06-YK-DOR）\n      　四、时辰：尸僵过肩，值夜簿上的签名是描的。（06-YK-TIME）\n      　五、账簿：附子入库次日，苦杏仁油第七次被取用。（06-SY-LEDGER）\n\n      五条并在一处，只说得出一句话：\n      有人用一味验不出的药，杀了一个掌了二十三年钥匙的人。\n\n      //勘验到这里可以收手了。下一步是问人——问的时候要拿东西去问。\n      //份档号：06-DL-PAIR、07-DL-JJ、07-JG-OLD","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//勘验收手——第六幕总录收录至档目//","id":"06-YK-END","links":["06-DL-PAIR","07-DL-JJ","07-JG-OLD"],"people":["SMB"],"place_code":"YK","requires":["all",[["dossier","06-YK-GYN"],["dossier","06-YK-KEY"],["dossier","06-YK-DOR"],["dossier","06-YK-TIME"],["dossier","06-SY-LEDGER"]]],"time_code":"06","title":"第六幕勘验总录"},"06-YK-GYN":{"act":6,"body":"高延年，五十七岁，尚药局典药。\n      尸倚药柜第三层脚下，右手攥铜药匙，左手五指张开，指节青白。\n      口唇麻色，瞳仁不散，舌根僵直。胸腹无外伤，四肢无挣扎痕。\n      十指指甲内无皮屑，唯右手中指有墨，指腹有纸灰。\n\n      尸僵已过肩，尸温近砖——死在子时之前。\n      按银针试之：针色如常。\n      这不是急症。急症不会把人的嘴染成这个颜色。\n\n      //验不出的毒，不等于没有毒。银针验的是血，验不出心的。\n      //份档号：06-YK-KEY、06-YK-TIME","effect":{"add_clues":["gy_pupils","gy_ink_finger"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//填完典药尸格——收录至档目//","id":"06-YK-GYN","links":["06-YK-KEY","06-YK-TIME","06-YK-END"],"people":["GYN"],"place_code":"YK","requires":null,"time_code":"06","title":"尸格 · 典药高延年"},"06-YK-KEY":{"act":6,"body":"铜药匙，齿端有新磨的痕——被人拿去撬过什么东西。\n      匙面一层薄白霜，以指捻之微辛，以舌试之即麻。\n\n      附子格：账面昨日余量为二两七钱，实测二两四钱。\n      缺三钱。缺口处的粉印是新的，说明取药的人手很稳，取得很少。\n      少到不会有人当天就发现。\n\n      柜签上「附子」两个字，是描的。\n      原本的字在下面，笔画更瘦——那是很多年前写上去的。\n\n      //份档号：06-SY-LEDGER、06-YK-END","effect":{"add_clues":["aconite_smell","aconite_gap","store_key"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//验出匙上白霜——收录至档目//","id":"06-YK-KEY","links":["06-SY-LEDGER","06-YK-END"],"people":["GYN"],"place_code":"YK","requires":["dossier","06-YK-GYN"],"time_code":"06","title":"铜药匙与药柜第三层"},"06-YK-TIME":{"act":6,"body":"尸僵：下颌、颈、肩已僵，过肩未及肘——死在三到四个时辰之前，\n      约当子时之交。尸温与地砖同——药库夜里不生火。\n\n      案上值夜簿，末行为「丑时初，巡库」，署高延年。\n      你对着尸格上的字比对：簿上那一行的起笔、顿笔、收笔，都比他自己的字\n      更像他。像是照着他平时的写法描出来的。\n\n      写下这一行的时候，他已经死了。\n      有人替一具尸首签了押，还签得比本人像。\n\n      //份档号：06-YK-END","effect":{"add_clues":["gy_time","night_roster2"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//推定死亡时辰——收录至档目//","id":"06-YK-TIME","links":["06-YK-END"],"people":["GYN"],"place_code":"YK","requires":["dossier","06-YK-GYN"],"time_code":"06","title":"尸僵与值夜簿"},"06-ZF-HXW":{"act":6,"body":"问：你巡到药库是几时？\n      答：戌时末。门从外面锁着，链子扣着，我试了一下没开。\n\n      问：那时候屋里有动静吗？\n      答：没有。一点声都没有。我以为高典药早睡了。\n\n      问：你第二次开库是什么时候？\n      答：丑时。掌局来叫我，说高典药巡库巡得太久了。\n\n      ——戌时末，链子在门外。那时屋里的人已经不能出声。\n      丑时开门，闩是里栓的——闩落下时他才发现屋里有人。\n\n      //份档号：06-ZF-JJ","effect":{"add_clues":["hxw_patrol"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[["HXW",5]],"unlock":null},"found_msg":"//录下值夜证词——收录至档目//","id":"06-ZF-HXW","links":["06-ZF-JJ","06-YK-END"],"people":["HXW"],"place_code":"ZF","requires":["dossier","06-YK-DOR"],"time_code":"06","title":"证词 · 值夜小监贺小五"},"06-ZF-JJ":{"act":6,"body":"炭盆里翻出的一角纸。半行账：\n      　「第七次取用，附子二两，签——」\n      后面烧掉了。抄的人手很稳，写到名字时断了笔。\n\n      蒋九是药库书吏，抄了半辈子账。他认得出别人的字，比认人还准。\n      他今夜抄的是领用簿第七页——就是你手上这一页。\n\n      他抄这一页，不是为了抄；是为了把某一个名字抄出来给人看。\n\n      //份档号：07-DL-JJ","effect":{"add_clues":["jj_memory"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//收起烧剩的抄本——收录至档目//","id":"06-ZF-JJ","links":["07-DL-JJ"],"people":["JJ"],"place_code":"ZF","requires":["dossier","06-ZF-HXW"],"time_code":"06","title":"证物 · 蒋九的抄本"},"07-DL-END":{"act":7,"body":"第七幕收手。你把问到的供词按人排开：\n\n      　一、蒋九尸格：同一味药，同一盏灯。（07-DL-JJ）\n      　二、柳青的手：四十七两六钱，每日三钱，掌局收走。（07-SY-LQ）\n      　三、掌局私账：药出有主，十二页同样的押。（07-SY-ZZZ2）\n      　四、十二年前的笔：三张纸同一个人的字。（07-DL-HAND）\n      　五、两句供词对不上：郑守拙替人圆了场。（07-DL-TWO）\n\n      五条并在一处，只说得出一句话：\n      这一夜替人写字的那个人，坐在尚药局的前厅里，正在理他的袖子。\n\n      你可以提笔了。也可以回凤仪殿，先把第一案的名字写上。\n\n      //份档号：08-CE-END、08-SY-CONF","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//问询收手——第七幕总录收录至档目//","id":"07-DL-END","links":["08-CE-END","08-SY-CONF"],"people":["SMB"],"place_code":"DL","requires":["all",[["dossier","07-DL-JJ"],["dossier","07-DL-TWO"],["dossier","07-SY-LQ"],["dossier","07-SY-ZZZ2"],["dossier","07-DL-HAND"]]],"time_code":"07","title":"第七幕问询总录"},"07-DL-HAND":{"act":7,"body":"你把三张纸并排。\n      一、十二年前采薇案的口供（04-YC-CW 里那份抄本）；\n      二、本月的领用簿第七页；\n      三、掌局那本私账的四字批注。\n\n      同一个人的字。\n      都不是本人的字——都是照着别人的手描的：王德海的口供像王德海写的，\n      高延年的签押像高延年写的。它们像，是因为有人练过。\n\n      一支笔，替人写了十二年。\n      采薇案里那份「供认不讳」，也是这么写出来的。\n\n      //份档号：07-SY-ZZZ2","effect":{"add_clues":["caiwei_hand"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":6,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//比对出那支笔——收录至档目//","id":"07-DL-HAND","links":["07-SY-ZZZ2","07-DL-END"],"people":["SMB"],"place_code":"DL","requires":["all",[["dossier","07-SY-ZZZ2"],["dossier","06-SY-LEDGER"]]],"time_code":"07","title":"十二年前的那支笔"},"07-DL-JJ":{"act":7,"body":"蒋九，三十一岁，尚药局书吏。\n      死于书吏值房案前，坐姿未倒，左手搭笔架，右手攥纸一角。\n      口唇麻色，瞳仁不散，无外伤。灯芯烧至一指长，灯油尚余三成。\n\n      掌心残纸：被水浸过，只剩半个字——「亻」。\n      案上抄本：领用簿第七页，抄到第七次取用的署名处断笔。\n\n      同一味药。同一种死法。夜里同一盏灯亮着。\n      两次都让屋子里看起来像没进过人。\n\n      //他手心里那半个字，不是名字的一半，是「人」的一半。\n      //份档号：07-DL-PAPER、07-DL-TWO","effect":{"add_clues":["jj_corpse"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//填完书吏尸格——收录至档目//","id":"07-DL-JJ","links":["07-DL-PAPER","07-DL-TWO","07-DL-END"],"people":["JJ"],"place_code":"DL","requires":["dossier","06-ZF-JJ"],"time_code":"07","title":"尸格 · 书吏蒋九"},"07-DL-PAPER":{"act":7,"body":"残纸一角，指肚大小，纸浆粗，是值房里那种糊窗纸。\n      上面半个字：竖、撇——「亻」。此字之上还有一横的下缘，被水浸去。\n\n      值房里写过字的人只有两个：蒋九，和今夜来过的那个人。\n      这张纸不是簿纸，是窗纸——有人用它包过什么，包完了就烧。\n      烧了一半，落在汤盏边上，被汤浸了。\n\n      包过什么？三天之后你才想明白：包的是粉末。\n      附子是白的，包在纸里过廊子，看不见。\n\n      //份档号：08-DL-NAME","effect":{"add_clues":["jj_paper"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//收起灯下残纸——收录至档目//","id":"07-DL-PAPER","links":["08-DL-NAME"],"people":["JJ"],"place_code":"DL","requires":["dossier","07-DL-JJ"],"time_code":"07","title":"灯下的残纸"},"07-DL-TWO":{"act":7,"body":"郑守拙：蒋九整夜都在值房抄账，咱家没见他出去。\n      柳青：戌时前后，蒋九拿着抄本来问我，我说你去问掌局，他就走了。\n      贺小五：戌时末，廊子上两串脚步，一串往药库，一串往值房。\n\n      三句放在一起：\n      蒋九戌时离开值房去找柳青，之后去了药库——而郑守拙说他整夜在值房。\n\n      只有一种可能：郑守拙在替一个不在场的人说话。\n      那个人今夜进过药库，还进过蒋九的值房。\n\n      //份档号：07-DL-END","effect":{"add_clues":["contradiction2"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//记下两句对不上的供词——收录至档目//","id":"07-DL-TWO","links":["07-DL-END"],"people":["SMB"],"place_code":"DL","requires":["all",[["dossier","07-SY-LQ"],["dossier","07-SY-ZZZ2"],["clue","jj_memory"]]],"time_code":"07","title":"两句供词对不上"},"07-JG-OLD":{"act":7,"body":"账房角落堆着成捆旧档，捆绳上压着一枚封泥。\n      泥已干裂，印记却还清楚：一片叶子，叶脉五道——经卷阁的印。\n\n      药库的旧档，盖的是经卷阁的印。\n      药从经卷阁出？经卷阁在皇城西北角，是存先帝经卷与旧账的地方，\n      三十年不点灯。\n\n      解开捆绳，最上面一页的纸色已经转褐。\n      字迹被水浸过一半，只看得出半行：\n      　「景和五年，药出□□阁，三取其二，余一入凤□。」\n\n      //份档号：08-DL-LEAF、08-JG-ROAD","effect":{"add_clues":["jinghe_seal","third_name"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//解开旧档捆绳——收录至档目//","id":"07-JG-OLD","links":["08-DL-LEAF","08-JG-ROAD"],"people":["SMB"],"place_code":"JG","requires":["dossier","06-SY-LEDGER"],"time_code":"07","title":"药库旧档 · 景和五年的封泥"},"07-SY-FB":{"act":7,"body":"问：您是奉谁的旨来的？\n      答：内官监的差事不问旨，问的是——这一夜的账往哪本簿子上记。\n\n      问：哪一本？\n      答：大人写哪一本，咱家就记哪一本。只要那一本看上去是干干净净的。\n\n      ——贺小五听见的那一句，比这份口供早了两个时辰：\n      「今夜的事，写成暴病就是了。」\n\n      他不是来查案的。他是来定案的。\n\n      //份档号：07-DL-END","effect":{"add_clues":["fb_word"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//记下内官监的口风——收录至档目//","id":"07-SY-FB","links":["07-DL-END"],"people":["FB"],"place_code":"SY","requires":["dossier","07-DL-JJ"],"time_code":"07","title":"内官监的口风"},"07-SY-LQ":{"act":7,"body":"她把手摊开：十指指腹淡黄，洗不掉。\n      「附子粉。染上就洗不掉。我这个月称了四十七两六钱。」\n\n      问：谁让你称的？\n      答：每日三钱，连称半个月——掌局传的话。\n\n      问：药呢？\n      答：掌局收走了。他说受了潮，要送去焙一遍。\n\n      半个月，四十七两六钱，每日三钱。\n      不多不少，刚好够两个人的命，多一点都没浪费。\n\n      //份档号：07-DL-TWO","effect":{"add_clues":["lq_stain"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[["LQ",5]],"unlock":null},"found_msg":"//录下柳青的手——收录至档目//","id":"07-SY-LQ","links":["07-DL-TWO","07-DL-END"],"people":["LQ"],"place_code":"SY","requires":["dossier","07-DL-JJ"],"time_code":"07","title":"证词 · 司药柳青的手"},"07-SY-ZZZ2":{"act":7,"body":"一本无名私账，藏在值房柜底，用布裹着。\n      每笔只写四个字：药出有主。\n\n      不记名字，只画押；同样的押，抄了十二页。\n      最后一页的押还没画完——只落了一笔，笔锋在纸上顿了一下。\n\n      这不是账。这是给人看的凭据：\n      凡经我手的药，都有人认；出了事，去找那个认的人。\n\n      十二页。第一页的纸色最深，边角磨圆了。\n\n      //四字批注的收笔，和领用簿上「王德海」那三个字一样。\n      //份档号：07-DL-HAND","effect":{"add_clues":["zzz_private"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//搜出掌局私账——收录至档目//","id":"07-SY-ZZZ2","links":["07-DL-HAND","07-DL-END"],"people":["ZZZ"],"place_code":"SY","requires":["dossier","06-SY-ZZZ"],"time_code":"07","title":"掌局的私账"},"07-ZF-HXW2":{"act":7,"body":"「我值夜要留灯。戌时末，廊子上有两串脚步：一串轻，一串重。\n      轻的往药库去，重的在门口停了一会儿。\n      后来重的那串去了值房。」\n\n      问：你看见人了吗？\n      答：「没敢看。灯是暗的，我举着灯罩站在门后。」\n\n      问：你怕谁？\n      答：「我怕他记住我的脸。」\n\n      两串脚步。一串是蒋九的（他抄完账去问人），\n      另一串走到值房去的那一串——去的是蒋九的值房。\n\n      //份档号：07-DL-END","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":["hxw_trusts"],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[["HXW",5]],"unlock":null},"found_msg":"//录下两串脚步——收录至档目//","id":"07-ZF-HXW2","links":["07-DL-END"],"people":["HXW"],"place_code":"ZF","requires":["dossier","07-DL-JJ"],"time_code":"07","title":"证词 · 贺小五听见的两串脚步"},"08-CE-END":{"act":8,"body":"第二份底稿摊开，你写下第一行：\n      　「景和十七年冬，尚药局典药高延年、书吏蒋九，同日暴卒。」\n\n      第二行你想写「附子三钱」，笔停在纸上。\n      底稿不存档，写完即销；这一次写下去，纸上会有两个案子。\n\n      上一份底稿的末行还空着。你把两份并在一起，看见一件事：\n      两个案子的第一个字，都是「景和十七年冬」。\n\n      //份档号：08-DL-VERDICT","effect":{"add_clues":["verdict2_draft"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//提笔写第二份底稿——收录至档目//","id":"08-CE-END","links":["08-DL-VERDICT","08-DL-LINK"],"people":["SMB"],"place_code":"CE","requires":["dossier","07-DL-END"],"time_code":"08","title":"第二份底稿"},"08-DL-LEAF":{"act":8,"body":"解开旧档捆绳，里面最完整的一页：\n      　「景和五年，药出经卷阁，三取其二，余一入凤仪。」\n\n      三取其二：取走两份，留一份送进凤仪殿。\n      景和五年，凤仪殿住的是谁？——档案上写的是：贤妃苏氏，当年刚入宫。\n\n      这一页的背面还有一个名字，被水浸成一片灰。\n      只剩一横。那一横起笔很重，落纸时墨透到了正面。\n\n      //份档号：08-DL-NAME、08-JG-ROAD","effect":{"add_clues":["jinghe_leaf"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":6,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//找出残账一页——收录至档目//","id":"08-DL-LEAF","links":["08-DL-NAME","08-JG-ROAD","08-DL-LINK"],"people":["SMB"],"place_code":"DL","requires":["dossier","07-JG-OLD"],"time_code":"08","title":"残账一页"},"08-DL-LINK":{"act":8,"body":"你把两案并排。\n\n      凤仪殿：贤妃查出十二年前的账（采薇案、苦杏仁油、内务府亏空）。\n      尚药局：掌了二十三年钥匙的典药，和抄了半辈子账的书吏，\n      　　　在同一个夜里被同一味药封了口。\n\n      中间连着三样东西：\n      　一支笔（替人写字的人，十二年）；\n      　一味药（慢的、验不出的）；\n      　一片叶子（经卷阁的印）。\n\n      你在这张纸下方写下结论：\n      这两桩不是两案。是同一只手，先灭口，再灭记性。\n\n      //份档号：08-DL-VERDICT、08-JG-ROAD","effect":{"add_clues":["two_cases_method","killer_knowledge"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":8,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//把两案并成一条线——收录至档目//","id":"08-DL-LINK","links":["08-DL-VERDICT","08-JG-ROAD"],"people":["SMB"],"place_code":"DL","requires":["all",[["dossier","08-CE-END"],["dossier","08-SY-CONF"]]],"time_code":"08","title":"两案并成一条线"},"08-DL-NAME":{"act":8,"body":"你把残账凑到灯前，试着从墨迹的深浅里把那个名字读出来。\n      读不出来。只剩一横。\n\n      但你认得那一横：起笔重、收笔轻。\n      同一个人的字——和领用簿上「王德海」那三个字，和私账上「药出有主」，\n      是同一种起笔。\n\n      写名字的人，也是替人写字的人。\n      换句话说：十二年前那味药的真正主人，连名字都不肯自己写。\n\n      //这是案③ 的线头。今夜你拿不到它。\n      //份档号：08-JG-ROAD","effect":{"add_clues":["third_name"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//辨认浸水的名字——收录至档目//","id":"08-DL-NAME","links":["08-JG-ROAD"],"people":["SMB"],"place_code":"DL","requires":["dossier","08-DL-LEAF"],"time_code":"08","title":"被水浸过的名字"},"08-DL-SMB":{"act":8,"body":"第三册第一页，你写的是尚药局。\n      第二页起，你留了空白——留给经卷阁。\n\n      你写下这一夜的收尾：\n      　两具尸首，一味验不出的药，一支替人写了十二年的笔。\n      　凶手坐在前厅里理袖子；真正递药的那只手，今夜没有露面。\n\n      最后一页，你抄了残账上那半行字，把浸掉的名字留成一个空格。\n      空格旁边你写了一句：\n\n      　「景和五年那味药，还欠一个名字。」\n\n      //案② 到此收手。案③《景和旧案》接着这里往下走。","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//取出仵作年记 · 第三册——收录至档目//","id":"08-DL-SMB","links":["08-JG-ROAD","08-DL-LEAF"],"people":["SMB"],"place_code":"DL","requires":["dossier","07-DL-END"],"time_code":"08","title":"仵作年记 · 第三册"},"08-DL-VERDICT":{"act":8,"body":"这一案的底稿只写得下五种收尾：\n\n      　一、两案同钉。药是同一双手下的，名字写在同一页纸上。\n      　二、又是暴病。你写的名字是真的，送出去的纸是假的。\n      　三、错的药方。你报了一个方便的名字。\n      　四、灯灭。你说出了最该说的那句话，然后就没有然后了。\n      　五、只写两个名字。你只写下两行事实，不写凶手。\n\n      五种都合法，都会归卷，都会有人签字。\n\n      //写哪一种，今夜就结在哪一种上。","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//翻出第二份判决抄本——收录至档目//","id":"08-DL-VERDICT","links":["08-DL-VERDICT"],"people":["SMB"],"place_code":"DL","requires":["dossier","08-CE-END"],"time_code":"08","title":"判决录 · 五种写法"},"08-JG-ROAD":{"act":8,"body":"从尚药局往西北，过两道夹墙，是经卷阁。\n      三十年不点灯，只有两把钥匙：一把在内官监，一把在——你不知道在谁手里。\n\n      旧档上的印，残账上的字，笔杆上刻的那片叶子，都指向那扇门。\n      但今夜你进不去：门是封的，封条上盖着内官监的印。\n\n      「沈仵作。」冯保在你身后说，「那个地方，等有人请你的时候再进去。」\n\n      //这条路今夜走不到头。它留给下一个人，或者下一卷。\n      //份档号：08-DL-SMB","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":["case3_hook"],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//记下经卷阁的路——收录至档目//","id":"08-JG-ROAD","links":["08-DL-SMB"],"people":["SMB"],"place_code":"JG","requires":["dossier","08-DL-NAME"],"time_code":"08","title":"经卷阁的路"},"08-SY-CONF":{"act":8,"body":"「咱家十二岁进宫，认字是别人教的。\n      教写字的人说：你这一手字，能换一条命。」\n\n      问：换了谁的命？\n      答：采薇一条。高延年一条。蒋九一条。\n\n      问：是你要杀他们？\n      答：咱家只是把药取出来。药给谁，是上面的事。\n\n      问：上面是谁？\n      答：……咱家只认得那支笔。笔杆上刻着一片叶子。\n\n      他跪着，两只手一直拢在袖子里——写字的人，最后护的是自己的手。\n\n      //份档号：08-DL-LINK","effect":{"add_clues":["zzz_confession"],"add_dossiers":[],"add_items":[],"flags":["zzz_confessed"],"hurt":0,"scene":null,"score":8,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//录下掌局的供述——收录至档目//","id":"08-SY-CONF","links":["08-DL-LINK"],"people":["ZZZ"],"place_code":"SY","requires":["all",[["dossier","07-DL-END"],["dossier","08-DL-LEAF"]]],"time_code":"08","title":"供述 · 掌局的最后一段话"},"09-DL-SMB":{"act":9,"body":"第四册第一页，你写的是日期：腊月十九，卯时末，经卷阁。\n\n      第二页你写的是门：丙字库的门朝北，从外落锁，锁上压着封条，\n      封条上盖着封泥——景和五年的年号，却是一枚新泥胎。\n\n      第三页你写的是人：掌籍女史谢云屏，在阁二十九年。\n      她认得先帝的墨，也认得今上的朱。昨夜她死在库房里，\n      手里攥着半页纸，另一半被人抽走了。\n\n      你合上书，往阁里走。\n\n      //份档号：09-JG-YARD、09-JG-XYP","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//取出仵作年记 · 第四册——收录至档目//","id":"09-DL-SMB","links":["09-JG-YARD","09-JG-XYP"],"people":["SMB"],"place_code":"DL","requires":null,"time_code":"09","title":"仵作年记 · 第四册"},"09-JG-COAL":{"act":9,"body":"屋里两盆炭。\n\n      靠门那盆烧成了白灰，是白天添的，早灭透了。\n      书案边那盆是新的：炭块还留着棱，盆底未冷——有人在夜里添了火。\n\n      炭是新炭，灰是薄灰。一个在库房里抄了一夜账的人，\n      身边多出一盆火，这件事本身不奇怪。\n\n      奇怪的是：经卷阁一冬的炭，不走内官监这门。这一盆走了。\n\n      //份档号：09-JG-VNT","effect":{"add_clues":["brazier_two","charcoal_source"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//炭盆格目收录至档目//","id":"09-JG-COAL","links":["09-JG-VNT"],"people":["XYP"],"place_code":"JG","requires":null,"time_code":"09","title":"炭盆格目"},"09-JG-END":{"act":9,"body":"第九幕收手。你把格目按顺序排开：\n\n      　一、尸格：樱红的尸斑，鲜红的口唇，没有痛色。（09-JG-XYP）\n      　二、银针：三入不变色，屋里没有药味。（09-JG-NDL）\n      　三、炭盆：夜里添的第二盆火，炭不走内官监的那道门。（09-JG-COAL）\n      　四、气窗：油纸与黄蜡，糊窗的人量过透气。（09-JG-VNT）\n      　五、封泥：旧印新泥，翻的模；门从外落锁。（09-JG-SEAL）\n      　六、钥匙簿：前日寅时，内官监领了一号钥，没有还。（09-JG-KEY）\n\n      六条并在一处，说得出一句话：\n      有人要在夜里让这间屋子暖起来，然后再也不让人从里头出来。\n\n      这个人知道炭、知道窗、知道钥匙在谁手上。\n      宫里有这个本事的，只有一处。\n\n      //份档号：10-DL-SMB","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//勘验收手——第九幕总录收录至档目//","id":"09-JG-END","links":["10-DL-SMB"],"people":["SMB"],"place_code":"JG","requires":["all",[["dossier","09-JG-XYP"],["dossier","09-JG-NDL"],["dossier","09-JG-COAL"],["dossier","09-JG-VNT"],["dossier","09-JG-SEAL"],["dossier","09-JG-KEY"]]],"time_code":"09","title":"勘验总录 · 第九幕结"},"09-JG-FOOT":{"act":9,"body":"书案边的炭灰里，有一枚脚印。\n\n      五瓣花底，前掌窄，是女史绣鞋的底样。\n      可阁里当差的女史都穿软底鞋——软底踩不出这么深的花纹。\n\n      这一条印从门口直到书梯，深浅均匀，落脚很实：\n      中了炭气的人走不了这么远，更不会把每一步都踩得一样深。\n      像是有人沿着这条路走了一趟，专门踩给人看。\n\n      你回头看门：门从外锁着。\n\n      她的鞋在脚上。这枚印，是她活着的时候自己踩的——\n      那时门还开着，屋里还有人。\n\n      //份档号：09-JG-END","effect":{"add_clues":["char_footprint"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//脚印格目收录至档目//","id":"09-JG-FOOT","links":["09-JG-END"],"people":["XYP"],"place_code":"JG","requires":null,"time_code":"09","title":"炭灰里的脚印"},"09-JG-HAND":{"act":9,"body":"她右手攥得死紧。你掰开的时候，纸角已经揉烂了。\n\n      半页纸：右半边。左半边被人整整齐齐抽走了——\n      不是撕的，是顺着折痕裁的，裁得很平。\n\n      纸上有年号：景和五年。有账目：领炭、收炭、药出、余一。\n      末尾半行断在「余一入凤」上。\n\n      第七架上空出一函，灰印是新的。那一函昨夜还在这儿。\n\n      //份档号：09-JG-LAST","effect":{"add_clues":["xyp_hand","shelf_gap"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//半页残纸收录至档目//","id":"09-JG-HAND","links":["09-JG-LAST"],"people":["XYP"],"place_code":"JG","requires":null,"time_code":"09","title":"她手里那半页"},"09-JG-KEY":{"act":9,"body":"经卷阁的钥匙出入都要记：谁领、什么时辰、做什么、几时还。\n\n      簿子摊开，前日一页上有一行：\n      　寅时 · 丙字库 · 一号钥 · 内官监 · 领\n      　——销号那一格是空的。\n\n      领簿的人是内官监的：笔是冯保的手，押也是冯保的押。\n      钥匙领出去了，没有还。\n\n      你把这一页抄进格目，又把原簿合上，压回原处。\n\n      //份档号：09-JG-LAST","effect":{"add_clues":["key_ledger3"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//领钥匙簿抄录完毕——收录至档目//","id":"09-JG-KEY","links":["09-JG-LAST"],"people":["FB"],"place_code":"JG","requires":null,"time_code":"09","title":"领钥匙簿 · 前日寅时"},"09-JG-LAST":{"act":9,"body":"掌籍的日课簿摊在案上，翻到景和五年那一格。\n\n      格子里写着：领炭一千二百斤，收炭一千二百斤。账目平整，\n      平整得像没有人动过这一页。\n\n      格边的调档单还在：昨日午前，丙字第七函，登记理由两个字——对账。\n\n      对账。她抄了二十九年账，昨日忽然要跟十二年前的一页对账。\n      对完，她就没有出这间屋子。\n\n      格子下面还有一行小字，是她的笔，写得很轻：\n      　「十七行，不必问。」\n\n      //份档号：09-JG-PURGE","effect":{"add_clues":["xyp_lastvisit","xyp_note"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//日课簿抄录完毕——收录至档目//","id":"09-JG-LAST","links":["09-JG-PURGE"],"people":["XYP","LWS"],"place_code":"JG","requires":null,"time_code":"09","title":"日课簿 · 景和五年那一格"},"09-JG-NDL":{"act":9,"body":"银针三入：入喉、入心、入指尖。\n\n      三次都不变色。针身擦干净，凑到灯下看，还是亮的。\n\n      你把针插回布套里，站了一会儿。\n      药死的人、砒霜死的人、附子死的人，针都会说话。\n      这一针不说话——因为这一回的凶手不是药。\n\n      库房里没有药味。只有陈纸、霉，和炭气。\n\n      //份档号：09-JG-COAL","effect":{"add_clues":["needle_clean3","room_smell"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//银针格目收录至档目//","id":"09-JG-NDL","links":["09-JG-COAL"],"people":["XYP"],"place_code":"JG","requires":null,"time_code":"09","title":"银针格目"},"09-JG-PURGE":{"act":9,"body":"名录收在柜底，压在一叠废账下面。纸已经发脆。\n\n      景和五年冬，东宫旧人抄没名录：二十九人。\n      死于狱者十一，死于杖者九，死于「疾」者九。\n\n      第十七行：采薇，女，年十五，掖庭，十一月中卒，疾。\n\n      那一行的墨比别行厚——描过一次。上一层的字被人刮了。\n\n      你把名录合上。十二年前的一个「疾」字，\n      和昨夜一炉炭火，中间隔着二十九行名字。\n\n      //份档号：09-JG-FOOT","effect":{"add_clues":["purge_names","caiwei_row"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":7,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//抄没名录收录至档目//","id":"09-JG-PURGE","links":["09-JG-FOOT"],"people":["XYP","LWS"],"place_code":"JG","requires":null,"time_code":"09","title":"景和五年抄没名录"},"09-JG-SEAL":{"act":9,"body":"封泥一枚，压在封条上。印文是「景和五年 · 经卷阁」——\n      十二年前的那一枚旧印，早该收进库里了。\n\n      泥胎的颜色太新了：外头一层灰，里层还是软的。\n      你用小刀从边上起下一小块：印文边缘齐整得过分，\n      真印盖在旧纸上，边沿会碎一点。\n\n      这是翻模——拿旧印翻了个模，重新盖了一枚。\n      封条上的年号是景和五年，可这一枚泥，是昨夜的泥。\n\n      门从外落锁，锁在封条里侧。屋里的人，自己出不来。\n\n      //份档号：09-JG-KEY","effect":{"add_clues":["seal_recast","locked_outside3"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":6,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//封泥格目收录至档目//","id":"09-JG-SEAL","links":["09-JG-KEY"],"people":["SMB","XYP"],"place_code":"JG","requires":null,"time_code":"09","title":"封泥格目"},"09-JG-VNT":{"act":9,"body":"库房的气窗在梁下，一尺见方，本是留来通气的。\n\n      窗里侧糊着一层油纸，纸角压着黄蜡——外头看不见，只有爬上书梯\n      才看得见。书梯第三档上有一道蜡印，人的鞋底踩不出这个形状。\n\n      你把纸角揭开一点，风进来，烛火跳了一下。\n\n      糊窗的人知道这间屋子怎么透气。他不是随手糊的，\n      他是量过的：糊到哪一寸，火能点着，人能睡着。\n\n      //份档号：09-JG-SEAL","effect":{"add_clues":["vent_wax","ladder_wax"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//气窗格目收录至档目//","id":"09-JG-VNT","links":["09-JG-SEAL"],"people":["XYP"],"place_code":"JG","requires":null,"time_code":"09","title":"气窗格目"},"09-JG-XYP":{"act":9,"body":"掌籍女史谢云屏，年四十有四，在本阁当差二十九年。\n      死者伏在书案与炭盆之间，一只手伸向门，一只手攥着纸。\n\n      面色：不对。不是青紫，是樱红——两颊、唇、指尖，红得像上了妆。\n      口唇鲜红，十指不青。她脸上没有半点痛色。\n\n      你验过十二年的尸首，知道中毒的人死时是什么样子：\n      苦杏仁油死的人唇是黑的，附子死的人唇是麻色的。\n      这一位死得比他们都「好看」。\n\n      案上的账册翻到景和五年那一格，笔还搁在砚上，墨已干。\n\n      //份档号：09-JG-NDL、09-JG-HAND","effect":{"add_clues":["xyp_livid","xyp_face"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":6,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//掌籍女史尸格收录至档目//","id":"09-JG-XYP","links":["09-JG-NDL","09-JG-HAND"],"people":["XYP"],"place_code":"JG","requires":null,"time_code":"09","title":"尸格 · 掌籍女史谢云屏"},"09-JG-YARD":{"act":9,"body":"雪停了，天没亮透。门前三步之内的雪是踩乱的：靴印深而硬，\n      另一种是草鞋印——搬炭的人穿的。\n\n      门：黄铜锁，锁着。封条一条，泥印朝外，红年号是「景和五年」。\n      门缝里没有风——门是严的，关得比寻常库房都严。\n\n      阶下站着个小监，两只手拢在袖子里——不是常安，另是一个。\n      「掌印说，先封后验。」他说，「沈仵作，这门，您验完了得照原样封上。」\n\n      照原样。你把这四个字记在心里。\n\n      //份档号：09-JG-SEAL、09-JG-FOOT","effect":{"add_clues":["locked_outside3"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//勘验程式记毕——收录至档目//","id":"09-JG-YARD","links":["09-JG-SEAL","09-JG-FOOT"],"people":["SMB"],"place_code":"JG","requires":null,"time_code":"09","title":"丙字库外 · 勘验程式"},"10-DL-CA":{"act":10,"body":"常安十六岁，去年才拨进阁里。问他的话，他都答；答到一半会停下来，\n      看看左右，再小声补一句。\n\n      「后半夜有人敲窗。」他说，「他让我把两筐炭搬到丙字库，\n      说姑姑夜里冷。还给我一块蜡，让我把气窗糊上。」\n\n      「你为什么要糊窗？」\n      「他说糊上才暖。」\n\n      他把「暖」字说得理直气壮。他不知道暖也能杀人。\n\n      //份档号：10-DL-END","effect":{"add_clues":["ca_words"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//常安的问询记录收录至档目//","id":"10-DL-CA","links":["10-DL-END"],"people":["CA"],"place_code":"DL","requires":null,"time_code":"10","title":"问询录 · 常安"},"10-DL-CC":{"act":10,"body":"你先把半页烧剩的令纸放在他面前：纸上「封存」两个字还在，\n      边角压着半个印。他看了一眼，没有去拿。\n\n      「封存是你下的令？」\n      「内官监的规矩：宫里死了人，先封后验。」\n      「烧了的东西，也是规矩？」\n      「烧了的东西，不算档。」他说。\n\n      「炭气这一句，也是规矩？」\n      「仵作。」他终于抬头，「一句能写进档的话，比十句真话省事。」\n\n      他答完这两句就不说话了。他掌印二十一年，\n      说的话从来不超过两句：第一句是「奉旨」，第二句是「封存」。\n\n      //份档号：10-DL-END","effect":{"add_clues":["cc_order"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//曹淳的问询记录收录至档目//","id":"10-DL-CC","links":["10-DL-END"],"people":["CC"],"place_code":"DL","requires":null,"time_code":"10","title":"问询录 · 曹淳"},"10-DL-END":{"act":10,"body":"第十幕收手。四份问询录并排摊开：\n\n      　一、常安：有人敲窗，让他搬炭、糊窗，说「姑姑夜里冷」。（10-DL-CA）\n      　二、陆文昭：抄三遍名录，第十七行不许念，抄完之后让她烧。（10-DL-LWS）\n      　三、曹淳：先封后验是他的规矩，一句炭气顶十句真话。（10-DL-CC）\n      　四、冯保：前日寅时，领钥匙簿上是他的手。（10-DL-FB）\n\n      四个人的话对得上一件事：封门的人、糊窗的人、领钥匙的人，\n      都是内官监的手。而让他们动手的那一页纸，出自景和五年。\n\n      案卷写到这一步，只剩下一个问题：\n      那一页上的三个朱字，是谁写的。\n\n      //份档号：11-DL-DRAFT、11-CE-END","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":8,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//问询收手——第十幕总录收录至档目//","id":"10-DL-END","links":["11-DL-DRAFT","11-CE-END"],"people":["SMB"],"place_code":"DL","requires":["all",[["dossier","10-DL-CA"],["dossier","10-DL-LWS"],["dossier","10-DL-CC"],["dossier","10-DL-FB"]]],"time_code":"10","title":"第十幕问询总录"},"10-DL-FB":{"act":10,"body":"冯保是四个人里唯一先开口的，也是唯一把话说完的。\n\n      「前日寅时，你在哪儿？」\n      「在尚药局。」他说，「仵作见过的。」\n\n      你把领钥匙簿推过去：前日寅时，经卷阁丙字库一号钥，内官监领。\n      他低头看那一行，看了一会儿。\n\n      「手是咱家的手。」\n\n      他认得很干脆。干脆得像是早就等着有人来问这一句。\n\n      //份档号：10-DL-END","effect":{"add_clues":["fb_key3"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//冯保的问询记录收录至档目//","id":"10-DL-FB","links":["10-DL-END"],"people":["FB"],"place_code":"DL","requires":null,"time_code":"10","title":"问询录 · 冯保"},"10-DL-LWS":{"act":10,"body":"陆文昭二十二岁，写得一手好字。这一份记录里，她的答话最短——\n      短到你要停下来想一想，她省掉的是哪一段。\n\n      「师父昨夜让我抄景和五年的抄没名录，抄三遍。\n      第一遍她对着看，第二遍让我念出声，第三遍她说：烧了。」\n\n      「你念到哪儿她让你停的？」\n      「第十七行。」她说，「她说那一行不要念。」\n\n      她答得很快，快到像是提前想好的。答完之后她低头看自己的手，\n      那只手一直没有松开——手心里攥着一张折了四折的纸。\n\n      「第三遍我没烧。」她说，「师父还让我把它带出去。」\n\n      //份档号：10-DL-END","effect":{"add_clues":["lws_copy"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//陆文昭的问询记录收录至档目//","id":"10-DL-LWS","links":["10-DL-END"],"people":["LWS"],"place_code":"DL","requires":null,"time_code":"10","title":"问询录 · 陆文昭"},"10-DL-SMB":{"act":10,"body":"你把四个人排在一张纸上：\n\n      　看阁小监常安——十六岁，认字不多，记得谁上过阁顶。\n      　候补书吏陆文昭——抄了三遍名录，师父让她烧了。\n      　内官监掌印曹淳——封存、用印、领钥匙，都是他的人。\n      　内官监少监冯保——药局那一夜他也在，手上多了一把钥匙。\n\n      四个人，四张嘴。你要问的是同一件事：\n      谁让这间屋子在夜里暖起来的。\n\n      //份档号：10-DL-CA、10-DL-LWS、10-DL-CC、10-DL-FB","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//第四册续页收录至档目//","id":"10-DL-SMB","links":["10-DL-CA","10-DL-LWS","10-DL-CC","10-DL-FB"],"people":["SMB"],"place_code":"DL","requires":null,"time_code":"10","title":"仵作年记 · 第四册（续）"},"10-JG-ORIG":{"act":10,"body":"陆文昭从袖子里掏出一张折了四折的纸。\n\n      景和五年 · 经卷阁 · 炭药出入：\n      　领炭一千二百斤，收炭一千二百斤。\n      　药出经卷阁，三取其二，余一入凤仪。\n      　余一：苦杏仁油，一剂。\n\n      末尾三个朱字，写得极随意，像是随手一勾：知道了。\n\n      第一味药的名字被墨涂了，涂得很厚——写它的人不愿留名。\n      而三个朱字没有涂：写它的人不必留名。\n\n      //份档号：10-DL-END","effect":{"add_clues":["jinghe_orig","emperor_ink","third_name3"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":8,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//景和五年原页收录至档目//","id":"10-JG-ORIG","links":["10-DL-END"],"people":["XYP","LWS"],"place_code":"JG","requires":["dossier","10-DL-LWS"],"time_code":"10","title":"景和五年原页"},"11-CE-END":{"act":11,"body":"三桩案子，三层纸，摞在一起只有半寸厚。\n\n      凤仪殿的茶是慢的，尚药局的附子是慢的，经卷阁的炭也是慢的。\n      三样东西都不是刀，都要等——等一个人睡着，等一炉火烧透，\n      等十二年过去，让记得的人先死掉。\n\n      宫里人管这个叫「干净」。\n\n      你把三份纸对齐，压上镇纸。窗外天已经亮了，\n      雪地上有一行脚印从经卷阁一直往南，通向宫门。\n\n      //份档号：11-DL-VERDICT、11-DL-SMB","effect":{"add_clues":["road_out3"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//卷宗收尾收录至档目//","id":"11-CE-END","links":["11-DL-VERDICT","11-DL-SMB"],"people":["SMB"],"place_code":"CE","requires":["dossier","11-DL-DRAFT"],"time_code":"11","title":"卷宗收尾 · 三案"},"11-DL-DRAFT":{"act":11,"body":"第三份底稿比前两份都薄。\n\n      第一份写凤仪殿：一盏茶，一枚玉扳指。\n      第二份写尚药局：一味附子，一支替人写了十二年的笔。\n      第三份只写得下三行：\n\n      　谢云屏，掌籍女史，卒于丙字库，炭气。\n      　门从外封，封泥为翻模，钥匙出内官监。\n      　原页一纸，朱批三字。\n\n      三行写完，笔就停在这儿。\n      再往下的那个名字，写上去容易，兜得住难。\n\n      //份档号：11-CE-END","effect":{"add_clues":["verdict3_draft"],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":4,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//第三份底稿收录至档目//","id":"11-DL-DRAFT","links":["11-CE-END"],"people":["SMB"],"place_code":"DL","requires":["dossier","10-DL-END"],"time_code":"11","title":"第三份底稿"},"11-DL-SMB":{"act":11,"body":"第四册最后一页，你写的是经卷阁。\n\n      　　景和五年，一页账，三个朱字，二十九行名字。\n      　　十二年后，一位掌籍女史死在门从外封的库房里，\n      　　死得比中毒的人还「好看」。\n\n      你写下这一卷的收尾：\n      　三桩案子，一条线，线头在景和五年。\n      　死人写得进档，活人写不进。\n\n      最后一页你抄了名录第十七行，把「疾」字圈起来，\n      在旁边留了一个空格——那是名字的位置。\n\n      //案③ 到此收手。空格里填谁，看你这一卷怎么写。","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":5,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//取出仵作年记 · 第四册卷终页——收录至档目//","id":"11-DL-SMB","links":["11-DL-VERDICT"],"people":["SMB"],"place_code":"DL","requires":["dossier","11-CE-END"],"time_code":"11","title":"仵作年记 · 第四册（卷终）"},"11-DL-VERDICT":{"act":11,"body":"这一案的底稿只写得下六种收尾：\n\n      　一、原页。原页、供述、翻模的封泥一齐摆上案，纸被烧掉，字留下来。\n      　二、留中。名字是真的，纸被留中，从此没有人再见过它。\n      　三、奉旨。你指认了那个奉旨办事的人，半个月后他升了掌印。\n      　四、替罪的人。你报了一个方便的名字，常安死在工地上。\n      　五、不可说。你说出了那个写在纸上的名字。\n      　六、合上卷宗。你只写事实，不写凶手。\n\n      六种都合法，都会归卷，都会有人签字。\n\n      //写哪一种，这一卷就结在哪一种上。","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":null,"score":3,"text":null,"time":null,"trust":[],"unlock":null},"found_msg":"//翻出第三份判决抄本——收录至档目//","id":"11-DL-VERDICT","links":["11-DL-VERDICT"],"people":["SMB"],"place_code":"DL","requires":["dossier","11-CE-END"],"time_code":"11","title":"判决录 · 第六种写法"}},"endings":[{"body":"「陛下。」\n这两个字在殿上落地的时候，你就已经知道后面会发生什么了。\n皇帝没有怒。他只是很轻地叹了口气，像是终于等到一件早知道会来的事。\n「沈墨白，你验尸验得久了，把活人也当成了死物。」\n当夜，大理寺的档案房走水，烧了三间屋。仵作沈墨白「殉于火」。\n贤妃以「薨于旧疾」入陵。王德海守陵三年，未死。小顺子后来补进了尚药局，做事很稳，只是从不碰茶。\n「在这座宫里，天子没有案子。」","case":1,"id":"ending_treason","rank":"不可说","rule":["suspect","HD"],"subtitle":"你指认了天子","title":"结局 · 天子无案"},{"body":"你把每一件都摆了出来：银针变黑是七日积毒而非即刻鸩杀；香炉里的朱砂只会叫人昏沉，那是布给你看的障眼法；窗棂上的撬痕、栓下的木屑，说明门是从外头拨上的；尚药局簿上七次支取苦杏仁油，记的都是王德海的名，字迹却各不相同——有人替他写，那笔迹和十二年前采薇案卷里的供词一模一样。\n最后你念出贤妃那张没写完的笺纸，念到「王德海经手，账目有亏」时，王德海的肩膀塌了下去。\n「她……她查了三个月。」他说，「她要翻十二年前的事。老奴这条命，是从那时候活到现在的。」\n他又抬起头，眼睛红着：「皇后娘娘也恨她。可是娘娘没动手。是老奴动的手。茶是亥时初送的，她喝了半盏，问老奴为什么手抖。」\n皇帝没有立刻说话。他先问：「她走的时候，疼么。」\n「不疼。」你说，「苦杏仁油是慢慢走的，人会先睡过去。」\n那句话像一块石头落进水里。皇帝闭了一下眼，才开口：「杖毙。同罪者，一并查。」\n——同罪者。你抬起头，看见皇后在手心里攥紧了那枚玉扳指。\n三个月后，掖庭重修名册，采薇的名字被添回了一笔。你升了大理寺丞，从此再没人敢在你验尸的时候说话。\n「真相大白，且未曾被任何人按下。」","case":1,"id":"ending_restitution","rank":"上上","rule":["all",[["suspect","WDH"],["core_count",">=",10],["clue","empress_motive"],["clue","empress_ring"],["flag","wdh_confessed"]]],"subtitle":"真凶伏法，且无人能将此案按下","title":"结局 · 铁证如山"},{"body":"你摆出了茶盏、苦杏仁油、香炉灰与窗棂上的刮痕，把王德海按在了案上。\n他招了：茶是亥时初送的，他本来只想让她昏睡几日，好把账目上的窟窿填平。可他没算准分量——或者说，他算准了。\n「杖毙。」皇帝说。\n王德海被拖出去的时候，回头看了你一眼，像是要说什么，最后什么也没说。\n案子结了，结得很干净。只是你总觉得，还有些东西没有摆到案上——比如那枚不该出现在皇后手上的玉扳指，比如采薇。\n皇帝赏了你二十两银、一件狐裘，还有一句话：「此案，不必再提。」\n「凶手伏法，但水面下的东西，你没有捞完。」","case":1,"id":"ending_standard","rank":"上","rule":["all",[["suspect","WDH"],["core_count",">=",6],["clue","killer_knowledge"]]],"subtitle":"真凶伏法，但水下还有东西","title":"结局 · 尘埃落定"},{"body":"你报了皇后的名字，然后把那枚玉扳指的事端了出来——先帝所赐，本该在太子手上。\n皇后的脸在灯下白了一层。她看着皇帝，一个字都没说。\n殿上安静了很久。皇帝说：「沈墨白，你查的是贤妃的死。」\n「臣查的是贤妃的死因。」你说，「她死前见的是皇后娘娘。」\n然后你被请了出去。当晚你被挪进大理寺的值房，门口多了一个人守着。\n三日后结案：太监总管王德海「因账目亏空、谋害主位」，杖毙——是皇帝自己下的旨。你知道那是对的，也知道那不是全部。\n你保住了命，保住了官，也从此被记在了那本不该记的册子上。\n「你说出了更危险的那半截真相。它没有杀死你，但也再没有第二个人听见。」","case":1,"id":"ending_dangerous","rank":"存疑","rule":["suspect","HH"],"subtitle":"你说出了更危险的那半截真相","title":"结局 · 玉扳指"},{"body":"你报出的名字，不是那个把茶端进去的人。\n证据被一条条驳了回来。贵妃当堂冷笑：「汤碗还在厨下，大人不妨去验；倒是那盏茶——是谁端进去的？」\n皇帝看着你，看了很久，然后说：「沈墨白，你验了四十七具尸首，今日这一具，你验坏了。」\n结案如你所请。三日后，那人被处死。\n又过了七日，御膳房的小顺子在掖庭的井里被捞了上来。仵作验的是溺水——你去看过那个井口，井沿上有一道新鲜的血痕。\n你从此不再接宫里的差事。夜里偶尔会想起王德海跪在门槛外那副肩膀一抽一抽的样子，然后想起他抬头看你的那一眼。\n「错的人死了，对的人还在。这桩案子从此没有人再敢查。」","case":1,"id":"ending_false","rank":"下下","rule":["suspect_in",["GF"]],"subtitle":"你报错了名字","title":"结局 · 替罪的人"},{"body":"你把簿子放进火盆，看着它烧完，然后解了腰牌。\n「臣验不出来。」你说，「臣请辞。」\n皇帝盯着你看了很久，最后摆了摆手。\n三个月后，京城西市开了一家小药铺，掌柜的姓沈，验尸的手艺改成了看脉。偶尔有官差上门求验伤，他都推了。\n只有一个夜里，一个裹着斗篷的女人来买安神的药，付钱时掉出一枚玉扳指，骨碌碌滚到柜台底下。\n「客官的东西。」\n「不是我的。」她说，「扔了吧。」\n「你把扳指扔进了井里。从此再没有谁提起贤妃。」","case":1,"id":"ending_quiet","rank":"退","rule":["flag","resign"],"subtitle":"你烧了簿子","title":"结局 · 辞官"},{"body":"你把记事簿合上：「此案暂无确证，臣请再查。」\n皇帝没有让你再查。他让你把簿子留下。\n贤妃以「薨于旧疾」下葬，丧仪如制。王德海照旧当他的总管，只是从此见了你便绕道走。三个月后，小顺子被调去了皇陵，说是「他自己求的」。\n你在记事簿的最后一页写过一句话，交上去之前，你把它撕了下来，投进了烛火里：「我知道是谁。我知道我为什么不说。」\n「你交出了簿子。这座宫城照旧运转，一点声音也没有。」","case":1,"id":"ending_bystander","rank":"中下","rule":["any",[["flag","gave_up"],["suspect",""]]],"subtitle":"你没有写下任何名字","title":"结局 · 查不出来"},{"body":"皇帝在你开口之前先开了口。\n「贤妃久病，痰壅气绝。」他说，「仵作验过了。」\n你验过了。你验出的是一根变黑的银针、一盏有苦杏仁味的冷茶，和一张没写完的笺纸。这些话在你喉咙里滚了一圈，最后你低头：「……是。」\n案子就这样收了。王德海被调去守陵，三日后在陵上自缢。皇后那枚玉扳指没人再提。采薇的名字依旧不在名册上。\n你走出宫门的时候天亮了。你把记事簿收进袖子，觉得它比来时重。\n「你活着，且升了官。只是从此以后，你再没有验过一具宫里的尸首。」","case":1,"id":"ending_pressured","rank":"中","rule":["all",[["suspect","WDH"],["flag","accused"],["not",["clue","killer_knowledge"]]]],"subtitle":"真凶未受审，案子被按了下去","title":"结局 · 按下"},{"body":"你说出「内官监少监冯保」。\n他没有生气，甚至笑了一下，然后做了一件你没想到的事：他转身走到廊下，把前厅的灯一盏一盏吹灭了。\n天还没亮透。黑暗里你听见他的声音，很近：\n「沈仵作，你查的是两具尸首。内官监管的是——谁的名字能留在纸上。」\n灯重新点起来的时候，他还在原地。底稿不见了。\n当日的文书写的是一场雪，冻死了两个当值的。\n三个月后，大理寺的档架少了一格。你被调去管义庄，在那里你验的每一具尸首，都没有名字。\n「你说出了最该说的那句话，然后就没有然后了。」","case":2,"id":"ending2_lightout","rank":"不可说","rule":["suspect","FB"],"subtitle":"你说出了最该说的那句话，然后就没有然后了","title":"结局 · 灯灭"},{"body":"你把两案的纸摊在同一张案上。\n左边是凤仪殿：半盏安神茶、一炉朱砂、窗棂上的撬痕。右边是药库：三钱生附子、一截青丝线、值夜簿上描出来的那一行字。\n然后你摆出第三样东西：一本私账，每笔只写四个字——「药出有主」。七次取用，前六次在景和五年到十二年之间，第七次在贤妃薨的前一日。\n「同一个人写的字。」你说，「都是照着别人的手描的。凤仪殿的茶是一支，尚药局的附子是一支，写字的只有一支。」\n郑守拙跪下了。他说的第一句话不是求饶：「咱家十二岁进宫，认字是别人教的。教咱家写字的人说：你这一手字，能换一条命。」\n「换了几条？」你问。\n「三条。」他说，「采薇一条。高延年一条。蒋九一条。」\n他还说了第四件事：景和五年，药是从经卷阁出的，经手的人里有一个名字被水浸过，谁也看不清——但那一横起笔很重。\n冯保在门外站了很久。天亮的时候，他进来把两份底稿都收走了，一句话没说。\n三个月后你听说，经卷阁闭了。又过了半年，东宫废址的墙塌了一角，有人在里面挖出半箱账册。\n「两案并作一案：药是同一双手下的，名字也写在同一页纸上。」","case":2,"id":"ending2_truth","rank":"上上","rule":["all",[["suspect","ZZZ"],["core_count",">=",12],["clue","zzz_confession"],["clue","jinghe_leaf"]]],"subtitle":"药是同一双手下的，名字写在同一页纸上","title":"结局 · 两案同钉"},{"body":"你把郑守拙的话原样誊了下来。\n他承认字是他描的，承认七次取用里有三次是他签的押——可他始终没说那页纸是从哪儿来的。\n「药出有主。」你把私账翻到最后一页，「主是谁？」\n他抬眼看你，没有答。\n内官监当天就把底稿收走了。冯保读得比上一回慢，读到「描」字的时候停了一下，什么也没改。\n结案文书上写的是：尚药局掌局郑守拙，私刻药引、伪造簿册，两案并发，拟定绞。\n「药是同一双手下的」——这一句你没写进去。写不进去：你手上没有那一页。\n三个月后经卷阁封了。你托人问过那半箱账册，回话是「搬运时落水，字都泡了」。\n只有你自己还记得：那一横，起笔很重。","case":2,"id":"ending2_thin","rank":"中上","rule":["all",[["suspect","ZZZ"],["flag","accused"],["clue","zzz_confession"]]],"subtitle":"供述到手了，那一页还在别人手里","title":"结局 · 一页之差"},{"body":"你报了郑守拙的名字，把青丝线、值夜簿和那本私账摆上案。\n他没有喊冤。他只是一直看着冯保。\n冯保接过底稿，从头到尾读了一遍，读到「附子三钱」四个字的时候停了一下，然后拿起笔，把「附子」改成了「寒疾」。\n「两具尸首，一个典药、一个书吏，一夜之间。」他说，「写出去，尚药局从上到下都要换人。这不合内官监的意思。」\n你想说什么，他先抬手拦住了：「沈仵作，你的名字咱家会写上去，功劳是你的。」\n底稿发下来的时候，你看了很久。上面写着：尚药局典药高延年、书吏蒋九，俱因寒疾暴卒。\n「你写的名字是真的，可送出去的纸是假的。」","case":2,"id":"ending2_pressed","rank":"中","rule":["all",[["suspect","ZZZ"],["flag","accused"],["not",["clue","zzz_confession"]]]],"subtitle":"你写的名字是真的，送出去的纸是假的","title":"结局 · 又是暴病"},{"body":"你报了那个手上有黄渍的姑娘，或者那个十六岁、不肯熄灯的小监。\n结案文书发得很快，快到你都来不及再问一句。\n柳青被送进掖庭的时候，把自己称过的附子一笔一笔报给了记档的人：「每日三钱，一共四十七两六钱。你们可以称。」\n四十七两六钱，分毫不差。\n贺小五什么也没说。他只是把灯罩留在了值房——那是他娘留给他的东西。\n案子结了，你升了。尚药局换了掌局，药库换了封条。\n第二年冬天，又有一位娘娘在夜里薨了，口角有黑血。\n「你报了一个方便的名字，真正的写字人还坐在案前。」","case":2,"id":"ending2_wrong","rank":"下下","rule":["suspect_in",["LQ","HXW"]],"subtitle":"你报了一个方便的名字","title":"结局 · 错的药方"},{"body":"你把笔搁下，没有写凶手。你写的是两行事实：\n尚药局典药高延年，卒于药库，口唇麻色；书吏蒋九，卒于值房，口唇麻色。\n附子三钱，值夜簿一行，门闩上的一截线。\n「臣只能写到这儿。」你说，「再往下的名字，臣没有证据。」\n冯保看了很久，然后把底稿折起来收进袖里。\n「这也是一份结案。」他说，「只可惜——不知是谁以后要替它写下去。」\n开春以后，尚药局换了新的封条，药库的钥匙换了人拿。\n蒋九案上那盏灯，没有人再去点。\n「两具尸首，一个不肯说的名字。」","case":2,"id":"ending2_quiet","rank":"中下","rule":["any",[["flag","gave_up2"],["suspect",""]]],"subtitle":"两具尸首，一个不肯说的名字","title":"结局 · 只写两个名字"},{"body":"「臣要对质的是——」你抬起头，「御笔。」\n阶上没有人说话。曹淳闭上了眼，冯保把额头贴在地上。\n天子看着你，看了很久，然后笑了一下。\n「知道了。」他说，「你退下吧。」\n第二天，你被调去管义庄。第三年，你的名字从刑部的名册上消失了。\n有说你在任上病死的，有说你夜半出城往南去了的。\n景和五年那一页还在经卷阁的书案上，末尾三个字是今上的笔。\n它没有被人抄过，也没有被人烧过。\n它只是没有被人念出来。","case":3,"id":"ending3_unspeakable","rank":"不可说","rule":["suspect","HD"],"subtitle":"你说出了那个写在纸上的名字","title":"结局 · 不可说"},{"body":"你把那张折了四折的纸摊在案上，连同翻模的封泥、气窗上的蜡。\n景和五年，经卷阁领炭一千二百斤，收炭一千二百斤。账目平整。唯有末尾三个朱字，写得极随意：知道了。\n「这一页是抄本。」你说，「原页在丙字库，抄本在她袖子里。抄本上少了第十七行——因为第十七行上有一个人。」\n「名录上的采薇，是后来入宫的贤妃。景和五年，她被从这一页上抹掉，本该死在掖庭——十二年后，这一页上那剂苦杏仁油，送回了凤仪殿。」\n「封门的是冯保，教他封门的人在内官监。臣要写的那个名字写不出来——臣只写这三个字。」\n天子伸出手指，在「知道了」上按了很久。\n「烧了。」他说，「连抄本一起。」\n殿前点起火盆。三桩案子的底稿一份一份送进去，纸上的字先亮起来，然后暗下去。\n——只是那天夜里，经卷阁的书案上多了一本日课簿，皮面写着景和五年，翻开那一格，字还在。","case":3,"id":"ending3_orig","rank":"上上","rule":["all",[["suspect","FB"],["clue","jinghe_orig"],["clue","emperor_ink"],["flag","fb_cracked3"]]],"subtitle":"原页、供述、翻模的封泥，一齐摆到了案上","title":"结局 · 原页"},{"body":"「凶手是内官监掌印曹淳。」你说，「他封的库，他写的档。」\n曹淳没有辩。他跪下来，把袖中的封泥模子放在阶上。\n「是咱家封的门。」他说，「内官监的规矩，先封后验。」\n「炭是谁添的？」\n「咱家不知道。」他答得极稳，「咱家只知道有一扇窗要糊。」\n案子结了。写进档的是：内官监掌印曹淳，擅封宫库，致掌籍女史谢云屏毙于炭气。\n半个月后，冯保升了掌印。\n经卷阁丙字库换了新锁，钥匙收在内官监值房，领钥匙簿上从此不再出现空的销号。\n「奉旨」两个字，写得下一切。","case":3,"id":"ending3_byorder","rank":"中","rule":["suspect","CC"],"subtitle":"你指认了那个奉旨办事的人","title":"结局 · 奉旨"},{"body":"「凶手是内官监少监冯保。」你说，「他领的钥匙，他糊的窗。」\n你把领钥匙簿呈上去：前日寅时，钥匙领出去了，没有还。\n冯保跪在阶下，一句话没说。天子看完了案卷，搁下笔。\n「留中。」\n留中的意思是：不发，不抄，不议。\n案卷被收进内廷，从此没有人再见过它。\n你回到经卷阁时，丙字库的门开着：炭盆、气窗、封泥都收拾干净了。\n门上新换了一道封条，封泥是今年的年号，按得规规矩矩。\n那一枚翻模的旧印，从此谁也没有再提起。\n「名字是真的，纸是留中的。」","case":3,"id":"ending3_sealed","rank":"中","rule":["all",[["suspect","FB"],["flag","accused"]]],"subtitle":"名字是真的，纸是留中的","title":"结局 · 留中"},{"body":"「是陆文昭。」你说，「她抄的最后一页，她袖子里那张纸。」\n「是常安。」你说，「他搬的炭，他糊的窗。」\n审问那天，常安才十六岁。他一直在抖，说不清是听了谁的话去糊窗。\n陆文昭把袖子翻过来给你看：里面空了——那张纸她烧了，火盆里还剩一角没烧尽的边。\n结案文书上写的是：候补书吏陆文昭，因争掌籍之职，谋害其师。或者是：看阁小监常安，失职致人死亡。\n三日后，常安被送去做苦役。九日后，他在工地上死了，仵作说是摔的。\n经卷阁照着旧例换了封条。丙字库的钥匙，还是内官监的人拿。\n你写完最后一行，墨还没干。","case":3,"id":"ending3_wrong","rank":"下下","rule":["suspect_in",["LWS","CA"]],"subtitle":"你报了一个方便的名字","title":"结局 · 替罪的人"},{"body":"你把笔搁下。\n案上摊着三桩案子：凤仪殿的茶，尚药局的附子，经卷阁的炭。三具尸首，三个说法。\n你写下的只有事实：经卷阁掌籍女史谢云屏，卒于丙字库，尸斑樱红，银针不黑；门从外锁，封泥为翻模；气窗有蜡。\n「臣只能写到这儿。」你说，「再往下，臣要写一个不能写的名字。」\n天子把那三页纸收起来，放进一个木匣。\n「合上吧。」他说。\n你合上卷宗，退出去。经卷阁的书案上，日课簿还摊在景和五年那一格——\n这一格，以后再没有人添过字。\n——三桩案子，一个不肯说的名字。","case":3,"id":"ending3_quiet","rank":"中下","rule":["any",[["flag","gave_up3"],["suspect",""]]],"subtitle":"三桩案子，一个不肯说的名字","title":"结局 · 合上卷宗"}],"help_sections":[{"rows":[["阅 <档号>","打开一份档案。也可以直接敲档号。"],["档目 [页]","列出已收集的档案，按幕分页。"],["查 <词>","在已读档案里检索。"]],"title":"阅档"},{"rows":[["问 <人> [话题]","提审在场之人。不写话题则列出可问之事。"],["出示 <物证> <人>","把一件物证推到某人面前。"],["前往 <地点>","移步他处。"],["查证","清点证物，看还缺什么。"],["复核","把已知的时辰串成时间线。"]],"title":"查案"},{"rows":[["记 <文字>","往记事簿里添一条。"],["改 <号> <文字>","改写第几条；不写号则改最后一条。"],["删 <号>","涂掉第几条。"],["目 <时码> <标题>","给某个时辰取个标题。"],["幕 <号> <标题>","给某一幕取个标题。"]],"title":"笔记"},{"rows":[["指认 <人>","在结案陈词上写下那个名字。"],["存档 / 读档","记档与取档。"],["帮助 / 退出","看这一页；离开。"]],"title":"结案"}],"interrogate_hall":"interrogate_hall","items":{"aconite_gap":{"core":true,"desc":"附子格里的余量比账面少三钱，缺口处的药粉印子是新的。","name":"药柜第三层缺的三钱","tag":"clue"},"aconite_intake":{"core":true,"desc":"附子入库的次日，正是苦杏仁油第七次被取用的那一天。","name":"附子入库的日子","tag":"doc"},"aconite_nature":{"core":true,"desc":"附子入药须炮制。生用三钱即能致命：入口麻舌，一个时辰后心悸而亡，银针验不出，瞳仁也不散——与苦杏仁油正成一对。","name":"附子的药性","tag":"doc"},"aconite_smell":{"core":true,"desc":"铜药匙上一层薄白霜，嗅之微辛，舌尖一沾就麻：附子。","name":"匙上的白霜","tag":"clue"},"almond_habit":{"core":true,"desc":"她惯饮武夷，茶味厚，能压住杏仁油气。","name":"贤妃的饮茶之习","tag":"clue"},"almond_oil":{"core":true,"desc":"尚药局旧档：苦杏仁油入药可安神，过量则令人气绝；取用须记名。","name":"苦杏仁油","tag":"doc"},"black_blood":{"core":true,"desc":"黑血沿唇角流至耳下，说明中毒在两三个时辰之前。","name":"口角黑血","tag":"clue"},"bolt_thread":{"core":true,"desc":"门闩栓槽里卡着一小截青丝线，线头是拉断的毛边：门是从外面拨上的。","name":"门闩上的青丝线","tag":"clue"},"brazier_two":{"core":true,"desc":"一盆烧成了白灰，另一盆是新添的，炭块还留着棱——有人在夜里添了火。","name":"两盆炭","tag":"clue"},"burned_order":{"core":false,"desc":"半页没烧尽的牒纸：「封存」两个字还在，纸角压着半个印。","name":"炉灰里的半页令纸","tag":"clue"},"ca_saw_fb":{"core":true,"desc":"常安说：昨夜有个人上了阁顶，下来时袖口沾着灰，他没敢抬头看脸。","name":"上过阁顶的人","tag":"testimony"},"ca_words":{"core":true,"desc":"「姑姑夜里冷，把这两筐炭搬进去。」——常安说，那个人隔着窗吩咐，脸他没敢看。","name":"常安听到的那句话","tag":"testimony"},"caiwei_death":{"core":true,"desc":"采薇为王德海手下宫人，因他伪造的罪名被杖毙。","name":"采薇之死的隐情","tag":"doc"},"caiwei_hand":{"core":true,"desc":"采薇案的口供与药局领用簿是同一个人写的：替人写字，写了十二年。","name":"十二年前的那支笔","tag":"doc"},"caiwei_row":{"core":false,"desc":"名录第十七行：采薇，女，年十五，掖庭，「疾」。那一行的墨比别行厚——描过一次。","name":"第十七行","tag":"doc"},"cc_hand":{"core":true,"desc":"曹淳答得很慢：「钥匙？在冯保身上。」——封门要先开门，这是他的理。","name":"钥匙在冯保身上","tag":"testimony"},"cc_order":{"core":true,"desc":"「封存，不开验。」——炉灰里半页烧剩的令纸上，压着半个掌印的印。","name":"掌印的令","tag":"doc"},"cc_tone":{"core":false,"desc":"曹淳只说了一句：「炭气熏的。仵作这一句写在纸上，咱们都好过。」","name":"掌印的口风","tag":"testimony"},"censer_red":{"core":true,"desc":"龙涎香灰尚温，灰中混着微红细末，指捻发涩。","name":"香炉红色粉末","tag":"clue"},"char_footprint":{"core":false,"desc":"炭灰里一枚脚印，五瓣花底，是女史的绣鞋。可她穿的是软底鞋。","name":"炭灰里的脚印","tag":"clue"},"charcoal_source":{"core":true,"desc":"那盆新炭是内官监的人送进阁的：阁里一冬的炭，都不走这条门。门前雪里的草鞋印，是搬炭的人留下的。","name":"炭的来路","tag":"doc"},"cinnabar_note":{"core":true,"desc":"朱砂入炉只令人昏沉目眩，不能致死，亦不为银针所验。","name":"朱砂丸方","tag":"clue"},"consort_leverage":{"core":true,"desc":"贵妃曾私换过贤妃的安胎药。她怕这件事被翻出来。","name":"贵妃的把柄","tag":"testimony"},"consort_soup":{"core":false,"desc":"贵妃送汤，贤妃未饮；汤碗当夜被收走，厨下已洗。","name":"贵妃的汤","tag":"testimony"},"contradiction":{"core":true,"desc":"王德海说亥时末破门才见尸体，却又说「娘娘面色如生，还饮着茶」。","name":"供述矛盾","tag":"clue"},"contradiction2":{"core":true,"desc":"郑守拙说蒋九整夜在值房；柳青说戌时见他往药库去。","name":"两句供词对不上","tag":"testimony"},"coroner_count":{"core":false,"desc":"沈墨白亲手填过的尸格：第七年已验四十七具，其中三具写着「杖毙」。","name":"仵作年记 · 四十七具","tag":"doc"},"dismissal_roll":{"core":true,"desc":"戌时初遣退九人，独留王德海在外殿值夜。","name":"遣退宫人名录","tag":"doc"},"doors_bolted":{"core":false,"desc":"铁栓横死，窗插销完好——室内原本只有贤妃一人。","name":"殿门由内反锁","tag":"clue"},"eight_verdicts":{"core":false,"desc":"同一个案子可以有八种收尾，都合法。只有一种是今夜该写的。","name":"判决的八种写法","tag":"doc"},"emperor_care":{"core":false,"desc":"他问的不是「谁害了她」，是「她走时可疼」。","name":"皇帝的哀恸","tag":"testimony"},"emperor_ink":{"core":true,"desc":"原页末尾三个朱字，是今上的笔：「知道了。」","name":"御笔三字","tag":"clue"},"emperor_scold":{"core":false,"desc":"皇帝只想把案子按下去。话说得太直，会先没命。","name":"天颜难测","tag":"testimony"},"empress_last_word":{"core":false,"desc":"戌时三刻皇后私访，劝贤妃把东西交出来。","name":"皇后「来做什么」","tag":"testimony"},"empress_motive":{"core":true,"desc":"贤妃手中握有太子之死的物证，皇后忌她。","name":"皇后的把柄","tag":"testimony"},"empress_ring":{"core":true,"desc":"皇后手上戴着一枚不该在女子手上的先帝玉扳指——那是太子的遗物。","name":"先帝所赐玉扳指","tag":"clue"},"fb_clean":{"core":true,"desc":"「内官监办事，从来不问为什么。上头要的是干净。」","name":"「上头要的是干净」","tag":"testimony"},"fb_key3":{"core":true,"desc":"前日寅时，领钥匙簿上是冯保的手笔。他说他前日不在宫里。","name":"冯保领了钥匙","tag":"doc"},"fb_word":{"core":true,"desc":"冯保只说了一句：「内官监的意思是，写成暴病。」","name":"内官监的口风","tag":"testimony"},"gf_handstove":{"core":false,"desc":"贵妃托炉时露出的炉底灰里，有一层不是安胎药颜色的细白药渣。","name":"手炉里的药渣","tag":"clue"},"ground_print":{"core":false,"desc":"青砖上一列湿脚印，自门至榻前，脚尖朝外——是退出去时踩的。","name":"地面足迹","tag":"clue"},"gy_cup":{"core":false,"desc":"盏底有细砂，汤早凉透了，尸身也已僵冷——这盏汤不是死前喝的。","name":"半盏姜汤","tag":"clue"},"gy_ink_finger":{"core":false,"desc":"高延年右手中指有墨痕，指腹还有纸灰。他死前在写字，可案上一张纸也没有。","name":"指尖的墨","tag":"clue"},"gy_pupils":{"core":true,"desc":"死者口唇发麻色，瞳仁不收。这不是心疾，是药——而且是入口就麻的那种。","name":"瞳仁不散、口唇麻色","tag":"clue"},"gy_time":{"core":true,"desc":"尸僵已过肩，尸温近砖。高延年死在子时之前——比值夜簿上他签的那一行早了一个更次。","name":"尸冷与尸僵","tag":"clue"},"hd_three_days":{"core":false,"desc":"皇帝要的不是凶手，是一个能写进结案文书的名字。","name":"三日的期限","tag":"doc"},"hh_night_visit":{"core":false,"desc":"戌时三刻入殿，半刻即出；她说她是来「讨一样东西」的。","name":"皇后夜访的时辰","tag":"doc"},"hxw_patrol":{"core":true,"desc":"戌时末他巡到药库门口，门是从外面锁着的——那时屋里已经有人不喘气了。","name":"贺小五的夜巡","tag":"testimony"},"jinghe_leaf":{"core":true,"desc":"「景和五年，药出经卷阁，三取其二，余一入凤仪。」","name":"残账一页","tag":"doc"},"jinghe_orig":{"core":true,"desc":"「景和五年，药出经卷阁，三取其二，余一入凤仪」——下面是三字朱批。","name":"景和五年原页","tag":"doc"},"jinghe_seal":{"core":true,"desc":"药库旧档上一枚封泥，印的是经卷阁的印——药怎么会从经卷阁出？","name":"景和五年的封泥","tag":"clue"},"jj_copy":{"core":true,"desc":"领用簿第七页的抄本，抄到一半断了笔，纸边有被人抽走的痕。","name":"蒋九抄的那一页","tag":"doc"},"jj_corpse":{"core":true,"desc":"口唇麻色、瞳仁不散、无外伤，灯还亮着——与高延年同一味药。","name":"蒋九的尸格","tag":"clue"},"jj_memory":{"core":true,"desc":"十二年前他还是药童，替人研过一味「安神的」药。研完，那人给了他一块糖。","name":"蒋九记得的事","tag":"testimony"},"jj_paper":{"core":false,"desc":"蒋九手心里攥着一角纸，被水浸过，只剩半个字：「亻」。","name":"灯下的残纸","tag":"clue"},"key_ledger3":{"core":true,"desc":"经卷阁的钥匙出入都要记。前日寅时那一行写着「内官监 · 领」，笔是冯保的手。","name":"领钥匙簿","tag":"doc"},"killer_knowledge":{"core":true,"desc":"他知道茶盏是碎的、知道裂纹的走向——那是在门内看过的。","name":"只有凶手知晓之事","tag":"clue"},"ladder_wax":{"core":false,"desc":"书梯第三档上有一道黄蜡的印，人的鞋底踩不出这个形状。","name":"书梯横档上的蜡痕","tag":"clue"},"ledger_gap":{"core":true,"desc":"苦杏仁油三年内支取七次，记的名都是王德海，字迹却各不相同。","name":"领用簿上的空档","tag":"doc"},"ledger_seventh":{"core":true,"desc":"七次取用：前六次在景和五年到十二年之间，第七次在贤妃薨的前一日。","name":"第七次取用","tag":"doc"},"locked_outside3":{"core":false,"desc":"丙字库的门从外落锁、加封，钥匙在内官监——屋里的人自己出不来。","name":"门是从外封的","tag":"clue"},"lq_stain":{"core":true,"desc":"她指腹上的黄渍是附子粉染的，洗不掉。她说她没碰过附子。","name":"柳青指腹的药渍","tag":"clue"},"lws_copy":{"core":true,"desc":"她替师父抄过景和五年的抄没名录，抄了三遍。第三遍师父让她烧了。","name":"陆文昭抄的那一本","tag":"doc"},"lws_tear":{"core":false,"desc":"抄本中缺一行——正是名录第十七行，采薇那一行。","name":"抄本上少的那一行","tag":"clue"},"needle_clean3":{"core":true,"desc":"银针入喉、入心、入指尖，三次都不变色：这一回的凶手不是药。","name":"银针不黑","tag":"clue"},"night_roster2":{"core":false,"desc":"「丑时初，巡库。」字是他的。写下这一行的时候，他已经死了。","name":"值夜簿上的丑时初","tag":"doc"},"old_record":{"core":true,"desc":"十二年前宫人采薇以「窃」杖毙，卷内证人供词与验伤单都是同一人手笔。","name":"掖庭旧档 · 采薇案","tag":"doc"},"pillow_letter":{"core":true,"desc":"贤妃笔迹：「采薇之死，疑非杖毙。王德海经手，账目有亏。」未写完。","name":"枕下密信","tag":"clue"},"purge_names":{"core":true,"desc":"景和五年冬，东宫旧人抄没名录：二十九人，死于狱、死于杖、死于「疾」。","name":"景和五年抄没名录","tag":"doc"},"road_out3":{"core":false,"desc":"从经卷阁往南是宫门。你走过两回，两回都在天亮前。","name":"出宫的路","tag":"clue"},"room_smell":{"core":false,"desc":"丙字库里只有陈纸、霉与炭气，没有一丝药的苦味。","name":"库里没有药味","tag":"clue"},"seal_changed":{"core":true,"desc":"药库封条是前一日换的，签名「高延年」，笔锋却不是他的。","name":"换封条的人","tag":"doc"},"seal_recast":{"core":true,"desc":"封泥是旧的，泥胎却是新的：有人拿旧印翻了个模，重新盖了一枚。","name":"翻模的封泥","tag":"clue"},"shelf_gap":{"core":false,"desc":"丙字库第七架上空出一函的位置，灰印是新的——那一函昨夜还在这儿。","name":"架上少了一函","tag":"clue"},"si_needle":{"core":true,"desc":"银针入指尖即黑；血色不凝、口鼻无沫，非即刻致命之毒。","name":"银针验毒结果","tag":"clue"},"silver_week":{"core":true,"desc":"以茶汤浸针七日可令针黑；此毒非一回可致。","name":"银针变黑是七日积毒","tag":"clue"},"smb_hand":{"core":false,"desc":"「不足以致死，再杖」——笔锋起笔重、收笔轻，与沈墨白年记的字一样。","name":"写在行刑单上的那一行","tag":"doc"},"store_key":{"core":false,"desc":"死者右手攥着药库的铜药匙，匙齿有新磨的痕——常被人拿去撬东西。","name":"铜药匙","tag":"item"},"tea_almond":{"core":true,"desc":"茶已冷，凑近有淡淡苦杏仁味，非茶香。","name":"残茶苦杏仁味","tag":"clue"},"tea_set":{"core":true,"desc":"青瓷盏，盏底沉着一层薄白粉末，已干。","name":"安神茶盏","tag":"item"},"third_name":{"core":false,"desc":"残账背面只剩一横，看不清是谁。但那一横起笔很重。","name":"被水浸过的名字","tag":"clue"},"third_name3":{"core":true,"desc":"原页上第一味药的名字被墨涂了，涂得很厚：写它的人不愿留名。","name":"那味药的名字","tag":"doc"},"three_line3":{"core":true,"desc":"凤仪殿、尚药局、经卷阁：一剂慢药，一支笔，一枚印，三桩案。","name":"三案一条线","tag":"clue"},"timeline_testimony":{"core":false,"desc":"戌时遣退宫人，亥时末送宵夜时「敲门不应」。","name":"王德海供述的时间线","tag":"testimony"},"two_cases_method":{"core":true,"desc":"凤仪殿与药库是同一种做法：先下慢药，再从外面合上一道门。","name":"同一种手法","tag":"clue"},"vent_wax":{"core":true,"desc":"气窗被人从里侧用油纸封住，纸角压着内官监封缄才用的黄蜡。","name":"气窗上的油纸与黄蜡","tag":"clue"},"verdict2_draft":{"core":false,"desc":"第二份结案底稿。这一次，纸上有两个案子。","name":"第二份底稿","tag":"doc"},"verdict3_draft":{"core":false,"desc":"第三份结案底稿。这一份写下去，纸上有三个案子、一个不能写的名字。","name":"第三份底稿","tag":"doc"},"wax_match":{"core":true,"desc":"封泥上的蜡与气窗上的蜡，切口、色、气味都对得上：同一块蜡，同一个人。","name":"两处黄蜡是一块","tag":"clue"},"wdh_slips":{"core":false,"desc":"三问三答，每一答都更往里一步；「面色如生，还饮着茶」是他自己说漏的。","name":"王德海的三次改口","tag":"testimony"},"window_scratch":{"core":true,"desc":"左窗棂上有一道新鲜撬痕，自外而内，刃口极薄。","name":"窗棂刮痕","tag":"clue"},"xse_fear_note":{"core":false,"desc":"他抄过领用簿上的一页，随后那页纸被总管要走了。","name":"小顺子抄过的那一页","tag":"testimony"},"xse_footprint":{"core":false,"desc":"他曾绕到殿后，在雪泥里留下半只草鞋印，比窗下的印小两寸。","name":"小顺子的脚印","tag":"testimony"},"xse_testimony":{"core":true,"desc":"亥时初他送茶入殿，门未上栓，听到贤妃问「你来做什么」。","name":"小顺子的证词","tag":"testimony"},"xyp_face":{"core":false,"desc":"唇色比活人还红，指甲不青不紫。她脸上没有半点痛色。","name":"口唇鲜红 · 十指不青","tag":"clue"},"xyp_hand":{"core":true,"desc":"她右手攥着半页纸，纸角有景和五年的年号，另一半被人抽走了。","name":"她手里攥着的半页","tag":"clue"},"xyp_lastvisit":{"core":true,"desc":"调档单上，昨日午前她取过景和五年丙字第七函，登记的理由写着两个字：「对账」。","name":"她昨日查过景和五年","tag":"doc"},"xyp_livid":{"core":true,"desc":"尸斑不是紫的，是樱红的，按下去褪色又回红——炭气的记号。","name":"樱红的尸斑","tag":"clue"},"xyp_note":{"core":false,"desc":"日课簿格子下面一行小字，是她的笔，写得很轻：「十七行，不必问。」","name":"「十七行，不必问。」","tag":"doc"},"yamen_draft":{"core":false,"desc":"底稿不存档，写完即销；写下第一个名字，就没有回头路。","name":"结案陈词的底稿","tag":"doc"},"zzz_confession":{"core":true,"desc":"七次取用是他写的名，字是替人抄的。抄同一支笔，抄了十二年。","name":"掌局的供述","tag":"testimony"},"zzz_pressure":{"core":false,"desc":"先说高延年是心疾，改口说「也许是夜里受了寒」，第三次就不说话了。","name":"掌局的第一次改口","tag":"testimony"},"zzz_private":{"core":true,"desc":"一本私账，每笔只写四个字：「药出有主」。没有名字，只画押。","name":"掌局的私账","tag":"doc"}},"prologue":"景和十七年，冬。\n子时三刻，凤仪殿。贤妃苏氏薨于榻上，口角黑血未干。\n宫门落锁，皇帝只留下一个人查这件事——大理寺仵作，沈墨白。\n「三日之内，给朕一个名字。」\n你抬头看见殿外的灯。三日之后，灯还亮着的，未必是你。","scenes":{"accuse_hall":{"act":5,"body":"你把记事簿摊在正殿的案上，一页页排开：银针、黑血、茶、香灰、脚印、窗棂上的刮痕、簿子里空着的名字。\n皇帝坐在上头。皇后在左，贵妃在右，王德海跪在中间，小顺子跪在他后面。\n「说吧。」皇帝说，「说出那个名字。」\n你开口之前，先在心里把所有的线头收成一句：这个人有什么手段、有什么动机、又是怎么进的殿。\n（核心证据越齐，你的话越难被驳倒。）","case":1,"choices":[{"detail":"以茶下毒，再以朱砂布下障眼法","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":"verdict_WDH","score":0,"text":null,"time":null,"trust":[],"unlock":null},"key":"verdict_WDH::「凶手是 —— 太监总管 王德海」","label":"「凶手是 —— 太监总管 王德海」","locked_hint":"","locked_if":null,"repeatable":true,"suspect":"WDH","tag":"accuse","to":"","visible_if":null,"wants":""},{"detail":"戌时私访，为太子之死灭口","effect":{"add_clues":[],"add_dossiers":[],"add_items":[],"flags":[],"hurt":0,"scene":"verdict_HH","score":0,"text":null,"time":null,"trust":[],"unlock":null
