<!-- 一枚可见的图标模板：ui.js 拿它 cloneNode(true)、再把 use 的 href 改指到别的精灵。
     缩成 0×0 藏起来只是不让它自己占一行——clone 出来的是里面那只 svg，样式一点不少。 -->
<div id="icon-tpl" style="position:absolute;width:0;height:0;overflow:hidden"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-scroll"/></svg></div>

<div id="app"></div>

<!-- 剧本数据：与终端版由 tools/audit_web.py 逐步比对，保证同一套判定 -->
<script id="pack" type="application/json">__PACK__</script>
<!-- 图景台账：色调 / 时辰明暗 / 字形词表，由 gongwei/web/art.py 生成 -->
<script id="art" type="application/json">__ART_TABLES__</script>
<script>
(function () {
  var node = document.getElementById("pack");
  try {
    window.__GONGWEI_PACK__ = JSON.parse(node.textContent);
  } catch (err) {
    document.body.innerHTML = "<p style='padding:20px'>剧本数据读不出来：" + err.message + "</p>";
    return;
  }
  // 图景台账缺了不致命：ui.js 会退到默认色调，游戏照玩
  var art = document.getElementById("art");
  try {
    window.__GONGWEI_ART__ = art ? JSON.parse(art.textContent) : null;
  } catch (err2) {
    window.__GONGWEI_ART__ = null;
  }
})();
</script>

<!-- 引擎：gongwei/game/engine.py 的 JS 对等实现（UMD） -->
<script>
__GAME_JS__
</script>

<!-- 界面 -->
<script>
__UI_JS__
</script>
