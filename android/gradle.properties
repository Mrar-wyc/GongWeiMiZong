# 只给 2G 堆：这个工程是一个 Activity + 一个 WebView，没有别的模块。
org.gradle.jvmargs=-Xmx2g

# 这条是**故意**写成 false 的，不是忘了打开。
# 全工程零第三方依赖：MainActivity 直接继承 android.app.Activity，主题用系统自带的
# android:Theme.Material.Light.NoActionBar —— 一行 AndroidX 都不引，所以也不需要
# Jetifier 去改写包名。谁要是哪天想引 androidx.*，先看 AGENTS.md 的「零第三方依赖」。
android.useAndroidX=false
